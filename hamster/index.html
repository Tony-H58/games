<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>倉鼠吃瓜子</title>
<style>
  html,body{margin:0;height:100%;background:#2a1a0e;color:#fff;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 2px;font-size:11px;color:#fde4b8}
  #hud b{display:block;font-size:19px;color:#fff;font-variant-numeric:tabular-nums}
  #tip{text-align:center;font-size:13px;height:18px;color:#fde047}
  #wrap{position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
  canvas{display:block;touch-action:none;border-radius:12px}
  #ctrl{display:grid;grid-template-columns:1fr 64px 64px 64px 1fr;grid-template-rows:48px 48px;gap:6px;padding:6px 12px 14px}
  #ctrl button{border:0;border-radius:14px;background:#5c3a1e;color:#fff;font-size:22px;font-weight:900;box-shadow:0 4px 0 #2a1a0e;touch-action:none}
  #ctrl button.on{transform:translateY(3px);box-shadow:0 1px 0 #2a1a0e;background:#7c4f28}
  #bU{grid-column:3;grid-row:1}#bL{grid-column:2;grid-row:2}#bD{grid-column:3;grid-row:2}#bR{grid-column:4;grid-row:2}
  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5}
  .box{background:#3b2412f5;border:2px solid #fb923c;border-radius:16px;padding:18px;width:min(320px,88%);text-align:center}
  .box h2{margin:0 0 6px;font-size:27px;color:#fdba74}
  .box p{font-size:12.5px;line-height:1.75;margin:6px 0 12px;text-align:left}
  .go{width:100%;background:#ea580c;color:#fff;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:800}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 14px}
  .stats div{background:#0006;border-radius:10px;padding:7px;font-size:11px}
  .stats b{display:block;font-size:19px;color:#fdba74}
  #rec{font-size:11px;color:#fed7aa;margin-bottom:10px}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div>分數<b id="hScore">0</b></div>
    <div>關卡<b id="hLv">1</b></div>
    <div>最高分<b id="hBest">0</b></div>
    <div style="text-align:right">生命<b id="hLife">🐹🐹🐹</b></div>
  </div>
  <div id="tip"></div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div class="ov" id="menu"><div class="box">
      <h2>🐹 倉鼠吃瓜子</h2>
      <p>把迷宮裡的 <b>瓜子</b> 全部吃光就過關！<br>
      👆 在畫面上<b>往上下左右滑</b>改變方向，倉鼠會一直往前跑；也可以用下方方向鍵。<br>
      🐱 小心四隻貓咪：<b>虎斑貓</b>直接追你、<b>黑貓</b>會繞到前面堵你、<b>三花貓</b>在附近亂晃、<b>暹羅貓</b>一下追一下逃。<br>
      🍓 吃到大草莓變成 <b>超級倉鼠</b>，貓咪會嚇得逃跑，撞到牠可以把牠趕回貓窩加分！<br>
      ↔️ 左右兩邊的隧道可以鑽到另一邊。</p>
      <div id="rec"></div>
      <button class="go" id="start">開始遊戲</button>
    </div></div>
    <div class="ov" id="over" hidden><div class="box">
      <h2 id="oTitle">遊戲結束</h2>
      <div class="stats" id="oStats"></div>
      <button class="go" id="again">再玩一次</button>
    </div></div>
  </div>
  <div id="ctrl">
    <button id="bU">▲</button><button id="bL">◀</button><button id="bD">▼</button><button id="bR">▶</button>
  </div>
</div>
<script>
(() => {
const $ = id => document.getElementById(id);
const COLS = 19, ROWS = 21, TS = 20, OX = 10, OY = 6, W = COLS * TS + OX * 2, H = ROWS * TS + OY * 2;
const DIR = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] }, OPP = { U: 'D', D: 'U', L: 'R', R: 'L' }, ORDER = ['U', 'L', 'D', 'R'];
const HOUSE = { x0: 7, x1: 11, y0: 8, y1: 10, door: { x: 9, y: 8 } };
const START = { x: 9, y: 15 }, TUNNEL_Y = 13;
const FRUITS = ['🍎', '🍇', '🍉', '🍌', '🥝'];
const CATS = [
  { name: '虎斑貓', body: '#f59e0b', dark: '#b45309', stripes: true, corner: { x: COLS - 2, y: 0 } },
  { name: '黑貓', body: '#1f2937', dark: '#030712', eye: '#a3e635', corner: { x: 1, y: 0 } },
  { name: '三花貓', body: '#fafafa', dark: '#9ca3af', patches: true, corner: { x: COLS - 2, y: ROWS - 1 } },
  { name: '暹羅貓', body: '#fde7c7', dark: '#57361e', mask: true, eye: '#60a5fa', corner: { x: 1, y: ROWS - 1 } },
];
const cv = $('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const wr = $('wrap').getBoundingClientRect();
  const s = Math.min((wr.width - 6) / W, (wr.height - 6) / H), d = window.devicePixelRatio || 1;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * d); cv.height = Math.round(H * s * d); scale = s * d;
}
addEventListener('resize', resize);

/* 音效 */
let ac = null;
function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } else if (ac.state === 'suspended') ac.resume(); }
function tone(f, d, type = 'sine', v = .06, f2, delay = 0) { if (!ac) return; const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02); }
let crunch = 0;
const sSeed = () => { crunch ^= 1; tone(crunch ? 1500 : 1200, .03, 'square', .025); };
const sBerry = () => [523, 784, 1047].forEach((f, i) => tone(f, .1, 'triangle', .07, null, i * .05));
const sEatCat = () => { tone(300, .25, 'square', .06, 1200); };
const sDie = () => { for (let i = 0; i < 8; i++) tone(700 - i * 70, .1, 'triangle', .06, null, i * .09); };
const sFruit = () => [880, 1320].forEach((f, i) => tone(f, .12, 'sine', .07, null, i * .08));
const sClear = () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, .14, 'sine', .07, null, i * .1));
const sReady = () => [392, 523, 659, 784].forEach((f, i) => tone(f, .14, 'triangle', .06, null, i * .14));
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* 迷宮產生（固定種子：每關的迷宮固定） */
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let map = [];   // '#' 牆, ' ' 走道, '-' 貓窩門, 'H' 貓窩
const at = (x, y) => (y < 0 || y >= ROWS) ? '#' : (x < 0 || x >= COLS) ? (y === TUNNEL_Y ? ' ' : '#') : map[y][x];
function makeMaze(seed) {
  for (let tries = 0; tries < 60; tries++) {
    const R = rng(seed * 97 + tries * 13 + 7);
    const CW = 5, CH = 10;   // 左半邊 5 欄（含中線）× 10 列
    const g = [...Array(ROWS)].map(() => Array(COLS).fill('#'));
    const open = (cx, cy) => { g[cy * 2 + 1][cx * 2 + 1] = ' '; };
    const link = (ax, ay, bx, by) => { g[ay + by + 1][ax + bx + 1] = ' '; };
    const seen = new Set(), st = [[0, 0]]; seen.add('0,0'); open(0, 0);
    while (st.length) {
      const [x, y] = st[st.length - 1];
      const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [x + dx, y + dy]).filter(([a, b]) => a >= 0 && b >= 0 && a < CW && b < CH && !seen.has(a + ',' + b));
      if (!nb.length) { st.pop(); continue; }
      const [a, b] = nb[(R() * nb.length) | 0]; seen.add(a + ',' + b); open(a, b); link(x, y, a, b); st.push([a, b]);
    }
    // 去除死路（打通額外的牆），並多開一些環路
    for (let cy = 0; cy < CH; cy++) for (let cx = 0; cx < CW; cx++) {
      const X = cx * 2 + 1, Y = cy * 2 + 1;
      const ways = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => g[Y + dy]?.[X + dx] === ' ').length;
      if (ways <= 1 || R() < .18) {
        const cand = [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => { const a = cx + dx, b = cy + dy; return a >= 0 && b >= 0 && a < CW && b < CH && g[Y + dy][X + dx] === '#'; });
        if (cand.length) { const [dx, dy] = cand[(R() * cand.length) | 0]; g[Y + dy][X + dx] = ' '; }
      }
    }
    // 左右對稱
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < 9; x++) g[y][COLS - 1 - x] = g[y][x];
    // 貓窩與周圍走道
    for (let y = HOUSE.y0 - 1; y <= HOUSE.y1 + 1; y++) for (let x = HOUSE.x0 - 1; x <= HOUSE.x1 + 1; x++) g[y][x] = ' ';
    for (let y = HOUSE.y0; y <= HOUSE.y1; y++) for (let x = HOUSE.x0; x <= HOUSE.x1; x++) g[y][x] = (y === HOUSE.y0 || y === HOUSE.y1 || x === HOUSE.x0 || x === HOUSE.x1) ? '#' : 'H';
    g[HOUSE.door.y][HOUSE.door.x] = '-';
    // 隧道
    g[TUNNEL_Y][0] = ' '; g[TUNNEL_Y][COLS - 1] = ' '; g[TUNNEL_Y][1] = ' '; g[TUNNEL_Y][COLS - 2] = ' ';
    // 外框（除了隧道）
    for (let y = 0; y < ROWS; y++) { if (y !== TUNNEL_Y) { g[y][0] = '#'; g[y][COLS - 1] = '#'; } }
    for (let x = 0; x < COLS; x++) { g[0][x] = '#'; g[ROWS - 1][x] = '#'; }
    g[START.y][START.x] = ' ';
    // 檢查：所有走道互通、沒有死路
    map = g;
    const seen2 = new Set([START.x + ',' + START.y]), q = [START];
    while (q.length) { const c = q.shift(); for (const d of ORDER) { const [dx, dy] = DIR[d]; let nx = c.x + dx, ny = c.y; ny = c.y + dy; if (nx < 0) nx = COLS - 1; if (nx >= COLS) nx = 0; if (at(nx, ny) === ' ' && !seen2.has(nx + ',' + ny)) { seen2.add(nx + ',' + ny); q.push({ x: nx, y: ny }); } } }
    let total = 0, dead = 0;
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (g[y][x] === ' ') { total++; const w = ORDER.filter(d => at(x + DIR[d][0], y + DIR[d][1]) !== '#').length; if (w <= 1 && !(y === TUNNEL_Y && (x === 0 || x === COLS - 1))) dead++; }
    if (seen2.size === total && dead === 0) return g;
  }
  return map;
}

/* 狀態 */
let best = 0; try { best = +localStorage.getItem('hamBest') || 0; } catch (e) {}
let state = 'menu', time = 0, level = 0, score = 0, lives = 3, seeds = new Set(), berries = new Set(), totalSeeds = 0, eaten = 0;
let me = null, cats = [], wantDir = null, mode = 'scatter', modeT = 0, modeIdx = 0, power = 0, eatChain = 0, readyT = 0, deathT = 0, clearT = 0, fruit = null, fruitDrops = 0, fx = [], catsEaten = 0;
const MODES = [7, 20, 7, 20, 5, 25, 5, 1e9];
const key = (x, y) => x + ',' + y;
function setTip(s) { $('tip').textContent = s; }
function hud() { $('hScore').textContent = score; $('hLv').textContent = level + 1; $('hBest').textContent = Math.max(best, score); $('hLife').textContent = '🐹'.repeat(Math.max(0, lives)); }
const recText = () => $('rec').textContent = best ? `最高分 ${best}` : '';
recText();

function loadLevel(n) {
  level = n; map = makeMaze((n % 5) + 1);
  seeds = new Set(); berries = new Set();
  const berrySpots = [[1, 3], [COLS - 2, 3], [1, ROWS - 5], [COLS - 2, ROWS - 5]];
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (map[y][x] !== ' ') continue;
    if (y >= HOUSE.y0 - 1 && y <= HOUSE.y1 + 1 && x >= HOUSE.x0 - 1 && x <= HOUSE.x1 + 1) continue;
    if (y === TUNNEL_Y && (x <= 1 || x >= COLS - 2)) continue;
    if (x === START.x && y === START.y) continue;
    seeds.add(key(x, y));
  }
  for (const [bx, by] of berrySpots) {   // 找最近的走道放草莓
    let bestK = null, bd = 1e9;
    for (const k of seeds) { const [x, y] = k.split(',').map(Number), d = Math.abs(x - bx) + Math.abs(y - by); if (d < bd) { bd = d; bestK = k; } }
    if (bestK) { seeds.delete(bestK); berries.add(bestK); }
  }
  totalSeeds = seeds.size + berries.size; eaten = 0; fruit = null; fruitDrops = 0;
  resetActors(); hud();
}
function resetActors() {
  me = { x: START.x, y: START.y, fx: START.x, fy: START.y, dir: 'L', moving: true, cheek: 0, face: -1 };
  wantDir = 'L';
  const houseSpots = [[9, 7, 0], [8, 9, 3], [9, 9, 6], [10, 9, 10]];
  cats = CATS.map((c, i) => ({ ...c, i, x: houseSpots[i][0], y: houseSpots[i][1], fx: houseSpots[i][0], fy: houseSpots[i][1], dir: 'U', st: i === 0 ? 'roam' : 'house', release: houseSpots[i][2] + Math.max(0, 2 - level), fright: false, ftime: 0 }));
  cats[0].x = cats[0].fx = HOUSE.door.x; cats[0].y = cats[0].fy = HOUSE.door.y - 1; cats[0].dir = 'L';
  mode = 'scatter'; modeT = 0; modeIdx = 0; power = 0;
  readyT = 1.8; sReady(); setTip('準備！');
}
function startGame() { score = 0; lives = 3; catsEaten = 0; fx = []; $('menu').hidden = true; $('over').hidden = true; state = 'play'; loadLevel(0); }
$('start').onclick = () => { initAudio(); startGame(); };
$('again').onclick = () => { initAudio(); startGame(); };

/* 操作 */
const toLocal = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; };
let sw = null;
cv.addEventListener('pointerdown', e => { initAudio(); try { cv.setPointerCapture(e.pointerId); } catch (er) {} sw = { id: e.pointerId, ...toLocal(e) }; });
cv.addEventListener('pointermove', e => {
  if (!sw || e.pointerId !== sw.id) return;
  const q = toLocal(e), dx = q.x - sw.x, dy = q.y - sw.y;
  if (Math.hypot(dx, dy) < 18) return;
  wantDir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U');
  sw = { id: sw.id, ...q };
});
cv.addEventListener('pointerup', () => sw = null); cv.addEventListener('pointercancel', () => sw = null);
for (const [id, d] of [['bU', 'U'], ['bD', 'D'], ['bL', 'L'], ['bR', 'R']]) {
  const b = $(id);
  b.addEventListener('pointerdown', e => { initAudio(); e.preventDefault(); wantDir = d; b.classList.add('on'); });
  const off = () => b.classList.remove('on'); b.addEventListener('pointerup', off); b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
}
addEventListener('keydown', e => { const d = { ArrowUp: 'U', ArrowDown: 'D', ArrowLeft: 'L', ArrowRight: 'R', KeyW: 'U', KeyS: 'D', KeyA: 'L', KeyD: 'R' }[e.code]; if (d) { e.preventDefault(); initAudio(); wantDir = d; } });

/* 移動 */
const passable = (x, y, who) => { const c = at(x, y); if (c === ' ') return true; if (c === '-' || c === 'H') return who === 'cat'; return false; };
function wrap(o) { if (o.x < 0) { o.x = COLS - 1; o.fx = COLS; } if (o.x >= COLS) { o.x = 0; o.fx = -1; } }
function moveEntity(o, spd, dt, chooseDir, who) {
  // o.x,o.y 是要前往的格子；o.fx,o.fy 是目前位置（浮點）
  let left = spd * dt;
  while (left > 0) {
    const dx = o.x - o.fx, dy = o.y - o.fy, d = Math.abs(dx) + Math.abs(dy);
    if (d > 1e-6) { const m = Math.min(left, d); o.fx += Math.sign(dx) * Math.min(m, Math.abs(dx)); o.fy += Math.sign(dy) * Math.min(m, Math.abs(dy)); left -= m; if (m < d) break; }
    // 到達格子中心
    o.fx = o.x; o.fy = o.y;
    if (o.fx >= COLS) o.fx = o.x = 0; if (o.fx < 0) o.fx = o.x = COLS - 1;
    const nd = chooseDir(o);
    if (!nd) { o.moving = false; break; }
    o.dir = nd; o.moving = true;
    o.x += DIR[nd][0]; o.y += DIR[nd][1];
    if (o.x < 0) { o.x = -1; } if (o.x >= COLS) { o.x = COLS; }
    if (o.x === -1) { o.fx = COLS; o.x = COLS - 1; } else if (o.x === COLS) { o.fx = -1; o.x = 0; }
    if (who === 'me') arriveCheck = true;
  }
}
let arriveCheck = false;
function meChoose(o) {
  eatAt(o.x, o.y);
  if (wantDir && passable(o.x + DIR[wantDir][0], o.y + DIR[wantDir][1], 'me')) return wantDir;
  if (passable(o.x + DIR[o.dir][0], o.y + DIR[o.dir][1], 'me')) return o.dir;
  return null;
}
function eatAt(x, y) {
  const k = key(x, y);
  if (seeds.has(k)) { seeds.delete(k); eaten++; score += 10; sSeed(); me.cheek = Math.min(1, me.cheek + .08); hud(); checkFruit(); }
  else if (berries.has(k)) { berries.delete(k); eaten++; score += 50; sBerry(); vib(30); startPower(); hud(); checkFruit(); }
  if (fruit && x === fruit.x && y === fruit.y) { const pts = 100 * (level + 1) + 100; score += pts; sFruit(); fx.push({ s: `+${pts}`, x, y, t: 1.2, col: '#fde047' }); fruit = null; hud(); }
  if (!seeds.size && !berries.size && state === 'play') levelClear();
}
function checkFruit() { if ((eaten === 60 || eaten === 140) && fruitDrops < 2) { fruitDrops++; fruit = { x: START.x, y: HOUSE.y1 + 1, e: FRUITS[level % 5], t: 9 }; } }
function startPower() {
  power = Math.max(2.5, 7 - level * .9); eatChain = 0;
  for (const c of cats) if (c.st === 'roam') { c.fright = true; if (c.fx !== c.x || c.fy !== c.y) reverse(c); }
  setTip('🍓 超級倉鼠！快去追貓咪！');
}
function catTarget(c) {
  if (c.st === 'eyes') return { x: HOUSE.door.x, y: HOUSE.door.y - 1 };
  if (c.st === 'leave') return { x: HOUSE.door.x, y: HOUSE.door.y - 1 };
  if (mode === 'scatter') return c.corner;
  const [dx, dy] = DIR[me.dir];
  if (c.i === 0) return { x: me.x, y: me.y };
  if (c.i === 1) return { x: me.x + dx * 4, y: me.y + dy * 4 };
  if (c.i === 2) return Math.hypot(c.x - me.x, c.y - me.y) > 7 ? { x: me.x, y: me.y } : c.corner;
  return (Math.floor(time / 4) % 2) ? { x: me.x - dx * 2, y: me.y - dy * 2 } : c.corner;
}
function catChoose(c) {
  // 出貓窩：先走到門正上方
  if (c.st === 'leave' && c.x === HOUSE.door.x && c.y === HOUSE.door.y - 1) c.st = 'roam';
  if (c.st === 'eyes' && c.x === HOUSE.door.x && c.y === HOUSE.door.y - 1) { c.st = 'enter'; }
  if (c.st === 'enter') { if (c.y < 9) return 'D'; c.st = 'house'; c.release = .8; c.fright = false; return null; }
  if (c.st === 'leave') { if (c.x !== HOUSE.door.x) return c.x < HOUSE.door.x ? 'R' : 'L'; return 'U'; }
  const opts = ORDER.filter(d => d !== OPP[c.dir] && passable(c.x + DIR[d][0], c.y + DIR[d][1], 'cat') && (c.st === 'eyes' || at(c.x + DIR[d][0], c.y + DIR[d][1]) === ' '));
  if (!opts.length) return OPP[c.dir];
  if (c.fright) return opts[(Math.random() * opts.length) | 0];
  const t = catTarget(c);
  opts.sort((a, b) => Math.hypot(c.x + DIR[a][0] - t.x, c.y + DIR[a][1] - t.y) - Math.hypot(c.x + DIR[b][0] - t.x, c.y + DIR[b][1] - t.y));
  return opts[0];
}

/* 更新 */
function update(dt) {
  time += dt; fx.forEach(f => f.t -= dt); fx = fx.filter(f => f.t > 0);
  if (state !== 'play') return;

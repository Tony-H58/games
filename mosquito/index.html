<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>打蚊子</title>
<style>
  html,body{margin:0;height:100%;background:#1b1712;color:#fff8ec;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #hud{max-width:520px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:8px 12px 4px;font-size:11px}
  #hud b{display:block;font-size:21px;font-variant-numeric:tabular-nums;color:#ffd166}
  #bites{font-size:17px;letter-spacing:1px}
  #wrap{position:relative;display:flex;justify-content:center}
  canvas{display:block;touch-action:none;border-radius:12px}
  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .box{background:#2b2217ee;border:2px solid #e9c46a;border-radius:16px;padding:20px;width:min(300px,84%);text-align:center}
  .box h2{margin:0 0 6px;font-size:30px;color:#ffd166}
  .box p{font-size:13px;opacity:.9;line-height:1.7;margin:6px 0 14px}
  .go{width:100%;background:#e63946;color:#fff;border:0;border-radius:10px;padding:13px;font-size:17px;font-weight:800}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0 14px}
  .stats div{background:#0003;border-radius:10px;padding:7px;font-size:11px;opacity:.95}
  .stats b{display:block;font-size:20px;color:#ffd166}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="hud">
  <div>時間<b id="hTime">60</b></div>
  <div>分數<b id="hScore">0</b></div>
  <div>連擊<b id="hCombo">0</b></div>
  <div style="text-align:right">被叮<div id="bites"></div></div>
</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="ov" id="menu"><div class="box">
    <h2>🦟 打蚊子</h2>
    <p>半夜被蚊子吵醒了！<br>看到蚊子就<b>點下去拍死牠</b>，60 秒內打越多越好。<br>蚊子停在大腿上太久會叮你，<b>被叮 5 包就輸了</b>。<br>🐯 虎斑蚊要拍 2 下・👑 金色蚊子王加大分</p>
    <button class="go" id="start">開燈，開打！</button>
  </div></div>
  <div class="ov" id="over" hidden><div class="box">
    <h2 id="oTitle"></h2>
    <div class="stats">
      <div>分數<b id="sScore"></b></div><div>打死<b id="sKill"></b></div>
      <div>命中率<b id="sAcc"></b></div><div>被叮<b id="sBite"></b></div>
      <div>最高連擊<b id="sCombo"></b></div><div>最高分<b id="sBest"></b></div>
    </div>
    <button class="go" id="again">再打一場</button>
  </div></div>
</div>
<script>
(() => {
const W = 400, H = 660, GAME_T = 60, MAX_BITES = 5;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const top = document.getElementById('hud').offsetHeight;
  const s = Math.min((innerWidth - 8) / W, (innerHeight - top - 8) / H), d = window.devicePixelRatio || 1;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * d); cv.height = Math.round(H * s * d); scale = s * d;
}
addEventListener('resize', resize); resize();

/* 音效 */
let ac = null, buzzO = null, buzzG = null, buzzL = null;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (ac.state === 'suspended') ac.resume();
  if (!buzzO) {
    buzzO = ac.createOscillator(); buzzO.type = 'sawtooth'; buzzO.frequency.value = 560;
    const lfo = ac.createOscillator(), lg = ac.createGain(); lfo.frequency.value = 7; lg.gain.value = 25; lfo.connect(lg).connect(buzzO.frequency); lfo.start();
    buzzL = ac.createBiquadFilter(); buzzL.type = 'bandpass'; buzzL.frequency.value = 900; buzzL.Q.value = 1.2;
    buzzG = ac.createGain(); buzzG.gain.value = 0;
    buzzO.connect(buzzL).connect(buzzG).connect(ac.destination); buzzO.start();
  }
}
function setBuzz(v, f) { if (buzzG) { buzzG.gain.setTargetAtTime(v, ac.currentTime, .08); buzzO.frequency.setTargetAtTime(f, ac.currentTime, .1); } }
function slapSound(hit) {
  if (!ac) return;
  const n = ac.sampleRate * .12, buf = ac.createBuffer(1, n, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4);
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
  src.buffer = buf; f.type = 'lowpass'; f.frequency.value = hit ? 2200 : 1400; g.gain.value = hit ? .55 : .35;
  src.connect(f).connect(g).connect(ac.destination); src.start();
}
function ding(f, d = .12) { if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d); }

/* 場景 */
const WIN = { x: 250, y: 40, w: 120, h: 130 };
const ARM_Y = 560;   // 腿部中線
const LEG_X0 = 124, LEG_X1 = 392;   // 蚊子可停的腿部範圍
const kneeBump = x => x > 258 && x < 292 ? 3.5 * Math.sin((x - 258) / 34 * Math.PI) : 0;
const armTop = x => (x < 270 ? 512 + (x - 100) / 170 * 36 - 6 * Math.sin(Math.max(0, x - 100) / 170 * Math.PI) : 548 + (x - 270) * .12) - kneeBump(x);   // 上側腿上緣
const legBot = x => x < 262 ? 606 - (x - 100) / 162 * 14 + 5 * Math.sin(Math.max(0, x - 100) / 162 * Math.PI)
  : x < 285 ? 592 + (x - 262) * .04 - 1.5 * Math.sin((x - 262) / 23 * Math.PI)
  : 593 - (x - 285) * .08 + 10 * (Math.exp(-(((x - 322) / 30) ** 2)) - Math.exp(-((37 / 30) ** 2)) * Math.max(0, 1 - (x - 285) / 20));
const lowTop = x => 586 + (x - 100) * .06 - 3 * Math.sin(Math.min(1, Math.max(0, (x - 100) / 180)) * Math.PI);
const lowBot = x => x < 285 ? 644 - (x - 100) * .04 : 636.6 - (x - 285) * .08 + 5 * (Math.exp(-(((x - 330) / 28) ** 2)) - .075 * Math.max(0, 1 - (x - 285) / 20));
const bg = document.createElement('canvas'); bg.width = W * 2; bg.height = H * 2;
(() => {
  const g = bg.getContext('2d'); g.scale(2, 2);
  const wall = g.createLinearGradient(0, 0, 0, H); wall.addColorStop(0, '#f1e3c6'); wall.addColorStop(1, '#e2cfa8');
  g.fillStyle = wall; g.fillRect(0, 0, W, H);
  for (let x = 0; x < W; x += 28) { g.fillStyle = 'rgba(160,130,90,.07)'; g.fillRect(x, 0, 14, H); }
  // 檯燈光暈
  const lamp = g.createRadialGradient(70, 120, 10, 70, 120, 260); lamp.addColorStop(0, 'rgba(255,240,180,.55)'); lamp.addColorStop(1, 'rgba(255,240,180,0)');
  g.fillStyle = lamp; g.fillRect(0, 0, W, H);
  // 窗戶
  g.fillStyle = '#5b4632'; g.fillRect(WIN.x - 8, WIN.y - 8, WIN.w + 16, WIN.h + 16);
  const sky = g.createLinearGradient(0, WIN.y, 0, WIN.y + WIN.h); sky.addColorStop(0, '#0b1d3a'); sky.addColorStop(1, '#23395d');
  g.fillStyle = sky; g.fillRect(WIN.x, WIN.y, WIN.w, WIN.h);
  g.fillStyle = '#fff6c8'; g.beginPath(); g.arc(WIN.x + 88, WIN.y + 34, 14, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#0b1d3a'; g.beginPath(); g.arc(WIN.x + 94, WIN.y + 30, 12, 0, Math.PI * 2); g.fill();
  for (let i = 0; i < 14; i++) { g.fillStyle = '#fff'; g.fillRect(WIN.x + Math.random() * WIN.w, WIN.y + Math.random() * WIN.h * .7, 1.5, 1.5); }
  g.fillStyle = '#1a2a45'; g.fillRect(WIN.x, WIN.y + WIN.h - 34, WIN.w, 34);
  for (let i = 0; i < 6; i++) { g.fillStyle = '#ffd96688'; g.fillRect(WIN.x + 8 + i * 19, WIN.y + WIN.h - 26 + (i % 2) * 6, 5, 6); }
  // 紗窗破洞
  g.strokeStyle = 'rgba(200,200,200,.25)'; g.lineWidth = .6;
  for (let x = WIN.x; x < WIN.x + WIN.w; x += 4) { g.beginPath(); g.moveTo(x, WIN.y); g.lineTo(x, WIN.y + WIN.h); g.stroke(); }
  for (let y = WIN.y; y < WIN.y + WIN.h; y += 4) { g.beginPath(); g.moveTo(WIN.x, y); g.lineTo(WIN.x + WIN.w, y); g.stroke(); }
  g.fillStyle = sky; g.beginPath(); g.ellipse(WIN.x + 30, WIN.y + 60, 10, 7, .4, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#ddd8'; g.lineWidth = 1; g.stroke();
  g.strokeStyle = '#5b4632'; g.lineWidth = 6; g.beginPath(); g.moveTo(WIN.x + WIN.w / 2, WIN.y); g.lineTo(WIN.x + WIN.w / 2, WIN.y + WIN.h); g.stroke();
  // 檯燈
  g.fillStyle = '#3d5a80'; g.beginPath(); g.moveTo(40, 100); g.lineTo(100, 100); g.lineTo(88, 60); g.lineTo(52, 60); g.closePath(); g.fill();
  g.fillStyle = '#fff3b0'; g.beginPath(); g.ellipse(70, 100, 30, 5, 0, 0, Math.PI * 2); g.fill();
  g.strokeStyle = '#555'; g.lineWidth = 4; g.beginPath(); g.moveTo(70, 60); g.lineTo(70, 30); g.stroke();
  // 床單
  const bed = g.createLinearGradient(0, 490, 0, H); bed.addColorStop(0, '#a8dadc'); bed.addColorStop(1, '#7fb7c0');
  g.fillStyle = bed; g.fillRect(0, 490, W, H - 490);
  for (let i = 0; i < 9; i++) { g.strokeStyle = 'rgba(255,255,255,.35)'; g.lineWidth = 2; g.beginPath(); g.moveTo(i * 50, 490); g.quadraticCurveTo(i * 50 + 30, 580, i * 50 - 10, H); g.stroke(); }
  g.fillStyle = 'rgba(40,80,90,.18)'; g.fillRect(0, 490, W, 3);
  // ===== 側躺的雙腿（只露腰部以下） =====
  const rnd = (a, b) => a + Math.random() * (b - a);
  const OUT = 'rgba(115,62,36,.6)';
  const soft = (fn, col, blur, oy) => { g.save(); g.shadowColor = col; g.shadowBlur = blur; g.shadowOffsetY = oy; fn(); g.restore(); };
  const shape = (top, bot, x0, x1) => { const p = new Path2D(); p.moveTo(x0, top(x0));
    for (let x = x0; x <= x1; x += 2) p.lineTo(x, top(x)); for (let x = x1; x >= x0; x -= 2) p.lineTo(x, bot(x)); p.closePath(); return p; };
  // 逐欄圓柱漸層：每一欄依該處上下緣算光影，腿才會有真實的圓柱體積
  const cyl = (top, bot, x0, x1, stops) => { for (let x = x0; x <= x1; x++) { const t = top(x), b = bot(x), k = g.createLinearGradient(0, t, 0, b);
    for (const [o, c] of stops) k.addColorStop(o, c); g.fillStyle = k; g.fillRect(x, t - 1, 1.2, b - t + 2); } };
  const SKIN = [[0, '#e3ab84'], [.08, '#f8dcc0'], [.2, '#f6d3b2'], [.45, '#ecbb93'], [.72, '#d39670'], [.9, '#b77653'], [1, '#a9705a']];
  const SKIN_LOW = [[0, '#8e573d'], [.18, '#c7895f'], [.38, '#dfa982'], [.55, '#e3b089'], [.8, '#c48462'], [.94, '#a76a4c'], [1, '#9a6a58']];
  const hairs = (top, bot, x0, x1, n, a0, a1) => { for (let i = 0; i < n; i++) { const x = rnd(x0, x1), y = rnd(top(x) + 2, bot(x) - 2), l = rnd(2.5, 5);
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + l * .6, y + .3, x + l, y + rnd(.2, 1.4));
    g.strokeStyle = `rgba(85,52,32,${rnd(a0, a1).toFixed(2)})`; g.lineWidth = rnd(.35, .55); g.stroke(); } };
  const pores = (top, bot, x0, x1) => { for (let i = 0; i < 500; i++) { const x = rnd(x0, x1), y = rnd(top(x), bot(x));
    g.fillStyle = Math.random() < .5 ? 'rgba(120,65,40,.07)' : 'rgba(255,240,225,.08)'; g.fillRect(x, y, .7, .7); } };

  // —— 下側那條腿 ——
  // 床單被壓出的接觸陰影
  const cs = g.createLinearGradient(0, 632, 0, 652); cs.addColorStop(0, 'rgba(30,70,80,.35)'); cs.addColorStop(1, 'rgba(30,70,80,0)');
  g.fillStyle = cs; g.beginPath(); g.moveTo(60, 636); g.quadraticCurveTo(250, 628, 410, 618); g.lineTo(410, 640); g.quadraticCurveTo(250, 656, 60, 656); g.fill();
  const low = shape(lowTop, lowBot, 60, 408);
  soft(() => { g.fillStyle = '#c08560'; g.fill(low); }, 'rgba(25,55,65,.5)', 14, 6);
  g.save(); g.clip(low);
  cyl(lowTop, lowBot, 60, 408, SKIN_LOW);
  // 大腿內側肌肉、被床壓扁的下緣
  const lm = g.createRadialGradient(190, 618, 4, 190, 618, 70); lm.addColorStop(0, 'rgba(255,228,205,.22)'); lm.addColorStop(1, 'rgba(255,228,205,0)');
  g.fillStyle = lm; g.fillRect(110, 590, 170, 56);
  const lf = g.createLinearGradient(0, 632, 0, 646); lf.addColorStop(0, 'rgba(90,45,30,0)'); lf.addColorStop(1, 'rgba(90,45,30,.25)');
  g.fillStyle = lf; g.fillRect(60, 628, 350, 20);
  const lred = g.createRadialGradient(292, 616, 2, 292, 616, 22); lred.addColorStop(0, 'rgba(220,115,95,.14)'); lred.addColorStop(1, 'rgba(220,115,95,0)');
  g.fillStyle = lred; g.fillRect(266, 594, 54, 46);
  g.beginPath(); g.moveTo(300, 606); g.lineTo(406, 616); g.strokeStyle = 'rgba(255,235,215,.12)'; g.lineWidth = 4; g.stroke();
  g.strokeStyle = 'rgba(95,115,165,.07)'; g.lineWidth = 2.6; g.beginPath(); g.moveTo(310, 624); g.bezierCurveTo(340, 618, 370, 626, 406, 620); g.stroke();
  for (let i = 0; i < 8; i++) { const x = rnd(130, 400), y = rnd(lowTop(x) + 8, lowBot(x) - 4);
    g.beginPath(); g.arc(x, y, rnd(.5, 1), 0, Math.PI * 2); g.fillStyle = 'rgba(120,65,42,.2)'; g.fill(); }
  const lk = g.createRadialGradient(290, 622, 2, 290, 622, 20); lk.addColorStop(0, 'rgba(100,52,35,.35)'); lk.addColorStop(1, 'rgba(100,52,35,0)');
  g.fillStyle = lk; g.fillRect(260, 596, 60, 50);
  g.strokeStyle = 'rgba(100,52,35,.4)'; g.lineWidth = .9; g.beginPath(); g.moveTo(286, 610); g.quadraticCurveTo(294, 622, 290, 634); g.stroke();
  const lc = g.createRadialGradient(334, 625, 2, 334, 625, 26); lc.addColorStop(0, 'rgba(255,225,200,.22)'); lc.addColorStop(1, 'rgba(255,225,200,0)');
  g.fillStyle = lc; g.fillRect(300, 600, 70, 45);
  const lr = g.createLinearGradient(0, 628, 0, 642); lr.addColorStop(0, 'rgba(150,210,215,0)'); lr.addColorStop(1, 'rgba(150,210,215,.35)');
  g.fillStyle = lr; g.fillRect(96, 625, 320, 20);
  const ls = g.createLinearGradient(116, 0, 150, 0); ls.addColorStop(0, 'rgba(60,32,22,.45)'); ls.addColorStop(1, 'rgba(60,32,22,0)'); g.fillStyle = ls; g.fillRect(100, 590, 52, 60);
  pores(lowTop, lowBot, 60, 408); hairs(lowTop, lowBot, 130, 250, 40, .06, .14); hairs(lowTop, lowBot, 290, 405, 80, .12, .28);
  g.restore();
  g.strokeStyle = OUT; g.lineWidth = 1; g.stroke(low);

  // —— 上側那條腿（大腿、膝蓋、小腿） ——
  const leg = shape(armTop, legBot, 96, 408);
  soft(() => { g.fillStyle = '#d9a17a'; g.fill(leg); }, 'rgba(60,30,20,.55)', 12, 7);   // 投影到下側腿上
  g.save(); g.clip(leg);
  cyl(armTop, legBot, 96, 408, SKIN);
  // 大腿外側髂脛束凹線
  g.lineCap = 'round';
  g.beginPath(); g.moveTo(118, 556); g.bezierCurveTo(170, 560, 220, 566, 262, 570); g.strokeStyle = 'rgba(160,90,58,.06)'; g.lineWidth = 14; g.stroke();
  g.beginPath(); g.moveTo(118, 548); g.bezierCurveTo(170, 552, 220, 558, 262, 562); g.strokeStyle = 'rgba(255,238,220,.08)'; g.lineWidth = 8; g.stroke();
  // 大腿下緣（腿後肌）鼓起的亮面
  const hm = g.createRadialGradient(185, 590, 4, 185, 590, 60); hm.addColorStop(0, 'rgba(255,230,205,.18)'); hm.addColorStop(1, 'rgba(255,230,205,0)');
  g.fillStyle = hm; g.fillRect(120, 560, 140, 50);
  // 膝蓋：髕骨亮點、膝窩陰影、皺紋、微紅
  const pt = g.createRadialGradient(276, 556, 1, 276, 556, 13); pt.addColorStop(0, 'rgba(255,245,232,.5)'); pt.addColorStop(1, 'rgba(255,245,232,0)');
  g.fillStyle = pt; g.fillRect(258, 540, 36, 32);
  const kr = g.createRadialGradient(276, 566, 2, 276, 566, 22); kr.addColorStop(0, 'rgba(225,120,100,.16)'); kr.addColorStop(1, 'rgba(225,120,100,0)');
  g.fillStyle = kr; g.fillRect(250, 540, 52, 56);
  const kp = g.createRadialGradient(272, 588, 2, 272, 588, 18); kp.addColorStop(0, 'rgba(110,55,35,.38)'); kp.addColorStop(1, 'rgba(110,55,35,0)');
  g.fillStyle = kp; g.fillRect(250, 570, 46, 30);
  g.strokeStyle = 'rgba(115,60,38,.45)'; g.lineWidth = .9;
  g.beginPath(); g.moveTo(266, 576); g.quadraticCurveTo(274, 584, 270, 594); g.stroke();
  g.strokeStyle = 'rgba(115,60,38,.25)';
  g.beginPath(); g.moveTo(276, 578); g.quadraticCurveTo(282, 586, 279, 594); g.stroke();
  // 脛骨稜線、小腿肚
  g.beginPath(); g.moveTo(292, 556); g.lineTo(406, 571); g.strokeStyle = 'rgba(255,240,226,.14)'; g.lineWidth = 5; g.stroke();
  const cf = g.createRadialGradient(322, 588, 3, 322, 588, 32); cf.addColorStop(0, 'rgba(255,232,210,.25)'); cf.addColorStop(1, 'rgba(255,232,210,0)');
  g.fillStyle = cf; g.fillRect(285, 560, 80, 50);
  // 床單反光、短褲褲口投影
  const rf = g.createLinearGradient(0, 586, 0, 610); rf.addColorStop(0, 'rgba(150,210,215,0)'); rf.addColorStop(1, 'rgba(150,210,215,.22)');
  g.fillStyle = rf; g.fillRect(96, 580, 320, 32);
  const sh = g.createLinearGradient(104, 0, 140, 0); sh.addColorStop(0, 'rgba(70,38,25,.45)'); sh.addColorStop(1, 'rgba(70,38,25,0)');
  g.fillStyle = sh; g.fillRect(96, 500, 46, 110);
  // 淡靜脈、雀斑、毛孔、腿毛（小腿較多）
  g.strokeStyle = 'rgba(95,115,165,.08)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(300, 580); g.bezierCurveTo(330, 574, 360, 582, 406, 576); g.stroke();
  g.beginPath(); g.moveTo(150, 584); g.bezierCurveTo(190, 578, 220, 586, 255, 580); g.lineWidth = 2.4; g.stroke();
  for (let i = 0; i < 14; i++) { const x = rnd(120, 400), y = rnd(armTop(x) + 4, legBot(x) - 4);
    g.beginPath(); g.arc(x, y, rnd(.5, 1.1), 0, Math.PI * 2); g.fillStyle = `rgba(140,78,50,${rnd(.12, .26).toFixed(2)})`; g.fill(); }
  pores(armTop, legBot, 96, 408);
  hairs(armTop, legBot, 120, 260, 60, .06, .16);
  hairs(armTop, legBot, 285, 405, 120, .14, .32);
  g.restore();
  g.strokeStyle = OUT; g.lineWidth = 1.1; g.stroke(leg);
  for (let x = 290; x < 406; x += rnd(2.5, 5)) { const y = armTop(x) + .5;   // 小腿上緣的腿毛剪影
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 2, y - 1.5, x + 4.5, y - rnd(.8, 2.4)); g.strokeStyle = 'rgba(85,52,32,.35)'; g.lineWidth = .45; g.stroke(); }

  // —— 短褲（髖部，往左延伸出畫面） ——
  const sp = new Path2D();
  sp.moveTo(-10, 500); sp.bezierCurveTo(20, 478, 70, 476, 104, 498);
  sp.quadraticCurveTo(114, 505, 118, 512);           // 褲管上緣
  sp.quadraticCurveTo(116, 560, 109, 600);           // 上側褲口
  sp.quadraticCurveTo(116, 604, 122, 610);           // 下側褲管
  sp.quadraticCurveTo(126, 630, 118, 648);           // 下側褲口
  sp.quadraticCurveTo(70, 664, -10, 662); sp.closePath();
  soft(() => { g.fillStyle = '#2f4a6d'; g.fill(sp); }, 'rgba(25,40,55,.5)', 14, 6);

  const sr2 = g.createLinearGradient(95, 0, 126, 0); sr2.addColorStop(0, 'rgba(10,20,35,0)'); sr2.addColorStop(1, 'rgba(10,20,35,.3)');

/* 狀態 */
let mozzies = [], splats = [], welts = [], fxs = [], state = 'menu', t = 0, spawnT = 0;
let score = 0, kills = 0, taps = 0, hits = 0, bites = 0, combo = 0, maxCombo = 0, shake = 0;
let best = 0; try { best = +localStorage.getItem('mozzieBest') || 0; } catch (e) {}

function hud() {
  document.getElementById('hTime').textContent = Math.max(0, Math.ceil(GAME_T - t));
  document.getElementById('hScore').textContent = score;
  document.getElementById('hCombo').textContent = combo;
  document.getElementById('bites').textContent = '🔴'.repeat(bites) + '⚪'.repeat(Math.max(0, MAX_BITES - bites));
}
function startGame() {
  mozzies = []; splats = []; welts = []; fxs = []; t = 0; spawnT = .4;
  score = kills = taps = hits = bites = combo = maxCombo = 0; state = 'play';
  document.getElementById('menu').hidden = true; document.getElementById('over').hidden = true; hud();
}
function spawn() {
  const r = Math.random(), late = t / GAME_T;
  const type = r < .06 + late * .04 ? 'king' : r < .25 + late * .15 ? 'tiger' : 'normal';
  const m = {
    type, x: WIN.x + 20 + Math.random() * (WIN.w - 40), y: WIN.y + 20 + Math.random() * (WIN.h - 40),
    vx: (Math.random() - .7) * 60, vy: 40 + Math.random() * 40, ang: Math.random() * 6,
    hp: type === 'tiger' ? 2 : 1, state: 'fly', timer: 0, flyFor: 1.6 + Math.random() * 3.5,
    sz: type === 'tiger' ? 1.35 : type === 'king' ? 1.15 : 1, startle: 0, full: false, age: 0, phase: Math.random() * 9, hurt: 0,
  };
  mozzies.push(m);
}
function baseSpeed(m) { return (m.type === 'king' ? 190 : 75) + t * 1.6; }

function update(dt) {
  fxs.forEach(f => f.t -= dt); fxs = fxs.filter(f => f.t > 0);
  splats.forEach(s => s.t -= dt); splats = splats.filter(s => s.t > 0);
  shake = Math.max(0, shake - dt * 3);
  if (state !== 'play') { setBuzz(0, 560); return; }
  t += dt;
  spawnT -= dt;
  const maxAlive = 2 + Math.floor(t / 9);
  if (spawnT <= 0) { if (mozzies.filter(m => m.state !== 'leave').length < maxAlive) spawn(); spawnT = Math.max(.45, 1.6 - t * .02) * (.7 + Math.random() * .6); }
  let loud = 0;
  for (const m of mozzies) {
    m.age += dt; m.timer += dt; m.startle = Math.max(0, m.startle - dt); m.hurt = Math.max(0, m.hurt - dt);
    if (m.state === 'fly' || m.state === 'leave') {
      // 歪歪扭扭的飛行：隨機轉向
      m.ang += (Math.random() - .5) * 9 * dt + Math.sin(m.age * 3 + m.phase) * 2.2 * dt;
      const sp = baseSpeed(m) * (m.startle > 0 ? 2.6 : 1) * (m.full ? .6 : 1) * (.7 + .5 * Math.sin(m.age * 5 + m.phase) ** 2);
      let tx = Math.cos(m.ang) * sp, ty = Math.sin(m.ang) * sp;
      // 離開：往窗戶飛
      if (m.state === 'leave') { const dx = WIN.x + WIN.w / 2 - m.x, dy = WIN.y + 50 - m.y, d = Math.hypot(dx, dy); tx += dx / d * sp * 1.2; ty += dy / d * sp * 1.2; }
      // 牆邊轉回
      if (m.x < 20) tx += 140; if (m.x > W - 20) tx -= 140; if (m.y < 20) ty += 140; if (m.y > 600) ty -= 200;
      m.vx += (tx - m.vx) * Math.min(1, dt * 3); m.vy += (ty - m.vy) * Math.min(1, dt * 3);
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.state === 'fly' && m.type !== 'king' && m.timer > m.flyFor && !m.full) {
        m.state = 'land'; const lx = LEG_X0 + Math.random() * (LEG_X1 - LEG_X0); m.tx = lx; m.ty = armTop(lx) + 4 + Math.random() * 10; m.timer = 0;
      }
      if (m.type === 'king' && m.age > 6.5) m.state = 'leave';
      if (m.state === 'leave' && m.x > WIN.x && m.x < WIN.x + WIN.w && m.y > WIN.y && m.y < WIN.y + WIN.h && m.age > 2) m.gone = true;
    } else if (m.state === 'land') {
      const dx = m.tx - m.x, dy = m.ty - m.y, d = Math.hypot(dx, dy), sp = baseSpeed(m) * .9;
      if (d < 3) { m.state = 'bite'; m.timer = 0; m.vx = m.vy = 0; }
      else { m.vx = dx / d * sp + Math.sin(m.age * 14) * 25; m.vy = dy / d * sp; m.x += m.vx * dt; m.y += m.vy * dt; }
    } else if (m.state === 'bite') {
      const need = m.type === 'tiger' ? 1.7 : 2.2;
      if (m.timer > need) {
        bites++; welts.push({ x: m.x + 4, y: m.y + 2, r: 6 + Math.random() * 3 }); m.full = true; m.state = 'leave'; m.timer = 0; m.age = 0;
        shake = .6; combo = 0; ding(220, .25); fxs.push({ x: m.x, y: m.y - 20, t: 1, s: '好癢！', col: '#e63946' }); hud();
        if (bites >= MAX_BITES) { endGame(); return; }
      }
    }
    if (m.state !== 'bite') loud += 1 / (1 + Math.hypot(m.x - 200, m.y - 560) / 250);
  }
  mozzies = mozzies.filter(m => !m.gone && !m.dead);
  setBuzz(Math.min(.09, loud * .028), 540 + Math.min(200, loud * 40));
  if (t >= GAME_T) endGame();
  hud();
}

/* 拍打 */
cv.addEventListener('pointerdown', e => {
  initAudio();
  if (state !== 'play') return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  taps++;
  let best = null, bd = 1e9;
  for (const m of mozzies) { const d = Math.hypot(m.x - x, m.y - y); const R = 30 * m.sz; if (d < R && d < bd) { bd = d; best = m; } }
  fxs.push({ x, y, t: .25, hand: true });
  if (best) {
    best.hp--; hits++; slapSound(true);
    if (best.hp <= 0) {
      best.dead = true; kills++; combo++; maxCombo = Math.max(maxCombo, combo);
      const base = best.type === 'king' ? 100 : best.type === 'tiger' ? 30 : 10;
      const mult = 1 + Math.min(2, Math.floor(combo / 3) * .5);
      const gain = Math.round(base * mult); score += gain;
      splats.push({ x: best.x, y: best.y, t: 5, sz: best.sz, blood: best.full || Math.random() < .5, king: best.type === 'king' });
      fxs.push({ x: best.x, y: best.y - 22, t: .9, s: '+' + gain + (mult > 1 ? ` ×${mult}` : ''), col: best.type === 'king' ? '#d4a017' : '#2b2b2b' });
      if (best.type === 'king') { ding(1320, .2); setTimeout(() => ding(1760, .25), 100); }
    } else { best.hurt = .3; best.startle = 1; best.state = 'fly'; best.timer = 0; best.ang = Math.random() * 6; fxs.push({ x: best.x, y: best.y - 20, t: .6, s: '再一下！', col: '#e76f51' }); }
  } else {
    slapSound(false); combo = 0;
    // 嚇到附近的蚊子
    for (const m of mozzies) if (Math.hypot(m.x - x, m.y - y) < 110) {
      m.startle = .9; if (m.state !== 'fly' && m.state !== 'leave') { m.state = 'fly'; m.timer = 0; m.flyFor = 1 + Math.random() * 2; }
      m.ang = Math.atan2(m.y - y, m.x - x) + (Math.random() - .5);
    }
  }
  hud();
});

function endGame() {
  state = 'over'; setBuzz(0, 560);
  if (score > best) { best = score; try { localStorage.setItem('mozzieBest', best); } catch (e) {} }
  document.getElementById('oTitle').textContent = bites >= MAX_BITES ? '被叮滿頭包 😫' : kills >= 25 ? '蚊子剋星！🏆' : kills >= 12 ? '打得不錯！👏' : '蚊子贏了… 🦟';
  document.getElementById('sScore').textContent = score;
  document.getElementById('sKill').textContent = kills + ' 隻';
  document.getElementById('sAcc').textContent = (taps ? Math.round(hits / taps * 100) : 0) + '%';
  document.getElementById('sBite').textContent = bites + ' 包';
  document.getElementById('sCombo').textContent = maxCombo;
  document.getElementById('sBest').textContent = best;
  setTimeout(() => document.getElementById('over').hidden = false, 500);
}
document.getElementById('start').onclick = () => { initAudio(); startGame(); };
document.getElementById('again').onclick = () => { initAudio(); startGame(); };

/* 繪圖 */
function drawMozzie(m) {
  ctx.save(); ctx.translate(m.x, m.y);
  const flying = m.state !== 'bite';
  const dir = flying ? Math.atan2(m.vy, m.vx) : -0.5;
  ctx.rotate(dir); ctx.scale(m.sz, m.sz);
  if (m.type === 'king') { ctx.shadowColor = '#ffd700'; ctx.shadowBlur = 12; }
  const body = m.type === 'king' ? '#c99a06' : '#3b2f2a';
  // 腳
  ctx.strokeStyle = body; ctx.lineWidth = .9;
  for (let i = -1; i <= 1; i++) {
    ctx.beginPath(); ctx.moveTo(i * 2, 0); ctx.lineTo(i * 4 - 2, 9); ctx.lineTo(i * 6 - 4, 13); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(i * 2, 0); ctx.lineTo(i * 4 - 2, -9); ctx.lineTo(i * 6 - 4, -13); ctx.stroke();
  }
  // 翅膀
  const flap = flying ? Math.abs(Math.sin(performance.now() / 18 + m.phase)) : .25;
  ctx.fillStyle = m.type === 'king' ? 'rgba(255,230,120,.55)' : 'rgba(210,225,240,.6)';
  ctx.strokeStyle = 'rgba(80,80,90,.4)'; ctx.lineWidth = .5;
  ctx.beginPath(); ctx.ellipse(-2, -5 - flap * 2, 8, 2.6 + flap * 1.5, -.35 - flap * .4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(-2, 5 + flap * 2, 8, 2.6 + flap * 1.5, .35 + flap * .4, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;
  // 腹部
  ctx.fillStyle = m.full ? '#b3122e' : body;
  ctx.beginPath(); ctx.ellipse(-8, 0, m.full ? 7.5 : 6.5, m.full ? 3 : 1.8, 0, 0, Math.PI * 2); ctx.fill();
  if (m.type === 'tiger') { ctx.strokeStyle = '#fff'; ctx.lineWidth = .9; for (const sx of [-12, -9, -6]) { ctx.beginPath(); ctx.moveTo(sx, -1.8); ctx.lineTo(sx, 1.8); ctx.stroke(); } }
  // 胸、頭、口器
  ctx.fillStyle = m.hurt > 0 ? '#e63946' : body;
  ctx.beginPath(); ctx.ellipse(0, 0, 3.2, 2.4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(4, 0, 1.7, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = body; ctx.lineWidth = .8; ctx.beginPath(); ctx.moveTo(5.5, 0); ctx.lineTo(12, 0); ctx.stroke();
  if (m.type === 'king') { ctx.fillStyle = '#ffd700'; ctx.font = '8px system-ui'; ctx.rotate(-dir); ctx.fillText('👑', -4, -8); }
  ctx.restore();
}
function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 10, (Math.random() - .5) * shake * 10);
  ctx.drawImage(bg, 0, 0, W, H);
  // 腫包
  for (const w of welts) {
    const g = ctx.createRadialGradient(w.x, w.y, 1, w.x, w.y, w.r * 1.8);
    g.addColorStop(0, '#ff6b6b'); g.addColorStop(.5, 'rgba(240,110,100,.6)'); g.addColorStop(1, 'rgba(240,110,100,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(w.x, w.y, w.r * 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(w.x, w.y, 1.3, 0, Math.PI * 2); ctx.fill();
  }
  // 蚊屍
  for (const s of splats) {
    ctx.globalAlpha = Math.min(1, s.t / 1.5);
    if (s.blood) { ctx.fillStyle = '#b3122e'; ctx.beginPath(); ctx.ellipse(s.x + 3, s.y + 2, 5 * s.sz, 3.5 * s.sz, .5, 0, Math.PI * 2); ctx.fill(); }
    ctx.strokeStyle = s.king ? '#c99a06' : '#2b211c'; ctx.lineWidth = 1.2;
    for (let i = 0; i < 6; i++) { const a = i * 1.05 + .3; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + Math.cos(a) * 9 * s.sz, s.y + Math.sin(a) * 7 * s.sz); ctx.stroke(); }
    ctx.fillStyle = s.king ? '#c99a06' : '#2b211c'; ctx.beginPath(); ctx.ellipse(s.x, s.y, 5 * s.sz, 2.2 * s.sz, -.4, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  mozzies.forEach(drawMozzie);
  // 拍擊手掌與浮字
  for (const f of fxs) {
    if (f.hand) {
      const k = f.t / .25; ctx.globalAlpha = k; ctx.font = `${40 + (1 - k) * 12}px system-ui`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('🖐️', f.x, f.y); ctx.globalAlpha = 1;
      ctx.strokeStyle = `rgba(255,255,255,${k * .8})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(f.x, f.y, 34 * (1.2 - k * .4), 0, Math.PI * 2); ctx.stroke();
    } else {
      ctx.globalAlpha = Math.min(1, f.t * 2); ctx.font = '900 17px system-ui'; ctx.textAlign = 'center';
      ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(f.s, f.x, f.y - (1 - f.t) * 20);
      ctx.fillStyle = f.col; ctx.fillText(f.s, f.x, f.y - (1 - f.t) * 20); ctx.globalAlpha = 1;
    }
  }
  if (state === 'play' && t < 2) { ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.font = '700 16px system-ui'; ctx.textAlign = 'center'; ctx.fillText('蚊子從窗戶的破洞飛進來了！', W / 2, 260); }
  if (state === 'play' && GAME_T - t < 10) { ctx.fillStyle = `rgba(230,57,70,${.15 + .1 * Math.sin(t * 12)})`; ctx.fillRect(0, 0, W, 6); }
}

let last = performance.now();
function loop(now) { const dt = Math.min(.033, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); }
hud(); requestAnimationFrame(loop);
window.__mz = { get mozzies() { return mozzies; }, get state() { return state; }, get score() { return score; }, get bites() { return bites; }, get kills() { return kills; }, startGame, update };
})();

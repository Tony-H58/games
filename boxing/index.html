<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>拳擊比賽</title>
<style>
  html,body{margin:0;height:100%;background:#0b0b14;color:#fff;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
  #wrap{position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:center;padding-top:6px}
  canvas{display:block;touch-action:none;border-radius:12px}
  #ctrl{display:grid;grid-template-columns:1fr 1.3fr 1.3fr 1fr;gap:8px;padding:8px 10px 14px}
  #ctrl button{border:0;border-radius:18px;color:#fff;font-weight:900;height:84px;touch-action:none;font-size:15px;line-height:1.25}
  #ctrl button span{display:block;font-size:30px}
  #ctrl .dg{background:#334155;box-shadow:0 5px 0 #0f172a}
  #ctrl .pn{background:#dc2626;box-shadow:0 5px 0 #7f1d1d}
  #ctrl button.on{transform:translateY(4px);box-shadow:0 1px 0 #0006}
  #ctrl small{display:block;font-size:10px;font-weight:500;opacity:.8}
  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5}
  .box{background:#16162af5;border:2px solid #ef4444;border-radius:16px;padding:16px;width:min(330px,90%);text-align:center;max-height:94%;overflow:auto}
  .box h2{margin:0 0 6px;font-size:27px;color:#fbbf24}
  .box p{font-size:12.5px;line-height:1.7;margin:6px 0 10px;text-align:left}
  .opp{display:flex;align-items:center;gap:10px;width:100%;margin:5px 0;border:2px solid #ffffff22;border-radius:12px;background:#24243f;color:#fff;padding:7px 10px;text-align:left}
  .opp b{font-size:15px} .opp small{display:block;font-size:11px;color:#c7d2fe}
  .opp .ic{font-size:26px} .opp .st{margin-left:auto;font-size:18px}
  .opp:disabled{opacity:.38}
  .go{width:100%;background:#dc2626;color:#fff;border:0;border-radius:12px;padding:12px;font-size:16px;font-weight:800;margin-top:6px}
  .go.alt{background:#334155}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 8px}
  .stats div{background:#0007;border-radius:10px;padding:7px;font-size:11px}
  .stats b{display:block;font-size:18px;color:#fbbf24}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="c"></canvas>
    <div class="ov" id="menu"><div class="box">
      <h2>🥊 拳擊比賽</h2>
      <p>👊 <b>點拳頭</b>出直拳，<b>往上滑</b>出上勾拳（可以打破防守）。<br>
      ↩️ 對手拳套<b>發亮</b>就是要出拳了：<b>左邊亮往右閃、右邊亮往左閃</b>！閃過後馬上打 = <b>Counter 兩倍傷害</b>。<br>
      🛡️ <b>兩個拳頭一起按住</b> = 防禦，會消耗體力。<br>
      倒地後<b>連點畫面</b>才站得起來。3 回合，擊倒 3 次直接贏！</p>
      <div id="opps"></div>
    </div></div>
    <div class="ov" id="over" hidden><div class="box">
      <h2 id="oTitle"></h2>
      <div class="stats" id="oStats"></div>
      <button class="go" id="oNext">挑戰下一位</button>
      <button class="go alt" id="oMenu">選擇對手</button>
    </div></div>
  </div>
  <div id="ctrl">
    <button class="dg" id="bDL"><span>⬅️</span>左閃</button>
    <button class="pn" id="bPL"><span>🥊</span>左拳<small>往上滑：上勾拳</small></button>
    <button class="pn" id="bPR"><span>🥊</span>右拳<small>兩拳按住：防禦</small></button>
    <button class="dg" id="bDR"><span>➡️</span>右閃</button>
  </div>
</div>
<script>
(() => {
const $ = id => document.getElementById(id);
const W = 400, H = 560, ROUND_T = 60;
const OPP = [
  { name: '新手阿強', ic: '🟢', desc: '動作慢，很好讀', skin: '#f2c49b', hair: '#1f2937', trunks: '#16a34a', glove: '#22c55e', hp: 120, wind: .7, think: [1.1, 1.9], dmg: 8, guard: .08, fake: 0, combo: 1, dodge: 0, armor: false },
  { name: '快拳小林', ic: '🔵', desc: '連打很快', skin: '#f5d0a9', hair: '#111827', trunks: '#2563eb', glove: '#3b82f6', hp: 120, wind: .46, think: [.7, 1.3], dmg: 6, guard: .14, fake: 0, combo: 3, dodge: .06, armor: false, band: '#ef4444' },
  { name: '重砲大熊', ic: '🟤', desc: '慢，但一拳很痛', skin: '#d6a77a', hair: '#3f2a1a', trunks: '#78350f', glove: '#92400e', hp: 170, wind: .85, think: [1.1, 1.7], dmg: 20, guard: .1, fake: 0, combo: 1, dodge: 0, armor: true, beard: true, big: 1.12 },
  { name: '假動作老陳', ic: '🟣', desc: '很會騙你閃', skin: '#eab98e', hair: '#9ca3af', trunks: '#7c3aed', glove: '#a855f7', hp: 135, wind: .52, think: [.8, 1.4], dmg: 9, guard: .25, fake: .38, combo: 2, dodge: .14, armor: false, stache: true },
  { name: '冠軍鐵拳', ic: '🔴', desc: '全部都會的冠軍', skin: '#c68a5e', hair: '#0b0b0b', trunks: '#b91c1c', glove: '#ef4444', hp: 160, wind: .4, think: [.55, 1.05], dmg: 12, guard: .3, fake: .25, combo: 3, dodge: .22, armor: false, belt: true },
];
const cv = $('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const wr = $('wrap').getBoundingClientRect();
  const s = Math.min((wr.width - 6) / W, (wr.height - 6) / H), d = window.devicePixelRatio || 1;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * d); cv.height = Math.round(H * s * d); scale = s * d;
}
addEventListener('resize', resize);

/* 音效 */
let ac = null;
function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } else if (ac.state === 'suspended') ac.resume(); }
function tone(f, d, type = 'sine', v = .07, f2, delay = 0) { if (!ac) return; const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02); }
function noise(d, v, lp, hp = 0, delay = 0) { if (!ac) return; const n = ac.sampleRate * d, b = ac.createBuffer(1, n, ac.sampleRate), x = b.getChannelData(0); for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2); const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = v; let nd = s.connect(f); if (hp) { const h = ac.createBiquadFilter(); h.type = 'highpass'; h.frequency.value = hp; nd = nd.connect(h); } nd.connect(g).connect(ac.destination); s.start(ac.currentTime + delay); }
const sWhoosh = () => noise(.14, .18, 2500, 600);
const sHit = big => { noise(big ? .25 : .14, big ? .7 : .45, big ? 900 : 1400); tone(big ? 90 : 130, .15, 'sine', .15, 50); };
const sBlock = () => { noise(.1, .3, 600); tone(200, .08, 'square', .05); };
const sBell = (n = 1) => { for (let i = 0; i < n; i++) { tone(1250, 1.2, 'sine', .08, null, i * .35); tone(2500, .8, 'sine', .03, null, i * .35); } };
const sCrowd = (v = .2, d = 1.5) => noise(d, v, 1800, 300);
const sCount = () => tone(440, .12, 'square', .05);
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* 紀錄 */
let beaten = 0; try { beaten = +localStorage.getItem('boxBeaten') || 0; } catch (e) {}
function buildMenu() {
  const box = $('opps'); box.innerHTML = '';
  OPP.forEach((o, i) => {
    const b = document.createElement('button'); b.className = 'opp'; b.disabled = i > beaten;
    b.innerHTML = `<span class="ic">${o.ic}</span><span><b>${i + 1}. ${o.name}</b><small>${o.desc}</small></span><span class="st">${i < beaten ? '🏆' : i > beaten ? '🔒' : '🥊'}</span>`;
    b.onclick = () => { initAudio(); startFight(i); };
    box.appendChild(b);
  });
}

/* 狀態 */
let state = 'menu', time = 0, oi = 0, O = OPP[0], round = 1, rt = ROUND_T, fx = [], shake = 0, flashA = 0, slow = 0, crowdT = 0;
const me = { hp: 100, st: 100, punch: null, dodge: null, guard: false, hurt: 0, downs: 0, cool: 0 };
const op = { hp: 100, max: 100, state: 'idle', t: 0, side: 'L', kind: 'jab', comboLeft: 0, think: 1, hurt: 0, hurtDir: 0, open: 0, downs: 0, guardT: 0, faked: false, dodge: 0, dodgeDir: 0 };
let stats = null, count = null;   // 倒地讀秒
function startFight(i) {
  oi = i; O = OPP[i]; round = 1; rt = ROUND_T; fx = [];
  Object.assign(me, { hp: 100, st: 100, punch: null, dodge: null, guard: false, hurt: 0, downs: 0, cool: 0 });
  Object.assign(op, { hp: O.hp, max: O.hp, state: 'idle', t: 0, think: 1.6, hurt: 0, open: 0, downs: 0, dodge: 0 });
  stats = { landed: 0, thrown: 0, counters: 0, dodges: 0, taken: 0, oLanded: 0, kd: 0 };
  count = null; state = 'intro'; introT = 2.2; $('menu').hidden = true; $('over').hidden = true;
  sBell(1); sCrowd(.25, 2);
}
let introT = 0;

/* 玩家動作 */
function punch(hand, kind) {
  if (state !== 'fight' || me.punch || me.dodge || me.hurt > 0 || me.cool > 0) return;
  const tired = me.st < 15;
  me.st = Math.max(0, me.st - (kind === 'upper' ? 16 : 8));
  me.punch = { hand, kind, t: 0, dur: (kind === 'upper' ? .42 : .24) * (tired ? 1.5 : 1), hitAt: kind === 'upper' ? .22 : .1, done: false, tired };
  stats.thrown++; sWhoosh();
}
function landPunch() {
  const p = me.punch; p.done = true;
  if (op.state === 'down' || op.state === 'ko') return;
  if (op.dodge > 0) { fx.push({ s: '被閃開了', x: 200 + op.dodgeDir * 60, y: 200, t: .6, col: '#d1d5db' }); return; }
  // 對手反應防禦
  if (op.state === 'idle' && Math.random() < O.guard * .8) { op.state = 'guard'; op.guardT = .6 + Math.random() * .8; }
  if (op.state === 'idle' && Math.random() < O.dodge) { op.dodge = .35; op.dodgeDir = Math.random() < .5 ? -1 : 1; fx.push({ s: '被閃開了', x: 200 + op.dodgeDir * 60, y: 200, t: .6, col: '#d1d5db' }); return; }
  let dmg = p.kind === 'upper' ? 12 : 6;
  if (p.tired) dmg *= .5;
  if (op.state === 'guard') {
    if (p.kind === 'upper') { op.state = 'idle'; op.think = .7; op.hurt = .5; dmg *= .5; fx.push({ s: '破防！', x: 200, y: 150, t: .8, col: '#fde047' }); }
    else { sBlock(); op.hp -= 1; fx.push({ s: '被擋下', x: 200, y: 170, t: .5, col: '#93c5fd' }); return; }
  }
  let counter = op.open > 0;
  if (counter) { dmg *= 2; stats.counters++; fx.push({ s: 'COUNTER!', x: 200, y: 140, t: .9, col: '#f97316', big: 1 }); slow = .18; sCrowd(.2, 1); }
  // 打斷對手出拳（大熊有霸體）
  if (op.state === 'windup' && !O.armor) { op.state = 'idle'; op.think = .6 + Math.random() * .5; op.comboLeft = 0; }
  op.hp -= dmg; stats.landed++;
  op.hurt = counter || p.kind === 'upper' ? .45 : .25; op.hurtDir = p.hand === 'L' ? 1 : -1; op.hurtUp = p.kind === 'upper';
  sHit(counter || p.kind === 'upper'); shake = counter ? .3 : .15; vib(counter ? 40 : 15);
  for (let i = 0; i < (counter ? 14 : 7); i++) fx.push({ star: 1, x: 200 + op.hurtDir * 20, y: 150, vx: (Math.random() - .5) * 300, vy: -Math.random() * 250, t: .5 });
  if (op.hp <= 0) oppDown();
}
function dodge(dir) {
  if (state !== 'fight' || me.dodge || me.punch || me.hurt > 0) return;
  me.dodge = { dir, t: 0, dur: .48 }; sWhoosh(); me.guard = false;
}
function setGuard(v) { if (state !== 'fight') { me.guard = false; return; } me.guard = v && !me.dodge; }
let mashN = 0;
function mash() { if (count && count.who === 'me') { mashN++; tone(300 + mashN * 20, .05, 'square', .04); } }

/* 對手 AI */
function oppDecide() {
  const r = Math.random();
  if (r < O.guard * .6) { op.state = 'guard'; op.guardT = .8 + Math.random() * 1.2; return; }
  op.comboLeft = 1 + Math.floor(Math.random() * O.combo);
  oppWindup();
}
function oppWindup() {
  op.state = 'windup'; op.side = Math.random() < .5 ? 'L' : 'R'; op.kind = Math.random() < .25 ? 'heavy' : 'jab';
  op.t = 0; op.wind = O.wind * (op.kind === 'heavy' ? 1.25 : 1) * (op.comboLeft > 1 && op.comboStarted ? .75 : 1); op.faked = false; op.comboStarted = true;
}
function oppStrike() {
  op.state = 'strike'; op.t = 0;
  const dodgeOK = me.dodge && me.dodge.t < me.dodge.dur * .95 && ((op.side === 'L' && me.dodge.dir > 0) || (op.side === 'R' && me.dodge.dir < 0));
  if (dodgeOK) {
    stats.dodges++; op.open = .75; sWhoosh(); fx.push({ s: '閃過了！快反擊！', x: 200, y: 120, t: .9, col: '#86efac' });
    return;
  }
  let dmg = O.dmg * (op.kind === 'heavy' ? 1.5 : 1);
  if (me.guard && me.st > 0) { dmg *= .2; me.st = Math.max(0, me.st - 12); sBlock(); shake = .1; fx.push({ s: '擋住了', x: 200, y: 330, t: .6, col: '#93c5fd' }); }
  else { sHit(op.kind === 'heavy'); shake = op.kind === 'heavy' ? .45 : .25; flashA = op.kind === 'heavy' ? .45 : .28; me.hurt = .3; stats.oLanded++; vib(op.kind === 'heavy' ? 120 : 60); me.punch = null; }
  me.hp -= dmg; stats.taken += dmg;
  if (me.hp <= 0) meDown();
}
function oppDown() {
  op.hp = 0; op.state = 'down'; op.downs++; stats.kd++; op.t = 0; sCrowd(.35, 2.5); slow = .35;
  fx.push({ s: 'DOWN!', x: 200, y: 140, t: 1.4, col: '#fde047', big: 1 });
  if (op.downs >= 3) { setTimeout(() => endFight(true, 'TKO 勝！擊倒 3 次'), 1600); state = 'end'; return; }
  // 讀秒：越後面越難站起來
  const getUp = Math.random() < (op.downs === 1 ? .85 : .55) ? 4 + Math.floor(Math.random() * 4) : 99;
  count = { who: 'op', n: 0, t: 0, upAt: getUp };
}
function meDown() {
  me.hp = 0; me.downs++; me.punch = null; me.dodge = null; me.guard = false; sCrowd(.3, 2); flashA = .6;
  if (me.downs >= 3) { state = 'end'; setTimeout(() => endFight(false, '被擊倒 3 次'), 1600); return; }
  mashN = 0; count = { who: 'me', n: 0, t: 0, need: 10 + me.downs * 6 };
}

/* 結束 */
function endFight(win, why) {
  state = 'over';
  if (win && oi + 1 > beaten) { beaten = oi + 1; try { localStorage.setItem('boxBeaten', beaten); } catch (e) {} }
  buildMenu();
  $('oTitle').textContent = win ? (oi === 4 ? '👑 新科冠軍！' : '🏆 你贏了！') : '😵 你輸了…';
  const acc = stats.thrown ? Math.round(stats.landed / stats.thrown * 100) : 0;
  $('oStats').innerHTML = `<div>結果<b style="font-size:14px">${why}</b></div><div>對手<b style="font-size:14px">${O.name}</b></div><div>命中<b>${stats.landed}/${stats.thrown}（${acc}%）</b></div><div>Counter<b>${stats.counters} 次</b></div><div>閃過<b>${stats.dodges} 次</b></div><div>擊倒對手<b>${stats.kd} 次</b></div>`;
  $('oNext').hidden = !(win && oi < 4); $('oNext').textContent = '挑戰下一位：' + (OPP[oi + 1]?.name || '');
  if (win) sCrowd(.35, 3);
  $('over').hidden = false;
}
$('oNext').onclick = () => { initAudio(); startFight(oi + 1); };
$('oMenu').onclick = () => { $('over').hidden = true; state = 'menu'; buildMenu(); $('menu').hidden = false; };

/* 更新 */
function update(rdt) {
  time += rdt;
  slow = Math.max(0, slow - rdt);
  const dt = slow > 0 ? rdt * .35 : rdt;
  fx.forEach(f => { f.t -= rdt; if (f.star) { f.x += f.vx * rdt; f.y += f.vy * rdt; f.vy += 500 * rdt; } }); fx = fx.filter(f => f.t > 0);
  shake = Math.max(0, shake - rdt); flashA = Math.max(0, flashA - rdt * 1.5);
  if (state === 'intro') { introT -= rdt; if (introT <= 0) { state = 'fight'; sBell(1); } return; }
  if (state === 'break') { introT -= rdt; if (introT <= 0) { state = 'fight'; sBell(1); } return; }
  if (state !== 'fight' && state !== 'end') return;
  // 讀秒
  if (count) {
    count.t += rdt;
    if (count.t >= .8) { count.t = 0; count.n++; sCount();
      if (count.who === 'op' && count.n >= count.upAt) { op.hp = op.max * (.55 - op.downs * .1); op.state = 'idle'; op.think = 1.2; count = null; fx.push({ s: '站起來了！', x: 200, y: 150, t: 1, col: '#fca5a5' }); return; }
      if (count.who === 'op' && count.n >= 10) { count = null; state = 'end'; setTimeout(() => endFight(true, 'KO 勝！'), 900); return; }
      if (count.who === 'me' && count.n >= 10) { count = null; state = 'end'; setTimeout(() => endFight(false, '被 KO 了'), 900); return; }
    }
    if (count && count.who === 'me' && mashN >= count.need) { me.hp = 100 * (.55 - me.downs * .08); count = null; me.hurt = .5; fx.push({ s: '站起來了！', x: 200, y: 330, t: 1, col: '#86efac' }); sCrowd(.25, 1); }
    return;
  }
  if (state !== 'fight') return;
  rt -= dt;
  if (rt <= 0) { roundEnd(); return; }
  // 玩家
  me.cool = Math.max(0, me.cool - dt); me.hurt = Math.max(0, me.hurt - dt);
  if (me.punch) { me.punch.t += dt; if (!me.punch.done && me.punch.t >= me.punch.hitAt) landPunch(); if (me.punch && me.punch.t >= me.punch.dur) me.punch = null; }
  if (me.dodge) { me.dodge.t += dt; if (me.dodge.t >= me.dodge.dur) me.dodge = null; }
  if (me.guard) me.st = Math.max(0, me.st - 7 * dt); else if (!me.punch) me.st = Math.min(100, me.st + 20 * dt);
  // 對手
  op.hurt = Math.max(0, op.hurt - dt); op.open = Math.max(0, op.open - dt); op.dodge = Math.max(0, op.dodge - dt);
  if (op.state === 'down') return;
  if (op.hurt > 0 && op.state !== 'windup') return;
  op.t += dt;
  if (op.state === 'idle') { op.think -= dt; if (op.think <= 0) oppDecide(); }
  else if (op.state === 'guard') { op.guardT -= dt; if (op.guardT <= 0) { op.state = 'idle'; op.think = .3 + Math.random() * .5; } }
  else if (op.state === 'windup') {
    if (O.fake && !op.faked && op.t > op.wind * .55 && Math.random() < O.fake) { op.faked = true; op.side = op.side === 'L' ? 'R' : 'L'; op.t = op.wind * .45; fx.push({ s: '假動作！', x: 200, y: 110, t: .6, col: '#c4b5fd' }); }
    if (op.t >= op.wind) oppStrike();
  }
  else if (op.state === 'strike') {
    if (op.t >= .22) {
      op.comboLeft--;
      if (op.comboLeft > 0 && op.open <= 0) oppWindup();
      else { op.state = 'idle'; op.comboStarted = false; op.think = O.think[0] + Math.random() * (O.think[1] - O.think[0]) + (op.open > 0 ? .5 : 0); }
    }
  }
  crowdT -= dt; if (crowdT <= 0) { crowdT = 3 + Math.random() * 3; sCrowd(.05, 1.2); }
}
function roundEnd() {
  sBell(2);
  if (round >= 3) {
    const myScore = stats.landed * 2 + stats.counters * 3 + stats.kd * 10 - stats.oLanded * 2 - me.downs * 10;
    state = 'end'; setTimeout(() => endFight(myScore > 0, myScore > 0 ? '判定勝！' : '判定敗'), 1200); return;
  }
  round++; rt = ROUND_T; state = 'break'; introT = 2.4;
  me.hp = Math.min(100, me.hp + 20); me.st = 100; op.hp = Math.min(op.max, op.hp + op.max * .15); op.state = 'idle'; op.think = 1.5;
  me.punch = me.dodge = null; me.guard = false;
}

/* 操作 */
const btn = { L: { down: false }, R: { down: false } };
function punchBtn(id, hand) {
  const b = $(id), s = btn[hand];

function drawMyGloves() {
  const p = me.punch;

    if (me.guard) { x = 200 + s * 50; y = 448; r = 80; }

    limb(x + s * 34, H + 80, x, y + r * 1.15, 44, r * .5, '#e0ac82', true);

  ctx.font = '900 20px system-ui'; ctx.fillStyle = rt < 10 ? '#f87171' : '#fff'; ctx.fillText(Math.max(0, Math.ceil(rt)), 200, 40);

}

  }
  if (flashA > 0) { ctx.fillStyle = `rgba(255,${me.hp <= 0 ? 0 : 255},${me.hp <= 0 ? 0 : 255},${flashA * .6})`; ctx.fillRect(0, 0, W, H); const v = ctx.createRadialGradient(200, 280, 120, 200, 280, 360); v.addColorStop(0, 'rgba(220,38,38,0)'); v.addColorStop(1, `rgba(220,38,38,${flashA})`); ctx.fillStyle = v; ctx.fillRect(0, 0, W, H); }

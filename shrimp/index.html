<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>釣蝦場</title>
<style>
  html,body{margin:0;height:100%;background:#1c2421;color:#f4f1de;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 2px;font-size:11px}
  #hud b{display:block;font-size:20px;color:#ffd166;font-variant-numeric:tabular-nums}
  #tip{text-align:center;font-size:13px;height:18px;color:#ffd166}
  #wrap{position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
  canvas{display:block;touch-action:none;border-radius:12px}
  #ctrl{display:flex;gap:8px;padding:6px 12px 14px;align-items:stretch}
  .bait{display:flex;gap:6px;flex:1.3}
  .bait button{flex:1;border:2px solid #ffffff22;background:#2d3a35;color:#f4f1de;border-radius:10px;font-size:12px;padding:6px 2px}
  .bait button.on{border-color:#ffd166;background:#4a5a3a}
  .bait button span{display:block;font-size:18px}
  #act{flex:1;border:0;border-radius:14px;font-size:18px;font-weight:900;background:#e76f51;color:#fff;touch-action:none}
  #act.reel{background:#2a9d8f}
  #act:disabled{opacity:.45}
  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .box{background:#25302bee;border:2px solid #e9c46a;border-radius:16px;padding:20px;width:min(320px,88%);text-align:center}
  .box h2{margin:0 0 6px;font-size:28px;color:#e9c46a}
  .box p{font-size:13px;line-height:1.7;margin:6px 0 12px;text-align:left}
  .go{width:100%;background:#e76f51;color:#fff;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:800}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 12px}
  .stats div{background:#0004;border-radius:10px;padding:7px;font-size:11px}
  .stats b{display:block;font-size:19px;color:#ffd166}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div>時間<b id="hTime">3:00</b></div>
    <div>分數<b id="hScore">0</b></div>
    <div>釣到<b id="hCount">0</b></div>
    <div style="text-align:right">總重<b id="hWeight">0g</b></div>
  </div>
  <div id="tip"></div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div class="ov" id="menu"><div class="box">
      <h2>🦐 釣蝦場</h2>
      <p>① 選餌，<b>點水面</b>拋竿。<br>
      ② 浮標輕輕抖是蝦在試吃，<b>浮標被拖下去</b>時馬上按「<b>拉竿</b>」！太早會把蝦嚇跑，太晚餌會被吃光。<br>
      ③ 上鉤後<b>按住「收線」</b>拉近，看張力條：太高會<b>斷線</b>、太低蝦會<b>脫鉤</b>。<br>
      ④ 釣上來的蝦會放上烤爐：<b>點蝦子</b>翻面，兩面都紅了再點一次起鍋，烤焦就沒加分。<br>
      🍗 雞肝吸引大公蝦・🟤 蝦粉小蝦多・🪱 紅蟲都愛</p>
      <button class="go" id="start">開始釣（3 分鐘）</button>
    </div></div>
    <div class="ov" id="over" hidden><div class="box">
      <h2 id="oTitle"></h2>
      <div class="stats">
        <div>分數<b id="sScore"></b></div><div>釣到<b id="sCount"></b></div>
        <div>總重<b id="sWeight"></b></div><div>最大隻<b id="sBig"></b></div>
        <div>烤得完美<b id="sGrill"></b></div><div>最高分<b id="sBest"></b></div>
      </div>
      <button class="go" id="again">再釣一場</button>
    </div></div>
  </div>
  <div id="ctrl">
    <div class="bait">
      <button data-b="liver" class="on"><span>🍗</span>雞肝</button>
      <button data-b="powder"><span>🟤</span>蝦粉</button>
      <button data-b="worm"><span>🪱</span>紅蟲</button>
    </div>
    <button id="act" disabled>拋竿</button>
  </div>
</div>
<script>
(() => {
const W = 400, H = 620, SURF = 175, BOT = 482, GRILL_Y = 572, GAME_T = 180;
const ROD_TIP = { x: 70, y: 70 };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const wr = document.getElementById('wrap').getBoundingClientRect();
  const s = Math.min((wr.width - 4) / W, (wr.height - 4) / H), d = window.devicePixelRatio || 1;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * d); cv.height = Math.round(H * s * d); scale = s * d;
}
addEventListener('resize', resize);

/* 音效 */
let ac = null;
function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } else if (ac.state === 'suspended') ac.resume(); }
function tone(f, d, type = 'sine', v = .06, f2, delay = 0) { if (!ac) return; const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02); }
function noise(d, v, lp) { if (!ac) return; const n = ac.sampleRate * d, b = ac.createBuffer(1, n, ac.sampleRate), x = b.getChannelData(0); for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2); const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = v; s.connect(f).connect(g).connect(ac.destination); s.start(); }
const sCast = () => { tone(900, .3, 'sine', .04, 300); setTimeout(() => noise(.2, .25, 1500), 300); };
const sBite = () => tone(1400, .06, 'square', .04);
const sStrike = () => { noise(.12, .3, 3000); tone(500, .15, 'triangle', .06, 900); };
const sSnap = () => { tone(2200, .08, 'square', .08); noise(.2, .3, 4000); };
const sLand = () => [660, 880, 1100].forEach((f, i) => tone(f, .13, 'sine', .07, null, i * .08));
const sSizzle = () => noise(.6, .12, 5000);
let reelO = null;
function reelSound(on) { if (!ac) return; if (on && !reelO) { reelO = ac.createOscillator(); const g = ac.createGain(); reelO.type = 'square'; reelO.frequency.value = 38; g.gain.value = .02; reelO.connect(g).connect(ac.destination); reelO.start(); reelO._g = g; } else if (!on && reelO) { reelO.stop(); reelO = null; } }
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* 蝦 */
const KIND = {
  small: { name: '小母蝦', pts: 10, w: [14, 24], str: .6, len: 34, claw: 10, col: '#8d9aa5', clawCol: '#7d8c99', pref: { liver: .7, powder: 1.6, worm: 1 } },
  male:  { name: '公蝦', pts: 30, w: [30, 50], str: 1.1, len: 46, claw: 34, col: '#7b8b97', clawCol: '#5f7484', pref: { liver: 1.3, powder: .8, worm: 1 } },
  blue:  { name: '藍鉗大公蝦', pts: 100, w: [60, 95], str: 1.7, len: 58, claw: 60, col: '#6f8290', clawCol: '#2b6cb0', pref: { liver: 1.8, powder: .4, worm: 1 } },
};
let shrimps = [], bait = 'liver', line = null, fight = null, grill = [], fx = [], caught = [], state = 'menu', t = 0, holding = false;
let score = 0, weight = 0, perfect = 0;
let best = 0; try { best = +localStorage.getItem('shrimpBest') || 0; } catch (e) {}
function addShrimp(x) {
  const r = Math.random(), kind = r < .12 ? 'blue' : r < .45 ? 'male' : 'small', K = KIND[kind];
  shrimps.push({ kind, K, x: x ?? 20 + Math.random() * 360, y: BOT - 10 - Math.random() * 18, dir: Math.random() < .5 ? -1 : 1, sp: 12 + Math.random() * 14, ph: Math.random() * 9, st: 'wander', tm: 0, w: Math.round(K.w[0] + Math.random() * (K.w[1] - K.w[0])), scared: 0 });
}
const fmt = s => `${(s / 60) | 0}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function hud() {
  document.getElementById('hTime').textContent = fmt(Math.max(0, GAME_T - t));
  document.getElementById('hScore').textContent = score;
  document.getElementById('hCount').textContent = caught.length;
  document.getElementById('hWeight').textContent = weight + 'g';
}
function setTip(s) { document.getElementById('tip').textContent = s; }
const act = document.getElementById('act');
function setAct(label, enabled, reel) { act.textContent = label; act.disabled = !enabled; act.classList.toggle('reel', !!reel); }

function startGame() {
  shrimps = []; line = null; fight = null; grill = []; fx = []; caught = []; t = 0; score = weight = perfect = 0;
  for (let i = 0; i < 9; i++) addShrimp();
  state = 'play'; document.getElementById('menu').hidden = true; document.getElementById('over').hidden = true;
  setAct('拋竿', false); setTip('選好餌，點水面拋竿'); hud();
}

/* 選餌 */
document.querySelectorAll('.bait button').forEach(b => b.onclick = () => {
  if (line) { setTip('先收竿再換餌'); return; }
  bait = b.dataset.b; document.querySelectorAll('.bait button').forEach(x => x.classList.toggle('on', x === b));
});

/* 拋竿 */
const toLocal = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; };
cv.addEventListener('pointerdown', e => {
  initAudio(); if (state !== 'play') return;
  const q = toLocal(e);
  // 點烤爐上的蝦
  if (q.y > GRILL_Y - 30) { tapGrill(q.x, q.y); return; }
  if (line || fight) return;
  if (q.y < SURF - 30 || q.y > BOT) { setTip('點水面拋竿'); return; }
  const x = Math.max(40, Math.min(370, q.x));
  line = { x, hookY: SURF, bait: 1, sinkT: 0, state: 'sink', bob: 0, pull: 0, sx: 0, nib: null, takeT: 0 };
  sCast(); fx.push({ splash: true, x, y: SURF, t: .6 });
  setAct('拉竿', true); setTip('等浮標被拖下去再拉竿…');
});

/* 動作鍵：拉竿 / 收線 */
act.addEventListener('pointerdown', e => {
  initAudio(); e.preventDefault(); if (state !== 'play') return;
  if (fight) { holding = true; reelSound(true); return; }
  if (!line) return;
  strike();
});
const up = () => { holding = false; reelSound(false); };
act.addEventListener('pointerup', up); act.addEventListener('pointercancel', up); act.addEventListener('pointerleave', up);

function strike() {
  sStrike();
  const s = line.nib;
  if (line.state === 'take' && s) {
    // 上鉤！
    fight = { s, dist: 100, tension: 45, slack: 0, burst: 0, burstT: 1 + Math.random() };
    s.st = 'hooked'; line.state = 'fight';
    setAct('按住收線', true, true); setTip(`中了！${s.K.name}上鉤，按住收線，注意張力！`); vib(60);
    return;
  }
  if (line.state === 'junk') { landJunk(); return; }
  if (s && line.state === 'nibble') { setTip('蝦還在試吃，等浮標整個被拖下去再拉'); return; }
  setTip(line.bait <= 0 ? '餌被吃光了，重新拋竿' : '收竿了');
  line = null; setAct('拋竿', false);
}
function landJunk() {
  const j = ['🩴 拖鞋', '🥫 空罐', '🧤 手套'][(Math.random() * 3) | 0];
  fx.push({ x: line.x, y: SURF - 40, t: 1.4, s: `釣到${j}…`, col: '#bbb' }); setTip('是垃圾啦 😅');
  line = null; setAct('拋竿', false);
}

/* 烤爐 */
const SLOTS = [70, 150, 230, 310];
function toGrill(s) {
  const slot = SLOTS.findIndex(x => !grill.some(g => g.x === x));
  if (slot < 0) { fx.push({ x: 200, y: GRILL_Y - 40, t: 1.2, s: '烤爐滿了，先起鍋！', col: '#f4a261' }); return; }
  grill.push({ s, x: SLOTS[slot], side: 0, cook: [0, 0], flip: 0 });
}
function tapGrill(x, y) {
  const g = grill.find(g => Math.abs(g.x - x) < 38);
  if (!g) return;
  const c = g.cook[g.side];
  if (g.side === 0) {
    if (c < .55) { fx.push({ x: g.x, y: GRILL_Y - 32, t: .8, s: '還沒熟', col: '#fff' }); return; }
    g.side = 1; g.flip = .3; sSizzle(); return;
  }
  if (c < .55) { fx.push({ x: g.x, y: GRILL_Y - 32, t: .8, s: '這面還沒熟', col: '#fff' }); return; }
  const burnt = g.cook[0] > 1.6 || g.cook[1] > 1.6, good = !burnt && g.cook[0] >= .7 && g.cook[1] >= .7;
  const bonus = burnt ? 0 : good ? 25 + Math.round(g.s.w / 3) : 10;
  if (good) perfect++;
  score += bonus;
  fx.push({ x: g.x, y: GRILL_Y - 34, t: 1.1, s: burnt ? '烤焦了…' : good ? `香噴噴 +${bonus}` : `+${bonus}`, col: burnt ? '#999' : '#ffd166' });
  grill = grill.filter(q => q !== g); hud();
}

/* 更新 */
function update(dt) {
  fx.forEach(f => f.t -= dt); fx = fx.filter(f => f.t > 0);
  if (state !== 'play') return;
  t += dt;
  // 蝦子
  for (const s of shrimps) {
    s.ph += dt * 6; s.scared = Math.max(0, s.scared - dt);
    if (s.st === 'wander' || s.st === 'flee') {
      if (Math.random() < dt * .4) s.dir *= -1;
      s.x += s.dir * s.sp * (s.st === 'flee' ? 3 : 1) * dt;
      if (s.x < 15) s.dir = 1; if (s.x > 385) s.dir = -1;
      if (s.st === 'flee' && s.scared <= 0) s.st = 'wander';
      // 被餌吸引
      if (s.st === 'wander' && line && line.state === 'wait' && !line.nib && line.bait > 0 && Math.abs(s.x - line.x) < 170) {
        if (Math.random() < dt * .7 * s.K.pref[bait]) { s.st = 'approach'; line.nib = s; }
      }
    } else if (s.st === 'nibble' && (!line || line.nib !== s)) { s.st = 'wander';
    } else if (s.st === 'approach') {
      if (!line || line.nib !== s) { s.st = 'wander'; s.side = undefined; continue; }
      if (s.side === undefined) s.side = s.x < line.x ? -1 : 1;          // 從哪一側靠近餌
      const tx = line.x + s.side * s.K.len * .5, mv = Math.sign(tx - s.x);
      s.x += mv * Math.min(Math.abs(tx - s.x), s.sp * 1.4 * dt); s.dir = -s.side;   // 臉朝向餌
      if (Math.abs(s.x - tx) < 2) { s.side = undefined; s.st = 'nibble'; s.tm = 0; s.nibN = 1 + ((Math.random() * 2) | 0); line.state = 'nibble'; line.nextNib = .4; }
    }
  }
  // 線與浮標
  if (line) {
    if (line.state === 'sink') { line.hookY = Math.min(BOT - 8, line.hookY + 260 * dt); if (line.hookY >= BOT - 8) line.state = 'wait'; }
    else if (line.state === 'wait') {
      line.bob = Math.sin(t * 2) * 1.5;
      if (Math.random() < dt * .012) { line.state = 'junk'; line.takeT = 1.3; line.pull = 1; setTip('浮標沉下去了！？'); }
    } else if (line.state === 'nibble') {
      const s = line.nib;
      line.nextNib -= dt; line.bob *= .9;
      if (line.nextNib <= 0) {
        s.nibN--; line.bob = 4 + Math.random() * 3; line.bait -= .08; sBite(); line.nextNib = .5 + Math.random() * .8;
        if (s.nibN <= 0) { line.state = 'take'; line.takeT = 1.6 + Math.random() * .6; line.pull = 0; line.sx = 0; setTip('浮標被拖下去了！快拉竿！'); vib(25); }
      }
    } else if (line.state === 'take' || line.state === 'junk') {
      line.pull = Math.min(1, line.pull + dt * 5); line.sx += (line.nib ? line.nib.dir : 1) * dt * 20;
      line.takeT -= dt;
      if (line.takeT <= 0) {
        if (line.state === 'junk') { line.state = 'wait'; line.pull = 0; line.sx = 0; setTip('…是錯覺嗎？'); }
        else { const s = line.nib; s.st = 'flee'; s.scared = 2; line.bait = 0; line.nib = null; line.state = 'empty'; line.pull = 0; setTip('太慢了！餌被吃掉，收竿重拋'); }
      }
    } else if (line.state === 'empty') line.bob = Math.sin(t * 2) * 1.2;
  }
  // 拉鋸
  if (fight) {
    const s = fight.s, k = s.K.str * .8;
    fight.burstT -= dt;
    if (fight.burstT <= 0) { fight.burst = .5 + Math.random() * .6; fight.burstT = 1.2 + Math.random() * 1.8; vib(30); }
    const bursting = fight.burst > 0; if (bursting) fight.burst -= dt;
    if (holding) { fight.tension += (9 + k * 6 + (bursting ? 22 * k : 0)) * dt; fight.dist -= (36 - k * 6) * dt * (bursting ? .45 : 1); }
    else { fight.tension -= 28 * dt; fight.dist += (bursting ? 5 * k : 1) * dt; }
    fight.tension = Math.max(0, fight.tension); fight.dist = Math.min(100, fight.dist);
    fight.slack = fight.tension < 5 ? fight.slack + dt : 0;
    s.x = line.x + Math.sin(t * 7) * 6 * (bursting ? 2 : 1); s.y = BOT - 10 - (100 - fight.dist) / 100 * (BOT - SURF - 30);
    line.hookY = s.y;
    if (fight.tension >= 100) { sSnap(); vib(120); setTip('線斷了！蝦帶著鉤子跑了'); endFight(false); }
    else if (fight.slack > 4) { setTip('線太鬆，蝦脫鉤了…'); endFight(false); }
    else if (fight.dist <= 0) endFight(true);
  }
  if (shrimps.length < 7 && Math.random() < dt * .3) addShrimp(Math.random() < .5 ? 10 : 390);
  // 烤爐
  for (const g of grill) { g.cook[g.side] += dt / 7; g.flip = Math.max(0, g.flip - dt); if (Math.random() < dt * 3) fx.push({ smoke: true, x: g.x + (Math.random() - .5) * 30, y: GRILL_Y - 6, t: 1.2 }); }
  if (t >= GAME_T) endGame();
  hud();
}
function endFight(win) {
  const s = fight.s; reelSound(false); holding = false;
  if (win) {
    shrimps = shrimps.filter(x => x !== s); caught.push(s); weight += s.w;
    const gain = s.K.pts + Math.round(s.w / 2); score += gain; sLand(); vib(50);
    fx.push({ x: line.x, y: SURF - 50, t: 1.4, s: `${s.K.name} ${s.w}g +${gain}`, col: s.kind === 'blue' ? '#90e0ef' : '#ffd166' });
    fx.push({ catchAnim: s, x: line.x, y: SURF - 20, t: .8 });
    setTimeout(() => toGrill(s), 800);
    setTip('釣到了！烤爐上的蝦記得翻面');
  } else { s.st = 'flee'; s.scared = 3; s.y = BOT - 12; }
  fight = null; line = null; setAct('拋竿', false); hud();
}
function endGame() {
  state = 'over'; fight = null; line = null; reelSound(false); setAct('拋竿', false);
  if (score > best) { best = score; try { localStorage.setItem('shrimpBest', best); } catch (e) {} }
  const big = caught.reduce((m, s) => (!m || s.w > m.w ? s : m), null);
  document.getElementById('oTitle').textContent = score >= 600 ? '釣蝦王！👑' : score >= 300 ? '收穫滿滿 🦐' : score >= 100 ? '有吃有喝 🍻' : '今天蝦不賞臉 😅';
  document.getElementById('sScore').textContent = score; document.getElementById('sCount').textContent = caught.length + ' 隻';
  document.getElementById('sWeight').textContent = weight + 'g'; document.getElementById('sBig').textContent = big ? `${big.w}g` : '—';
  document.getElementById('sGrill').textContent = perfect + ' 隻'; document.getElementById('sBest').textContent = best;
  document.getElementById('over').hidden = false; setTip('');
}
document.getElementById('start').onclick = () => { initAudio(); startGame(); };
document.getElementById('again').onclick = () => { initAudio(); startGame(); };

/* 繪圖 */
function drawShrimp(s, x, y, dir, cooked = 0, sc = 1, ang = 0) {
  const K = s.K, L = K.len * sc;
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(dir, 1);
  const body = cooked ? `hsl(${18 - cooked * 4},${70 + cooked * 10}%,${55 - Math.max(0, cooked - 1) * 40}%)` : K.col;
  const clawC = cooked ? body : K.clawCol;
  // 觸鬚
  ctx.strokeStyle = cooked ? body : '#c9b8a6'; ctx.lineWidth = .8;
  ctx.beginPath(); ctx.moveTo(L * .45, -L * .1); ctx.quadraticCurveTo(L * 1.2, -L * .6 + Math.sin(s.ph) * 3, L * 1.6, -L * .25); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(L * .45, -L * .08); ctx.quadraticCurveTo(L * 1.1, -L * .3, L * 1.5, -L * .05 + Math.sin(s.ph + 1) * 3); ctx.stroke();

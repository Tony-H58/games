<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>打地鼠</title>
<style>
  html,body{margin:0;height:100%;background:#2d6a4f;color:#fffbe6;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #hud{max-width:520px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:8px 14px 4px;font-size:11px}
  #hud b{display:block;font-size:22px;font-variant-numeric:tabular-nums;color:#ffd166}
  #wrap{position:relative;display:flex;justify-content:center}
  canvas{display:block;touch-action:none;border-radius:14px}
  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .box{background:#1b4332f0;border:2px solid #ffd166;border-radius:18px;padding:20px;width:min(300px,84%);text-align:center}
  .box h2{margin:0 0 6px;font-size:30px;color:#ffd166}
  .box p{font-size:13px;line-height:1.75;margin:6px 0 14px}
  .go{width:100%;background:#e76f51;color:#fff;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:800}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 14px}
  .stats div{background:#0003;border-radius:10px;padding:7px;font-size:11px}
  .stats b{display:block;font-size:20px;color:#ffd166}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="hud">
  <div>時間<b id="hTime">60</b></div>
  <div>分數<b id="hScore">0</b></div>
  <div>連擊<b id="hCombo">0</b></div>
  <div style="text-align:right">最高分<b id="hBest">0</b></div>
</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="ov" id="menu"><div class="box">
    <h2>🔨 打地鼠</h2>
    <p>地鼠冒出來就<b>點下去敲牠</b>！<br>
    🐹 一般地鼠 +10<br>⛑️ 戴頭盔的要敲 <b>2 下</b> +30<br>⭐ 金色地鼠很快縮回去 +50<br>💣 炸彈<b>不要打</b>，打到 −30<br>連續打中有連擊加成，60 秒內越後面越快！</p>
    <button class="go" id="start">開始</button>
  </div></div>
  <div class="ov" id="over" hidden><div class="box">
    <h2 id="oTitle"></h2>
    <div class="stats">
      <div>分數<b id="sScore"></b></div><div>打中<b id="sHit"></b></div>
      <div>命中率<b id="sAcc"></b></div><div>最高連擊<b id="sCombo"></b></div>
      <div>踩到炸彈<b id="sBomb"></b></div><div>最高分<b id="sBest"></b></div>
    </div>
    <button class="go" id="again">再玩一次</button>
  </div></div>
</div>
<script>
(() => {
const W = 400, H = 600, GAME_T = 60;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const top = document.getElementById('hud').offsetHeight;
  const s = Math.min((innerWidth - 8) / W, (innerHeight - top - 10) / H), d = window.devicePixelRatio || 1;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * d); cv.height = Math.round(H * s * d); scale = s * d;
}
addEventListener('resize', resize); resize();

/* 音效 */
let ac = null;
function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } else if (ac.state === 'suspended') ac.resume(); }
function tone(f, d, type = 'square', v = .08, f2) {
  if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d);
}
function noise(d, v, lp) {
  if (!ac) return; const n = ac.sampleRate * d, b = ac.createBuffer(1, n, ac.sampleRate), x = b.getChannelData(0);
  for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = v;
  s.connect(f).connect(g).connect(ac.destination); s.start();
}
const sBonk = () => { noise(.08, .5, 1800); tone(320, .12, 'square', .07, 160); };
const sClank = () => { tone(1200, .15, 'square', .05, 900); tone(1800, .12, 'triangle', .04); };
const sGold = () => { [880, 1175, 1568].forEach((f, i) => setTimeout(() => tone(f, .12, 'sine', .07), i * 60)); };
const sBoom = () => { noise(.5, .8, 600); tone(90, .4, 'sawtooth', .1, 40); };
const sMiss = () => noise(.05, .2, 700);

/* 場景 */
const HOLES = [];
for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) HOLES.push({ x: 80 + c * 120, y: 245 + r * 125, m: null });
const bg = document.createElement('canvas'); bg.width = W * 2; bg.height = H * 2;
(() => {
  const g = bg.getContext('2d'); g.scale(2, 2);
  const sky = g.createLinearGradient(0, 0, 0, 140); sky.addColorStop(0, '#8ecae6'); sky.addColorStop(1, '#cdeffd');
  g.fillStyle = sky; g.fillRect(0, 0, W, 140);
  g.fillStyle = '#fff'; [[70, 50], [290, 35], [340, 80]].forEach(([x, y]) => { g.beginPath(); g.arc(x, y, 16, 0, 7); g.arc(x + 18, y - 6, 20, 0, 7); g.arc(x + 38, y, 15, 0, 7); g.fill(); });
  g.fillStyle = '#74c69d'; g.beginPath(); g.moveTo(0, 140); g.quadraticCurveTo(100, 95, 220, 130); g.quadraticCurveTo(320, 100, 400, 125); g.lineTo(400, 160); g.lineTo(0, 160); g.fill();
  const gr = g.createLinearGradient(0, 140, 0, H); gr.addColorStop(0, '#52b788'); gr.addColorStop(1, '#2d6a4f');
  g.fillStyle = gr; g.fillRect(0, 140, W, H - 140);
  for (let i = 0; i < 500; i++) { const x = Math.random() * W, y = 150 + Math.random() * (H - 150); g.strokeStyle = `rgba(${Math.random() < .5 ? '40,110,70' : '150,220,160'},.5)`; g.lineWidth = 1.2; g.beginPath(); g.moveTo(x, y); g.lineTo(x + (Math.random() - .5) * 4, y - 5 - Math.random() * 5); g.stroke(); }
  for (let i = 0; i < 14; i++) { const x = Math.random() * W, y = 160 + Math.random() * (H - 170); g.fillStyle = ['#ffd166', '#fff', '#f4acb7'][i % 3]; g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); }
  // 招牌
  g.fillStyle = '#8b5a2b'; g.fillRect(140, 150, 8, 40); g.fillRect(252, 150, 8, 40);
  g.fillStyle = '#bc6c25'; g.beginPath(); g.roundRect(120, 125, 160, 40, 8); g.fill();
  g.fillStyle = '#fefae0'; g.font = '900 22px "PingFang TC","Noto Sans TC",system-ui'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('打地鼠樂園', 200, 146);
  // 洞的背面
  for (const h of HOLES) {
    g.fillStyle = '#6b4226'; g.beginPath(); g.ellipse(h.x, h.y + 4, 56, 22, 0, 0, 7); g.fill();
    g.fillStyle = '#1e0f06'; g.beginPath(); g.ellipse(h.x, h.y, 46, 15, 0, 0, 7); g.fill();
  }
})();

/* 狀態 */
let state = 'menu', t = 0, spawnT = 0, score = 0, combo = 0, maxCombo = 0, taps = 0, hitN = 0, bombN = 0, fx = [], shake = 0;
let best = 0; try { best = +localStorage.getItem('whackBest') || 0; } catch (e) {}
function hud() {
  document.getElementById('hTime').textContent = Math.max(0, Math.ceil(GAME_T - t));
  document.getElementById('hScore').textContent = score;
  document.getElementById('hCombo').textContent = combo;
  document.getElementById('hBest').textContent = best;
}
function startGame() {
  HOLES.forEach(h => h.m = null); t = 0; spawnT = .5; score = combo = maxCombo = taps = hitN = bombN = 0; fx = [];
  state = 'play'; document.getElementById('menu').hidden = true; document.getElementById('over').hidden = true; hud();
}
function spawn() {
  const free = HOLES.filter(h => !h.m); if (!free.length) return;
  const h = free[(Math.random() * free.length) | 0], r = Math.random(), late = t / GAME_T;
  const type = r < .08 ? 'gold' : r < .2 + late * .08 ? 'bomb' : r < .38 + late * .1 ? 'helmet' : 'mole';
  const stay = (type === 'gold' ? .55 : 1.25) * (1 - late * .45);
  h.m = { type, h: 0, phase: 'up', stay, hp: type === 'helmet' ? 2 : 1, t: 0, hit: 0 };
}
function update(dt) {
  fx.forEach(f => f.t -= dt); fx = fx.filter(f => f.t > 0); shake = Math.max(0, shake - dt * 3);
  for (const h of HOLES) {
    const m = h.m; if (!m) continue; m.t += dt; m.hit = Math.max(0, m.hit - dt);
    if (m.phase === 'up') { m.h = Math.min(1, m.h + dt * 7); if (m.h >= 1 && m.t > m.stay) m.phase = 'down'; }
    else if (m.phase === 'down') { m.h -= dt * 6; if (m.h <= 0) h.m = null; }
    else if (m.phase === 'dizzy') { if (m.t > .45) { m.phase = 'down'; } }
    else if (m.phase === 'boom') { if (m.t > .5) h.m = null; }
  }
  if (state !== 'play') return;
  t += dt; spawnT -= dt;
  const late = t / GAME_T, maxUp = 2 + Math.floor(late * 3);
  if (spawnT <= 0) { if (HOLES.filter(h => h.m).length < maxUp) spawn(); spawnT = (.85 - late * .5) * (.6 + Math.random() * .7); }
  if (t >= GAME_T) endGame();
  hud();
}

/* 敲擊 */
cv.addEventListener('pointerdown', e => {
  initAudio(); if (state !== 'play') return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  taps++; fx.push({ hammer: true, x, y, t: .22 });
  let target = null;
  for (const h of HOLES) { const m = h.m; if (!m || m.phase === 'dizzy' || m.phase === 'boom' || m.h < .35) continue;
    if (Math.abs(x - h.x) < 55 && y > h.y - 95 * m.h - 20 && y < h.y + 25) { target = h; break; } }
  if (!target) { sMiss(); combo = 0; hud(); return; }
  const m = target.m;
  if (m.type === 'bomb') {
    m.phase = 'boom'; m.t = 0; score = Math.max(0, score - 30); combo = 0; bombN++; shake = 1; sBoom();
    fx.push({ x: target.x, y: target.y - 60, t: 1, s: '−30', col: '#e63946' });
    try { navigator.vibrate && navigator.vibrate(150); } catch (er) {}
    hud(); return;
  }
  m.hp--; m.hit = .15;
  if (m.hp > 0) { sClank(); fx.push({ x: target.x, y: target.y - 80, t: .7, s: '噹！再一下', col: '#adb5bd' }); m.t = Math.min(m.t, m.stay * .5); m.helmetOff = true; return; }
  hitN++; combo++; maxCombo = Math.max(maxCombo, combo);
  const base = m.type === 'gold' ? 50 : m.type === 'helmet' ? 30 : 10;
  const mult = 1 + Math.min(2, Math.floor(combo / 5) * .5);
  const gain = Math.round(base * mult); score += gain;
  m.type === 'gold' ? sGold() : sBonk();
  m.phase = 'dizzy'; m.t = 0;
  fx.push({ x: target.x, y: target.y - 90, t: .9, s: '+' + gain + (mult > 1 ? ` ×${mult}` : ''), col: m.type === 'gold' ? '#ffd60a' : '#fff' });
  fx.push({ stars: true, x: target.x, y: target.y - 75, t: .45 });
  try { navigator.vibrate && navigator.vibrate(15); } catch (er) {}
  hud();
});
function endGame() {
  state = 'over';
  if (score > best) { best = score; try { localStorage.setItem('whackBest', best); } catch (e) {} }
  document.getElementById('oTitle').textContent = score >= 900 ? '地鼠剋星！🏆' : score >= 500 ? '身手不凡！👏' : score >= 250 ? '還不錯！🙂' : '地鼠笑你了 🐹';
  document.getElementById('sScore').textContent = score; document.getElementById('sHit').textContent = hitN + ' 隻';
  document.getElementById('sAcc').textContent = (taps ? Math.round(hitN / taps * 100) : 0) + '%';
  document.getElementById('sCombo').textContent = maxCombo; document.getElementById('sBomb').textContent = bombN + ' 次';
  document.getElementById('sBest').textContent = best; hud();
  setTimeout(() => document.getElementById('over').hidden = false, 500);
}
document.getElementById('start').onclick = () => { initAudio(); startGame(); };
document.getElementById('again').onclick = () => { initAudio(); startGame(); };

/* 繪圖 */
function drawMole(h) {
  const m = h.m, k = m.phase === 'dizzy' ? 1 : m.h, x = h.x, by = h.y + 48 - k * 78;   // 身體中心
  const squash = m.hit > 0 || m.phase === 'dizzy' ? .85 : 1;
  ctx.save();
  ctx.beginPath(); ctx.rect(x - 70, h.y - 160, 140, 160); ctx.ellipse(h.x, h.y, 46, 15, 0, 0, Math.PI); ctx.clip();
  ctx.translate(x, by); ctx.scale(1 / squash * .98 + .02, squash);
  if (m.type === 'bomb') {
    if (m.phase === 'boom') {
      const r = 20 + m.t * 160; ctx.fillStyle = `rgba(255,${120 + m.t * 200},0,${1 - m.t * 2})`; ctx.beginPath(); ctx.arc(0, -10, r, 0, 7); ctx.fill();
    } else {
      ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(0, -8, 30, 0, 7); ctx.fill();
      ctx.fillStyle = '#555'; ctx.fillRect(-8, -44, 16, 8);
      ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -44); ctx.quadraticCurveTo(10, -58, 4, -66); ctx.stroke();
      ctx.fillStyle = Math.random() < .5 ? '#ffd60a' : '#ff6b00'; ctx.beginPath(); ctx.arc(4, -67, 4 + Math.random() * 2, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(-10, -20, 7, 0, 7); ctx.fill();
      ctx.fillStyle = '#e63946'; ctx.font = '900 14px system-ui'; ctx.textAlign = 'center'; ctx.fillText('危', 0, -2);
    }
  } else {
    const gold = m.type === 'gold';
    const body = gold ? '#f4c430' : '#8d5a3b', belly = gold ? '#fff3b0' : '#d9a77b';
    ctx.fillStyle = body; ctx.beginPath(); ctx.ellipse(0, 0, 36, 46, 0, 0, 7); ctx.fill();
    ctx.fillStyle = belly; ctx.beginPath(); ctx.ellipse(0, 18, 24, 26, 0, 0, 7); ctx.fill();
    // 耳朵
    ctx.fillStyle = body; ctx.beginPath(); ctx.arc(-26, -36, 9, 0, 7); ctx.arc(26, -36, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#f4acb7'; ctx.beginPath(); ctx.arc(-26, -36, 4.5, 0, 7); ctx.arc(26, -36, 4.5, 0, 7); ctx.fill();
    // 眼睛
    if (m.phase === 'dizzy') {
      ctx.strokeStyle = '#222'; ctx.lineWidth = 2.5;
      for (const s of [-1, 1]) { ctx.beginPath(); ctx.moveTo(s * 13 - 5, -18); ctx.lineTo(s * 13 + 5, -10); ctx.moveTo(s * 13 + 5, -18); ctx.lineTo(s * 13 - 5, -10); ctx.stroke(); }
    } else {
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(-13, -14, 5, 0, 7); ctx.arc(13, -14, 5, 0, 7); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-11.5, -16, 1.8, 0, 7); ctx.arc(14.5, -16, 1.8, 0, 7); ctx.fill();
    }
    // 鼻子、鬍鬚、門牙
    ctx.fillStyle = '#ff8fab'; ctx.beginPath(); ctx.ellipse(0, -2, 8, 6, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = gold ? '#a07a00' : '#4a2c1a'; ctx.lineWidth = 1.2;
    for (const s of [-1, 1]) for (const dy of [-3, 2]) { ctx.beginPath(); ctx.moveTo(s * 9, dy); ctx.lineTo(s * 26, dy - 2 + (dy > 0 ? 3 : 0)); ctx.stroke(); }
    ctx.fillStyle = '#fff'; ctx.fillRect(-5, 5, 4.5, 7); ctx.fillRect(.5, 5, 4.5, 7);
    ctx.fillStyle = '#ffadc6aa'; ctx.beginPath(); ctx.ellipse(-22, 2, 6, 4, 0, 0, 7); ctx.ellipse(22, 2, 6, 4, 0, 0, 7); ctx.fill();
    if (gold) { ctx.fillStyle = '#fff'; ctx.font = '14px system-ui'; ctx.textAlign = 'center'; ctx.fillText('✨', 24, -48); }
    // 頭盔
    if (m.type === 'helmet' && !m.helmetOff) {
      ctx.fillStyle = '#ffb703'; ctx.beginPath(); ctx.arc(0, -26, 34, Math.PI, 0); ctx.fill();
      ctx.fillRect(-42, -28, 84, 7); ctx.fillStyle = '#fb8500'; ctx.fillRect(-4, -60, 8, 32);
    } else if (m.type === 'helmet' && m.helmetOff && m.phase !== 'dizzy') {
      ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.ellipse(10, -40, 9, 6, 0, 0, 7); ctx.fill(); // 腫包
    }
  }
  ctx.restore();
}
function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 14, (Math.random() - .5) * shake * 14);
  ctx.drawImage(bg, 0, 0, W, H);
  for (const h of HOLES) {
    if (h.m) drawMole(h);
    // 洞口前緣土堆
    ctx.fillStyle = '#7f4f24'; ctx.beginPath(); ctx.ellipse(h.x, h.y + 3, 56, 20, 0, 0, Math.PI); ctx.ellipse(h.x, h.y, 46, 13, 0, Math.PI, 0, true); ctx.fill();
    ctx.fillStyle = '#9c6644'; ctx.beginPath(); ctx.ellipse(h.x, h.y + 9, 50, 11, 0, 0, Math.PI); ctx.fill();
  }
  for (const f of fx) {
    if (f.hammer) {
      const k = f.t / .22; ctx.save(); ctx.translate(f.x + 18, f.y - 18); ctx.rotate(-.9 * k + .1);
      ctx.fillStyle = '#8b5a2b'; ctx.fillRect(-4, 0, 8, 46);
      ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.roundRect(-22, -14, 44, 22, 6); ctx.fill();
      ctx.fillStyle = '#ffccd5'; ctx.fillRect(-22, -14, 6, 22); ctx.fillRect(16, -14, 6, 22);
      ctx.restore(); continue;
    }
    if (f.stars) { for (let i = 0; i < 4; i++) { const a = i / 4 * 6.28 + (1 - f.t) * 8; ctx.font = '16px system-ui'; ctx.textAlign = 'center'; ctx.fillText('⭐', f.x + Math.cos(a) * 26, f.y + Math.sin(a) * 9); } continue; }
    ctx.globalAlpha = Math.min(1, f.t * 2); ctx.font = '900 20px system-ui'; ctx.textAlign = 'center';
    ctx.lineWidth = 4; ctx.strokeStyle = '#1b4332'; ctx.strokeText(f.s, f.x, f.y - (1 - f.t) * 24);
    ctx.fillStyle = f.col; ctx.fillText(f.s, f.x, f.y - (1 - f.t) * 24); ctx.globalAlpha = 1;
  }
  if (state === 'play' && GAME_T - t < 10) { ctx.fillStyle = `rgba(230,57,70,${.25 + .15 * Math.sin(t * 12)})`; ctx.fillRect(0, 0, W, 6); }
}

let last = performance.now();
function loop(now) { const dt = Math.min(.033, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); }
hud(); requestAnimationFrame(loop);
window.__wm = { HOLES, get state() { return state; }, get score() { return score; }, get hitN() { return hitN; }, startGame };
})();
</script>
</body>
</html>

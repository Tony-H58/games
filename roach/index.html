<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>打蟑螂</title>
<style>
  html,body{margin:0;height:100%;background:#2b2118;color:#fff7e8;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #hud{max-width:520px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:8px 14px 4px;font-size:11px}
  #hud b{display:block;font-size:21px;color:#ffd166;font-variant-numeric:tabular-nums}
  #esc{font-size:12px;letter-spacing:1px}
  #wrap{position:relative;display:flex;justify-content:center}
  canvas{display:block;touch-action:none;border-radius:12px}
  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .box{background:#3a2c20f0;border:2px solid #ffd166;border-radius:16px;padding:20px;width:min(310px,86%);text-align:center}
  .box h2{margin:0 0 6px;font-size:28px;color:#ffd166}
  .box p{font-size:13px;line-height:1.75;margin:6px 0 14px;text-align:left}
  .go{width:100%;background:#2a9d8f;color:#fff;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:800}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 14px}
  .stats div{background:#0004;border-radius:10px;padding:7px;font-size:11px}
  .stats b{display:block;font-size:20px;color:#ffd166}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="hud">
  <div>時間<b id="hTime">60</b></div>
  <div>分數<b id="hScore">0</b></div>
  <div>連擊<b id="hCombo">0</b></div>
  <div style="text-align:right">逃走<div id="esc"></div></div>
</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="ov" id="menu"><div class="box">
    <h2>🩴 打蟑螂</h2>
    <p>半夜開燈，廚房地上一堆蟑螂！<br>看到蟑螂就<b>點下去</b>，用拖鞋拍死牠。<br>
    🪳 小蟑螂 10・大蟑螂要拍 <b>2 下</b> 30<br>
    🪽 <b>會飛的</b>突然起飛衝向你！趁牠飛的時候拍 50<br>
    👑 蟑螂王要拍好幾下 100<br>
    蟑螂逛一陣子會躲回縫裡，<b>逃走 10 隻就結束</b>。拍空了會把附近的蟑螂嚇跑！</p>
    <button class="go" id="start">抓起拖鞋，開燈！</button>
  </div></div>
  <div class="ov" id="over" hidden><div class="box">
    <h2 id="oTitle"></h2>
    <div class="stats">
      <div>分數<b id="sScore"></b></div><div>打死<b id="sKill"></b></div>
      <div>命中率<b id="sAcc"></b></div><div>最高連擊<b id="sCombo"></b></div>
      <div>逃走<b id="sEsc"></b></div><div>最高分<b id="sBest"></b></div>
    </div>
    <button class="go" id="again">再打一場</button>
  </div></div>
</div>
<script>
(() => {
const W = 400, H = 640, GAME_T = 60, MAX_ESC = 10;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const top = document.getElementById('hud').offsetHeight;
  const s = Math.min((innerWidth - 8) / W, (innerHeight - top - 10) / H), d = window.devicePixelRatio || 1;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * d); cv.height = Math.round(H * s * d); scale = s * d;
}
addEventListener('resize', resize); resize();

/* 音效 */
let ac = null, scuttle = null;
function initAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (ac.state === 'suspended') ac.resume();
  if (!scuttle) {   // 沙沙聲
    const n = ac.sampleRate * 2, b = ac.createBuffer(1, n, ac.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (Math.random() < .35 ? 1 : .15);
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = b; s.loop = true; f.type = 'highpass'; f.frequency.value = 3500; g.gain.value = 0;
    s.connect(f).connect(g).connect(ac.destination); s.start(); scuttle = g;
  }
}
function noise(d, v, lp) { if (!ac) return; const n = ac.sampleRate * d, b = ac.createBuffer(1, n, ac.sampleRate), x = b.getChannelData(0); for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 4); const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = v; s.connect(f).connect(g).connect(ac.destination); s.start(); }
function tone(f, d, type = 'sine', v = .06, f2) { if (!ac) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d); }
const sSlap = hit => { noise(.12, hit ? .8 : .5, hit ? 2400 : 1500); tone(hit ? 160 : 120, .08, 'square', .05, 70); };
const sSquish = () => { noise(.15, .25, 600); tone(300, .1, 'sine', .05, 120); };
const sFly = () => tone(180, .9, 'sawtooth', .04, 260);
const sEsc = () => tone(600, .15, 'triangle', .04, 300);
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* 場景 */
const HOLES = [{ x: 78, y: 128, n: '冰箱下' }, { x: 336, y: 300, n: '櫃子縫' }, { x: 300, y: 560, n: '排水孔' }, { x: 40, y: 470, n: '垃圾桶後' }];
const bg = document.createElement('canvas'); bg.width = W * 2; bg.height = H * 2;
(() => {
  const g = bg.getContext('2d'); g.scale(2, 2);
  g.fillStyle = '#efe4cf'; g.fillRect(0, 0, W, H);
  for (let y = 0; y < H; y += 50) for (let x = 0; x < W; x += 50) { g.fillStyle = (x + y) / 50 % 2 ? '#e7d9bf' : '#f2e8d5'; g.fillRect(x, y, 50, 50); }
  g.strokeStyle = '#cdbb98'; g.lineWidth = 1.5; for (let x = 0; x <= W; x += 50) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); } for (let y = 0; y <= H; y += 50) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  // 冰箱
  g.fillStyle = '#d9dde2'; g.fillRect(10, 0, 140, 120); g.fillStyle = '#bfc5cc'; g.fillRect(10, 0, 140, 8); g.fillStyle = '#9aa1a9'; g.fillRect(130, 20, 6, 60);
  g.fillStyle = '#1a1410'; g.fillRect(14, 118, 132, 10);
  g.fillStyle = '#5a6068'; g.font = '700 13px system-ui'; g.textAlign = 'center'; g.fillText('冰箱', 70, 66);
  // 流理台櫃子（右側）
  g.fillStyle = '#b07a4a'; g.fillRect(352, 160, 48, 300); g.strokeStyle = '#8a5a30'; g.lineWidth = 2; g.strokeRect(354, 162, 44, 140); g.strokeRect(354, 306, 44, 150);
  g.fillStyle = '#1a1410'; g.fillRect(346, 280, 8, 40);
  // 垃圾桶
  g.fillStyle = '#4b7f52'; g.beginPath(); g.arc(40, 430, 30, 0, 7); g.fill(); g.fillStyle = '#3a6a42'; g.beginPath(); g.arc(40, 430, 22, 0, 7); g.fill();
  g.fillStyle = '#1a1410'; g.beginPath(); g.ellipse(40, 466, 16, 6, 0, 0, 7); g.fill();
  // 排水孔
  g.fillStyle = '#9aa1a9'; g.beginPath(); g.arc(300, 560, 18, 0, 7); g.fill(); g.strokeStyle = '#4b5258'; g.lineWidth = 2; for (let k = -12; k <= 12; k += 6) { g.beginPath(); g.moveTo(300 + k, 548); g.lineTo(300 + k, 572); g.stroke(); }
  // 餐桌腳與食物屑
  g.fillStyle = '#6b4a2e'; for (const [x, y] of [[180, 300], [260, 300], [180, 400], [260, 400]]) { g.fillRect(x - 6, y - 6, 12, 12); }
  g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(170, 290, 100, 120);
  g.fillStyle = '#d4a373'; for (let i = 0; i < 25; i++) { g.beginPath(); g.arc(150 + Math.random() * 140, 260 + Math.random() * 180, 1.6, 0, 7); g.fill(); }
})();

/* 狀態 */
const TYPES = {
  small: { size: 13, sp: 165, hp: 1, pts: 10 },
  big:   { size: 21, sp: 120, hp: 2, pts: 30 },
  fly:   { size: 19, sp: 130, hp: 1, pts: 50 },
  king:  { size: 34, sp: 85,  hp: 4, pts: 100 },
};
let roaches = [], splats = [], fx = [], state = 'menu', t = 0, spawnT = 0;
let score = 0, kills = 0, taps = 0, hits = 0, combo = 0, maxCombo = 0, escaped = 0, shake = 0;
let best = 0; try { best = +localStorage.getItem('roachBest') || 0; } catch (e) {}
function hud() {
  document.getElementById('hTime').textContent = Math.max(0, Math.ceil(GAME_T - t));
  document.getElementById('hScore').textContent = score;
  document.getElementById('hCombo').textContent = combo;
  document.getElementById('esc').textContent = `${escaped} / ${MAX_ESC}`;
}
function startGame() {
  roaches = []; splats = []; fx = []; t = 0; spawnT = .3; score = kills = taps = hits = combo = maxCombo = escaped = 0;
  state = 'play'; document.getElementById('menu').hidden = true; document.getElementById('over').hidden = true; hud();
}
function spawn() {
  const late = t / GAME_T, r = Math.random();
  const type = r < .04 + late * .03 ? 'king' : r < .2 + late * .08 ? 'fly' : r < .45 + late * .1 ? 'big' : 'small';
  const T = TYPES[type], h = HOLES[(Math.random() * HOLES.length) | 0];
  roaches.push({ type, T, x: h.x, y: h.y, ang: Math.atan2(330 - h.y, 200 - h.x) + (Math.random() - .5), hp: T.hp, state: 'run', burst: .5 + Math.random(), pause: 0,
    life: 6 + Math.random() * 6, age: 0, ph: Math.random() * 9, flee: 0, flyT: type === 'fly' ? 1.5 + Math.random() * 2.5 : 0, z: 0, hurt: 0 });
}
function nearestHole(x, y) { return HOLES.reduce((m, h) => (Math.hypot(h.x - x, h.y - y) < Math.hypot(m.x - x, m.y - y) ? h : m), HOLES[0]); }

/* 拍 */
cv.addEventListener('pointerdown', e => {
  initAudio(); if (state !== 'play') return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  taps++; fx.push({ slap: 1, x, y, t: .32 });
  let target = null, bd = 1e9;
  for (const rc of roaches) { const R = rc.T.size * (1 + rc.z * .8) * 1.25 + 18, d = Math.hypot(rc.x - x, rc.y - y); if (d < R && d < bd) { bd = d; target = rc; } }
  if (!target) {
    sSlap(false); combo = 0; shake = .2;
    for (const rc of roaches) if (Math.hypot(rc.x - x, rc.y - y) < 130 && rc.state !== 'fly') { rc.flee = .9; rc.ang = Math.atan2(rc.y - y, rc.x - x) + (Math.random() - .5) * .6; rc.pause = 0; }
    hud(); return;
  }
  hits++; target.hp--; target.hurt = .2; sSlap(true); vib(20); shake = .35;
  if (target.hp > 0) { fx.push({ x: target.x, y: target.y - 24, t: .7, s: '再一下！', col: '#e76f51' }); target.flee = 1; target.ang += Math.PI * (.5 + Math.random()); target.pause = 0; hud(); return; }
  // 打死
  kills++; combo++; maxCombo = Math.max(maxCombo, combo); sSquish();
  const mult = 1 + Math.min(2, Math.floor(combo / 4) * .5), airBonus = target.state === 'fly' ? '空中攔截！' : '';
  const gain = Math.round(target.T.pts * mult); score += gain;
  splats.push({ x: target.x, y: target.y, ang: target.ang, size: target.T.size, type: target.type, t: 6 });
  fx.push({ x: target.x, y: target.y - 26, t: 1, s: `${airBonus}+${gain}${mult > 1 ? ' ×' + mult : ''}`, col: target.type === 'king' ? '#d4a017' : '#264653' });
  roaches = roaches.filter(q => q !== target);
  if (score > best) { best = score; try { localStorage.setItem('roachBest', best); } catch (er) {} }
  hud();
});

/* 更新 */
function update(dt) {
  fx.forEach(f => f.t -= dt); fx = fx.filter(f => f.t > 0);
  splats.forEach(s => s.t -= dt); splats = splats.filter(s => s.t > 0);
  shake = Math.max(0, shake - dt * 3);
  if (state !== 'play') { if (scuttle) scuttle.gain.setTargetAtTime(0, ac.currentTime, .1); return; }
  t += dt; spawnT -= dt;
  const maxN = 3 + Math.floor(t / 8);
  if (spawnT <= 0) { if (roaches.length < maxN) spawn(); spawnT = Math.max(.45, 1.5 - t * .018) * (.6 + Math.random() * .8); }
  let running = 0;
  for (const rc of roaches) {
    rc.age += dt; rc.ph += dt * 30; rc.hurt = Math.max(0, rc.hurt - dt); rc.flee = Math.max(0, rc.flee - dt);
    if (rc.state === 'fly') {
      // 起飛衝向畫面前方（變大），然後落地
      rc.z = Math.sin(Math.min(1, rc.flyK) * Math.PI) * 1; rc.flyK += dt / 1.6;
      rc.x += Math.cos(rc.ang) * 150 * dt; rc.y += Math.sin(rc.ang) * 150 * dt;
      if (rc.flyK >= 1) { rc.state = 'run'; rc.z = 0; rc.flyT = 99; }
      running++; continue;
    }
    if (rc.type === 'fly' && rc.age > rc.flyT && rc.state === 'run') { rc.state = 'fly'; rc.flyK = 0; rc.ang = Math.atan2(470 - rc.y, 200 - rc.x) + (Math.random() - .5) * .8; sFly(); fx.push({ x: rc.x, y: rc.y - 24, t: .8, s: '飛起來了！', col: '#e63946' }); continue; }
    if (rc.age > rc.life && rc.state === 'run') rc.state = 'home';
    if (rc.state === 'home') {
      const h = nearestHole(rc.x, rc.y); const ta = Math.atan2(h.y - rc.y, h.x - rc.x); let d = ta - rc.ang; d = Math.atan2(Math.sin(d), Math.cos(d)); rc.ang += d * Math.min(1, dt * 6);
      if (Math.hypot(h.x - rc.x, h.y - rc.y) < 10) { rc.gone = true; escaped++; sEsc(); fx.push({ x: h.x, y: h.y - 20, t: 1, s: '逃走了…', col: '#7f5539' }); combo = 0; hud(); if (escaped >= MAX_ESC) { endGame(); return; } continue; }
    } else {
      // 衝刺—停頓—急轉彎
      if (rc.pause > 0 && rc.flee <= 0) { rc.pause -= dt; continue; }
      rc.burst -= dt;
      if (rc.burst <= 0) { rc.burst = .4 + Math.random() * 1.1; rc.pause = Math.random() < .5 ? .2 + Math.random() * .6 : 0; rc.ang += (Math.random() - .5) * 2.6; }
      rc.ang += Math.sin(rc.ph * .07) * dt * 2;
    }
    // 牆邊轉向
    const m = 26;
    if (rc.x < m || rc.x > W - m || rc.y < 140 || rc.y > H - m) { const ta = Math.atan2(380 - rc.y, 200 - rc.x); let d = ta - rc.ang; d = Math.atan2(Math.sin(d), Math.cos(d)); rc.ang += d * Math.min(1, dt * 8); }
    const sp = rc.T.sp * (1 + t / GAME_T * .35) * (rc.flee > 0 ? 2.2 : 1) * (rc.state === 'home' ? 1.2 : 1);
    rc.x += Math.cos(rc.ang) * sp * dt; rc.y += Math.sin(rc.ang) * sp * dt;
    rc.x = Math.max(8, Math.min(W - 8, rc.x)); rc.y = Math.max(124, Math.min(H - 8, rc.y));
    running++;
  }
  roaches = roaches.filter(r => !r.gone);
  if (scuttle) scuttle.gain.setTargetAtTime(Math.min(.06, running * .012), ac.currentTime, .1);
  if (t >= GAME_T) endGame();
  hud();
}
function endGame() {
  state = 'over';
  document.getElementById('oTitle').textContent = escaped >= MAX_ESC ? '蟑螂佔領廚房了 😱' : kills >= 40 ? '蟑螂剋星！🏆' : kills >= 20 ? '拖鞋高手 👏' : '還要再練練 🩴';
  document.getElementById('sScore').textContent = score; document.getElementById('sKill').textContent = kills + ' 隻';
  document.getElementById('sAcc').textContent = (taps ? Math.round(hits / taps * 100) : 0) + '%';
  document.getElementById('sCombo').textContent = maxCombo; document.getElementById('sEsc').textContent = escaped + ' 隻';
  document.getElementById('sBest').textContent = best; hud();
  setTimeout(() => document.getElementById('over').hidden = false, 500);
}
document.getElementById('start').onclick = () => { initAudio(); startGame(); };
document.getElementById('again').onclick = () => { initAudio(); startGame(); };

/* 繪圖 */
function drawRoach(rc) {
  const s = rc.T.size * (1 + rc.z * .9);
  ctx.save();
  if (rc.z > 0) { ctx.fillStyle = `rgba(0,0,0,${.25 - rc.z * .12})`; ctx.beginPath(); ctx.ellipse(rc.x + rc.z * 24, rc.y + rc.z * 30, rc.T.size * .9, rc.T.size * .5, rc.ang, 0, 7); ctx.fill(); }
  ctx.translate(rc.x, rc.y); ctx.rotate(rc.ang);
  const body = rc.hurt > 0 ? '#e9c46a' : rc.type === 'king' ? '#3d1f0c' : '#6b3a1a', shield = rc.type === 'king' ? '#8a4a1a' : '#a8682e';
  // 腳
  const moving = rc.pause <= 0 || rc.flee > 0 || rc.state === 'home';
  ctx.strokeStyle = '#4a2a12'; ctx.lineWidth = Math.max(1.2, s * .07); ctx.lineCap = 'round';
  for (let i = 0; i < 3; i++) for (const side of [-1, 1]) {
    const w = moving && rc.z === 0 ? Math.sin(rc.ph + i * 2 + (side > 0 ? Math.PI : 0)) * .35 : .1;
    const bx = s * (.25 - i * .3), a = side * (1.1 + i * .25) + w;
    ctx.beginPath(); ctx.moveTo(bx, side * s * .2); ctx.lineTo(bx + Math.cos(a) * s * .55, Math.sin(a) * s * .65); ctx.lineTo(bx + Math.cos(a) * s * .55 - s * .25, Math.sin(a) * s * .95); ctx.stroke();
  }
  // 觸鬚
  ctx.lineWidth = Math.max(.8, s * .035);
  for (const side of [-1, 1]) { const wv = Math.sin(rc.ph * .2 + side) * .25; ctx.beginPath(); ctx.moveTo(s * .6, side * s * .1); ctx.quadraticCurveTo(s * 1.2, side * s * (.3 + wv), s * 1.7, side * s * (.7 + wv)); ctx.stroke(); }
  // 飛行時的翅膀
  if (rc.state === 'fly') {
    const flap = Math.abs(Math.sin(performance.now() / 25));
    ctx.fillStyle = 'rgba(200,140,70,.45)';
    for (const side of [-1, 1]) { ctx.beginPath(); ctx.ellipse(-s * .1, side * s * (.4 + flap * .3), s * .7, s * .3, side * (.5 + flap * .4), 0, 7); ctx.fill(); }
  }
  // 身體
  const g = ctx.createRadialGradient(s * .1, -s * .1, s * .1, 0, 0, s);
  g.addColorStop(0, rc.hurt > 0 ? '#fff3b0' : '#9a5a2a'); g.addColorStop(1, body);
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(-s * .12, 0, s * .7, s * .36, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(s * .2, 0); ctx.lineTo(-s * .8, 0); ctx.stroke();
  ctx.fillStyle = shield; ctx.beginPath(); ctx.ellipse(s * .42, 0, s * .22, s * .3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.beginPath(); ctx.ellipse(-s * .1, -s * .14, s * .35, s * .07, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#2b1608'; ctx.beginPath(); ctx.arc(s * .62, 0, s * .1, 0, 7); ctx.fill();
  if (rc.type === 'king') { ctx.rotate(-rc.ang); ctx.font = `${s * .7}px system-ui`; ctx.textAlign = 'center'; ctx.fillText('👑', 0, -s * .55); }
  ctx.restore();
}
function drawSplat(sp) {
  ctx.save(); ctx.globalAlpha = Math.min(1, sp.t / 1.5); ctx.translate(sp.x, sp.y); ctx.rotate(sp.ang);
  const s = sp.size;
  ctx.fillStyle = 'rgba(150,120,60,.45)';
  ctx.beginPath(); for (let i = 0; i <= 12; i++) { const a = i / 12 * 6.28, r = s * (.9 + .35 * Math.sin(i * 2.7 + s)); ctx.lineTo(Math.cos(a) * r * 1.2, Math.sin(a) * r * .8); } ctx.fill();
  ctx.fillStyle = sp.type === 'king' ? '#3d1f0c' : '#5a3216';
  ctx.beginPath(); ctx.ellipse(0, 0, s * .8, s * .22, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#4a2a12'; ctx.lineWidth = 1.2;
  for (let i = 0; i < 6; i++) { const a = (i < 3 ? -1 : 1) * (.8 + (i % 3) * .5); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * s, Math.sin(a) * s * .9); ctx.stroke(); }
  ctx.restore();
}
function drawSlipper(f) {
  const k = f.t / .32, up = k > .55 ? (k - .55) / .45 : 0;
  ctx.save(); ctx.globalAlpha = Math.min(1, k * 2.5); ctx.translate(f.x + 10 + up * 30, f.y + 6 + up * 40); ctx.rotate(-.35 + up * .5); ctx.scale(1 + up * .35, 1 + up * .35);

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>狙擊喪屍</title>
<style>
  html,body{margin:0;height:100%;background:#120c14;color:#f5eee6;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #hud{max-width:520px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;padding:8px 12px 4px;font-size:11px}
  #hud b{display:block;font-size:20px;color:#ffd166;font-variant-numeric:tabular-nums}
  #hearts{font-size:18px}
  #ammo{display:flex;gap:3px;margin-top:3px}
  #ammo i{width:6px;height:18px;border-radius:3px 3px 1px 1px;background:linear-gradient(#ffd166 30%,#b5838d 30%)}
  #ammo i.used{opacity:.15}
  #wrap{position:relative;display:flex;justify-content:center}
  canvas{display:block;touch-action:none;border-radius:12px}
  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .box{background:#1f1622ee;border:2px solid #6a994e;border-radius:16px;padding:20px;width:min(310px,86%);text-align:center}
  .box h2{margin:0 0 6px;font-size:28px;color:#a7c957}
  .box p{font-size:13px;line-height:1.75;margin:6px 0 14px;text-align:left}
  .go{width:100%;background:#6a994e;color:#fff;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:800}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 14px}
  .stats div{background:#0004;border-radius:10px;padding:7px;font-size:11px}
  .stats b{display:block;font-size:20px;color:#ffd166}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="hud">
  <div>波數<b id="hWave">1</b></div>
  <div>分數<b id="hScore">0</b></div>
  <div style="text-align:center">彈匣<div id="ammo"></div></div>
  <div style="text-align:right">生命<div id="hearts"></div></div>
</div>
<div id="wrap">
  <canvas id="c"></canvas>
  <div class="ov" id="menu"><div class="box">
    <h2>🧟 狙擊喪屍</h2>
    <p>喪屍正從街道另一頭走過來！<br>
    👆 <b>按住畫面</b>打開狙擊鏡，<b>拖動瞄準</b>，<b>放開開槍</b>。<br>
    🎯 爆頭一槍倒，打身體要多開幾槍。<br>
    🔫 彈匣 5 發，打完會自動換彈。<br>
    ❤️ 喪屍摸到路障就扣一顆心，3 顆扣完就輸。<br>
    🏃 跑者很快・🛡️ 胖子很耐打</p>
    <button class="go" id="start">上膛，開始</button>
  </div></div>
  <div class="ov" id="over" hidden><div class="box">
    <h2 id="oTitle"></h2>
    <div class="stats">
      <div>分數<b id="sScore"></b></div><div>撐到<b id="sWave"></b></div>
      <div>擊倒<b id="sKill"></b></div><div>爆頭率<b id="sHead"></b></div>
      <div>命中率<b id="sAcc"></b></div><div>最高分<b id="sBest"></b></div>
    </div>
    <button class="go" id="again">再守一次</button>
  </div></div>
</div>
<script>
(() => {
const W = 400, H = 620, HZ = 205, K = 380, S0 = 120, MAG = 5, ZOOM = 2.6, SR = 112;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const top = document.getElementById('hud').offsetHeight;
  const s = Math.min((innerWidth - 8) / W, (innerHeight - top - 10) / H), d = window.devicePixelRatio || 1;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * d); cv.height = Math.round(H * s * d); scale = s * d;
}
addEventListener('resize', resize); resize();
const proj = (x, z) => ({ x: 200 + x * S0 * 1.5 / z, y: HZ + K / z, s: S0 / z });
const BARRIER_Z = 1.3;

/* 音效 */
let ac = null;
function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } else if (ac.state === 'suspended') ac.resume(); }
function noise(d, v, lp, decay = 3) {
  if (!ac) return; const n = ac.sampleRate * d, b = ac.createBuffer(1, n, ac.sampleRate), x = b.getChannelData(0);
  for (let i = 0; i < n; i++) x[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay);
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = b; f.type = 'lowpass'; f.frequency.value = lp; g.gain.value = v;
  s.connect(f).connect(g).connect(ac.destination); s.start();
}
function tone(f, d, type = 'sine', v = .06, f2, delay = 0) { if (!ac) return; const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02); }
const sShot = () => { noise(.5, .9, 3000, 5); tone(70, .3, 'sine', .3, 35); };
const sClick = () => tone(1800, .03, 'square', .05);
const sReload = () => { tone(900, .05, 'square', .05, null, .2); tone(600, .06, 'square', .05, null, .7); tone(1200, .05, 'square', .06, null, 1.2); };
const sHit = head => { noise(.12, .4, head ? 1500 : 700); if (head) tone(1500, .1, 'triangle', .05, 2200); };
const sGroan = () => tone(90 + Math.random() * 40, .9, 'sawtooth', .025, 60 + Math.random() * 20);
const sHurt = () => { noise(.3, .5, 500); tone(200, .4, 'square', .06, 80); };
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* 背景 */
const bg = document.createElement('canvas'); bg.width = W * 2; bg.height = H * 2;
(() => {
  const g = bg.getContext('2d'); g.scale(2, 2);
  const sky = g.createLinearGradient(0, 0, 0, HZ + 20);
  sky.addColorStop(0, '#2d1b3d'); sky.addColorStop(.55, '#a4405a'); sky.addColorStop(1, '#f2a65a');
  g.fillStyle = sky; g.fillRect(0, 0, W, HZ + 30);
  g.fillStyle = '#ffd6a0'; g.globalAlpha = .9; g.beginPath(); g.arc(250, HZ - 8, 26, 0, 7); g.fill(); g.globalAlpha = 1;
  // 遠方城市剪影
  g.fillStyle = '#3b2240';
  let x = 0; while (x < W) { const w = 14 + Math.random() * 30, h = 20 + Math.random() * 70; g.fillRect(x, HZ - h, w, h + 5); x += w + 2; }
  g.fillStyle = '#ffcf7044'; for (let i = 0; i < 40; i++) g.fillRect(Math.random() * W, HZ - Math.random() * 70, 2, 3);
  // 地面與街道
  const gr = g.createLinearGradient(0, HZ, 0, H); gr.addColorStop(0, '#5e4b56'); gr.addColorStop(1, '#2a2229');
  g.fillStyle = gr; g.fillRect(0, HZ, W, H - HZ);
  const a = proj(-1.25, 14), b = proj(1.25, 14), c = proj(1.25, .9), d = proj(-1.25, .9);
  g.fillStyle = '#4a3f47'; g.beginPath(); g.moveTo(a.x, a.y); g.lineTo(b.x, b.y); g.lineTo(c.x, c.y); g.lineTo(d.x, d.y); g.fill();
  // 中線
  for (let z = 1.2; z < 14; z += .9) { const p1 = proj(0, z), p2 = proj(0, z + .45); g.strokeStyle = '#d9c38b88'; g.lineWidth = Math.max(1, 6 / z); g.beginPath(); g.moveTo(p1.x, p1.y); g.lineTo(p2.x, p2.y); g.stroke(); }
  // 街道兩側建築（透視牆面）
  const BH = 3.2;
  for (const side of [-1, 1]) {
    const zs = [.6, 1.4, 2.4, 3.6, 5, 6.8, 9, 11.5, 14];
    for (let k = 0; k < zs.length - 1; k++) {
      const n = proj(side * 1.45, zs[k]), f = proj(side * 1.45, zs[k + 1]);
      const hn = BH * (1 + (k % 3) * .25), hf = hn;
      g.fillStyle = side < 0 ? (k % 2 ? '#2b2130' : '#33283a') : (k % 2 ? '#3a2d3f' : '#30253a');
      g.beginPath(); g.moveTo(n.x, n.y); g.lineTo(f.x, f.y); g.lineTo(f.x, f.y - hf * f.s); g.lineTo(n.x, n.y - hn * n.s); g.closePath(); g.fill();
      // 窗戶
      for (let r = 0; r < 3; r++) for (let q = 0; q < 2; q++) {
        const u0 = .2 + q * .4, u1 = u0 + .2, v = .3 + r * .25;
        const lerp = (a, b, u) => a + (b - a) * u;
        const x0 = lerp(n.x, f.x, u0), x1 = lerp(n.x, f.x, u1);
        const y0b = lerp(n.y - hn * n.s * v, f.y - hf * f.s * v, u0), y1b = lerp(n.y - hn * n.s * v, f.y - hf * f.s * v, u1);
        const hh0 = lerp(n.s, f.s, u0) * .35, hh1 = lerp(n.s, f.s, u1) * .35;
        g.fillStyle = Math.random() < .25 ? '#ffcf7055' : '#1a141c';
        g.beginPath(); g.moveTo(x0, y0b); g.lineTo(x1, y1b); g.lineTo(x1, y1b - hh1); g.lineTo(x0, y0b - hh0); g.closePath(); g.fill();
      }
    }
    // 人行道
    const a1 = proj(side * 1.25, 14), a2 = proj(side * 1.45, 14), a3 = proj(side * 1.45, .9), a4 = proj(side * 1.25, .9);
    g.fillStyle = '#6b5b63'; g.beginPath(); g.moveTo(a1.x, a1.y); g.lineTo(a2.x, a2.y); g.lineTo(a3.x, a3.y); g.lineTo(a4.x, a4.y); g.fill();
  }
  // 廢棄車
  const cp = proj(-.75, 5.2), s = cp.s;
  g.fillStyle = '#6b2737'; g.beginPath(); g.roundRect(cp.x - s * .7, cp.y - s * .55, s * 1.4, s * .4, 4); g.fill();
  g.beginPath(); g.roundRect(cp.x - s * .4, cp.y - s * .8, s * .8, s * .3, 4); g.fill();
  g.fillStyle = '#1a1a1a'; g.beginPath(); g.arc(cp.x - s * .45, cp.y - s * .13, s * .14, 0, 7); g.arc(cp.x + s * .45, cp.y - s * .13, s * .14, 0, 7); g.fill();
  g.fillStyle = '#9ad1d466'; g.fillRect(cp.x - s * .32, cp.y - s * .74, s * .64, s * .18);
})();
const fg = document.createElement('canvas'); fg.width = W * 2; fg.height = H * 2;
(() => {  // 前景路障
  const g = fg.getContext('2d'); g.scale(2, 2);
  const y0 = 520;
  g.fillStyle = '#5b4636'; g.fillRect(0, y0 + 26, W, H - y0);
  for (let row = 0; row < 3; row++) for (let i = -1; i < 9; i++) {
    const x = i * 52 + (row % 2) * 26, y = y0 + row * 24;
    const bag = g.createLinearGradient(0, y, 0, y + 26); bag.addColorStop(0, '#c2a878'); bag.addColorStop(1, '#8a7350');
    g.fillStyle = bag; g.beginPath(); g.roundRect(x, y, 50, 26, 12); g.fill();
    g.strokeStyle = '#6b5a3c'; g.lineWidth = 1.5; g.beginPath(); g.moveTo(x + 10, y + 13); g.lineTo(x + 40, y + 13); g.stroke();
  }
  g.fillStyle = '#7a5230'; g.save(); g.translate(60, y0 - 14); g.rotate(-.08); g.fillRect(0, 0, 280, 14); g.restore();
  g.strokeStyle = '#999'; g.lineWidth = 1.5; for (let x = 10; x < W; x += 16) { g.beginPath(); g.arc(x, y0 - 4, 6, Math.PI, 0); g.stroke(); }
})();

/* 狀態 */
let zombies = [], fx = [], holes = [], state = 'menu', wave = 1, toSpawn = 0, spawnT = 0, waveBreak = 0;
let score = 0, hearts = 3, ammo = MAG, reload = 0, shots = 0, hitsN = 0, heads = 0, kills = 0, streak = 0;
let aim = null, recoil = 0, shake = 0, hurtT = 0, t = 0, groanT = 3;
let best = 0; try { best = +localStorage.getItem('zombieBest') || 0; } catch (e) {}
function hud() {
  document.getElementById('hWave').textContent = wave;
  document.getElementById('hScore').textContent = score;
  document.getElementById('hearts').textContent = '❤️'.repeat(hearts) + '🖤'.repeat(Math.max(0, 3 - hearts));
  document.getElementById('ammo').innerHTML = reload > 0 ? '<span style="font-size:12px;color:#ffd166">換彈中…</span>' : Array.from({ length: MAG }, (_, i) => `<i class="${i >= ammo ? 'used' : ''}"></i>`).join('');
}
function startGame() {
  zombies = []; fx = []; holes = []; wave = 1; score = 0; hearts = 3; ammo = MAG; reload = 0; shots = hitsN = heads = kills = streak = 0; t = 0;
  state = 'play'; startWave(); document.getElementById('menu').hidden = true; document.getElementById('over').hidden = true; hud();
}
function startWave() { toSpawn = 4 + wave * 3; spawnT = 2.2; waveBreak = 2.2; fx.push({ banner: `第 ${wave} 波`, t: 2.2 }); }
function spawn() {
  const r = Math.random();
  const type = wave >= 3 && r < .18 ? 'fat' : wave >= 2 && r < .45 ? 'runner' : 'normal';
  const sp = { normal: .5, runner: 1.05, fat: .32 }[type] * (1 + (wave - 1) * .08) * (.85 + Math.random() * .3);
  zombies.push({ type, x: (Math.random() * 2 - 1) * 1, z: 13 + Math.random() * 1.5, sp, hp: { normal: 2, runner: 1, fat: 6 }[type], max: { normal: 2, runner: 1, fat: 6 }[type],
    ph: Math.random() * 9, flash: 0, dead: 0, sway: (Math.random() - .5) * .4, col: ['#4d6a8a', '#7a4f3a', '#5c6b3a', '#6d4a6e'][(Math.random() * 4) | 0] });
}
function geom(zb) {   // 螢幕上的部位
  const p = proj(zb.x + Math.sin(zb.ph * .5) * .05, zb.z), h = p.s * (zb.type === 'fat' ? 1.75 : 1.8);
  const bw = h * (zb.type === 'fat' ? .5 : zb.type === 'runner' ? .22 : .3);
  return { x: p.x, y: p.y, h, bw, head: { x: p.x + (zb.type === 'runner' ? h * .06 : 0), y: p.y - h * .86, r: h * .1 } };
}

/* 射擊 */
function fire() {
  if (state !== 'play') return;
  if (reload > 0) { sClick(); return; }
  if (!aim) return;
  ammo--; shots++; sShot(); vib(35); recoil = 1; shake = .5;
  const ax = aim.x + aim.sx, ay = aim.y + aim.sy;
  let hit = null, isHead = false;
  for (const zb of zombies.filter(z => !z.dead).sort((a, b) => a.z - b.z)) {
    const g = geom(zb);
    if (Math.hypot(ax - g.head.x, ay - g.head.y) < g.head.r * 1.15) { hit = zb; isHead = true; break; }
    if (Math.abs(ax - g.x) < g.bw / 2 + 2 && ay > g.y - g.h * .76 && ay < g.y - g.h * .05) { hit = zb; break; }
  }
  if (hit) {
    hitsN++; const g = geom(hit);
    hit.hp -= isHead ? 3 : 1; hit.flash = .15; hit.z += isHead ? .25 : .12;   // 被擊退一點
    sHit(isHead);
    for (let i = 0; i < 10; i++) fx.push({ x: ax, y: ay, vx: (Math.random() - .5) * 120, vy: -Math.random() * 90, t: .7, r: 3 + Math.random() * 5 * (g.h / 100), col: isHead ? '#a7c957' : '#7fb069', smoke: true });
    if (isHead) { heads++; streak++; fx.push({ x: g.head.x, y: g.head.y - 16, t: .9, s: streak > 1 ? `爆頭！×${streak}` : '爆頭！', col: '#ffd166' }); }
    else streak = 0;
    if (hit.hp <= 0) {
      hit.dead = .001; kills++;
      const base = { normal: 100, runner: 150, fat: 300 }[hit.type];
      const gain = Math.round(base * (isHead ? 1.5 : 1) * (1 + Math.min(1, (streak - 1) * .25 * (isHead ? 1 : 0))));
      score += gain; fx.push({ x: g.x, y: g.y - g.h - 6, t: 1, s: '+' + gain, col: '#fff' });
      if (score > best) { best = score; try { localStorage.setItem('zombieBest', best); } catch (e) {} }
    }
  } else {
    streak = 0;
    holes.push({ x: ax, y: ay, t: 6 });
    for (let i = 0; i < 6; i++) fx.push({ x: ax, y: ay, vx: (Math.random() - .5) * 80, vy: -Math.random() * 80, t: .5, r: 2 + Math.random() * 3, col: '#bfb3a5', smoke: true });
  }
  fx.push({ shell: true, x: 330, y: 560, vx: 60 + Math.random() * 40, vy: -220, t: 1.2, rot: 0 });
  if (ammo <= 0) { reload = 1.6; sReload(); }
  hud();
}
const toLocal = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; };
let aimId = null;
cv.addEventListener('pointerdown', e => {
  initAudio(); if (state !== 'play' || aimId !== null) return;
  cv.setPointerCapture(e.pointerId); aimId = e.pointerId;
  const q = toLocal(e); aim = { fx: q.x, fy: q.y, x: q.x, y: Math.max(20, q.y - 120), sx: 0, sy: 0, t0: t };
});
cv.addEventListener('pointermove', e => {
  if (e.pointerId !== aimId || !aim) return;
  const q = toLocal(e); aim.fx = q.x; aim.fy = q.y; aim.x = q.x; aim.y = Math.max(20, q.y - 120);
});
function release(e) { if (e.pointerId !== aimId) return; aimId = null; fire(); aim = null; }
cv.addEventListener('pointerup', release);
cv.addEventListener('pointercancel', e => { if (e.pointerId === aimId) { aimId = null; aim = null; } });

/* 更新 */
function update(dt) {
  t += dt; recoil = Math.max(0, recoil - dt * 6); shake = Math.max(0, shake - dt * 3); hurtT = Math.max(0, hurtT - dt);
  fx.forEach(f => { f.t -= dt; if (f.vx !== undefined) { f.x += f.vx * dt; f.y += f.vy * dt; f.vy += (f.shell ? 900 : 40) * dt; if (f.shell) f.rot += dt * 20; if (f.smoke) f.r += dt * 10; } });
  fx = fx.filter(f => f.t > 0);
  holes.forEach(h => h.t -= dt); holes = holes.filter(h => h.t > 0);
  if (aim) { const k = t - aim.t0; aim.sx = Math.sin(t * 1.7) * 5 + Math.sin(t * 3.1) * 2.5; aim.sy = Math.cos(t * 1.3) * 4 + Math.sin(t * 2.3) * 2; }
  if (state !== 'play') return;
  if (reload > 0) { reload -= dt; if (reload <= 0) { reload = 0; ammo = MAG; hud(); } }
  if (waveBreak > 0) waveBreak -= dt;
  else if (toSpawn > 0) { spawnT -= dt; if (spawnT <= 0) { spawn(); toSpawn--; spawnT = Math.max(.55, 2 - wave * .12) * (.6 + Math.random() * .8); } }
  for (const zb of zombies) {
    zb.ph += dt * (zb.type === 'runner' ? 9 : 4); zb.flash = Math.max(0, zb.flash - dt);
    if (zb.dead) { zb.dead += dt; continue; }
    zb.z -= zb.sp * dt * (zb.flash > 0 ? .2 : 1); zb.x += Math.sin(zb.ph * .3) * .02 * dt + zb.sway * dt * .05;
    zb.x = Math.max(-1.1, Math.min(1.1, zb.x));
    if (zb.z <= BARRIER_Z) {
      zb.dead = -1; hearts--; hurtT = .8; shake = 1; streak = 0; sHurt(); vib([80, 60, 120]); hud();
      if (hearts <= 0) { endGame(); return; }
    }
  }
  zombies = zombies.filter(zb => !(zb.dead > .9 || zb.dead === -1));
  groanT -= dt; if (groanT <= 0 && zombies.length) { sGroan(); groanT = 2 + Math.random() * 3; }
  if (toSpawn === 0 && zombies.length === 0 && waveBreak <= 0) { wave++; score += 200; fx.push({ x: 200, y: 300, t: 1.4, s: '守住了！+200', col: '#a7c957' }); startWave(); hud(); }
}
function endGame() {
  state = 'over'; aim = null; aimId = null;
  document.getElementById('oTitle').textContent = wave >= 8 ? '末日傳說 🏆' : wave >= 5 ? '神射手！🎯' : wave >= 3 ? '撐得不錯 💪' : '被包圍了… 🧟';
  document.getElementById('sScore').textContent = score; document.getElementById('sWave').textContent = '第 ' + wave + ' 波';
  document.getElementById('sKill').textContent = kills + ' 隻'; document.getElementById('sHead').textContent = (hitsN ? Math.round(heads / Math.max(1, kills) * 100) : 0) + '%';
  document.getElementById('sAcc').textContent = (shots ? Math.round(hitsN / shots * 100) : 0) + '%'; document.getElementById('sBest').textContent = best;
  setTimeout(() => document.getElementById('over').hidden = false, 700);
}
document.getElementById('start').onclick = () => { initAudio(); startGame(); };
document.getElementById('again').onclick = () => { initAudio(); startGame(); };

/* 繪圖 */
function drawZombie(zb) {
  const g = geom(zb), h = g.h, x = g.x, y = g.y;
  const d = zb.dead > 0 ? Math.min(1, zb.dead / .6) : 0;
  ctx.save(); ctx.globalAlpha = 1 - Math.max(0, (zb.dead - .5) / .4);
  ctx.translate(x, y); ctx.rotate(-d * 1.2); ctx.translate(-x, -y);
  // 影子
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(x, y, g.bw * .8, h * .04, 0, 0, 7); ctx.fill();
  const skin = zb.flash > 0 ? '#ffffff' : zb.type === 'fat' ? '#8fae5a' : '#93b85f';
  const lean = zb.type === 'runner' ? h * .08 : 0;
  // 腿
  const step = Math.sin(zb.ph) * h * .06;
  ctx.strokeStyle = '#3d3a4b'; ctx.lineWidth = Math.max(1.5, h * (zb.type === 'fat' ? .1 : .07)); ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x - g.bw * .2, y - h * .42); ctx.lineTo(x - g.bw * .2 + step, y); ctx.moveTo(x + g.bw * .2, y - h * .42); ctx.lineTo(x + g.bw * .2 - step, y); ctx.stroke();
  // 身體
  ctx.fillStyle = zb.flash > 0 ? '#fff' : zb.col;
  ctx.beginPath(); ctx.moveTo(x - g.bw / 2, y - h * .42); ctx.lineTo(x - g.bw / 2 + lean * .5, y - h * .76); ctx.lineTo(x + g.bw / 2 + lean, y - h * .76); ctx.lineTo(x + g.bw / 2, y - h * .42);
  for (let i = 0; i < 4; i++) ctx.lineTo(x + g.bw / 2 - g.bw * (i + .5) / 4, y - h * (.4 - (i % 2) * .04));
  ctx.closePath(); ctx.fill();
  // 手臂往前伸
  ctx.strokeStyle = skin; ctx.lineWidth = Math.max(1.5, h * .055);
  const reach = Math.sin(zb.ph * .5) * h * .03;
  ctx.beginPath(); ctx.moveTo(x - g.bw / 2 + lean * .5, y - h * .7); ctx.lineTo(x - g.bw * .3 + lean, y - h * .62 + reach);
  ctx.moveTo(x + g.bw / 2 + lean, y - h * .7); ctx.lineTo(x + g.bw * .35 + lean * 1.3, y - h * .6 - reach); ctx.stroke();
  // 頭
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(g.head.x + lean, g.head.y, g.head.r, 0, 7); ctx.fill();
  if (h > 25) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(g.head.x + lean - g.head.r * .38, g.head.y - g.head.r * .1, g.head.r * .26, 0, 7); ctx.arc(g.head.x + lean + g.head.r * .38, g.head.y - g.head.r * .05, g.head.r * .2, 0, 7); ctx.fill();
    ctx.fillStyle = '#c1121f'; ctx.beginPath(); ctx.arc(g.head.x + lean - g.head.r * .38, g.head.y - g.head.r * .1, g.head.r * .1, 0, 7); ctx.arc(g.head.x + lean + g.head.r * .38, g.head.y - g.head.r * .05, g.head.r * .08, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3d3a4b'; ctx.lineWidth = Math.max(1, g.head.r * .12);
    ctx.beginPath(); ctx.moveTo(g.head.x + lean - g.head.r * .4, g.head.y + g.head.r * .45); for (let i = 1; i <= 4; i++) ctx.lineTo(g.head.x + lean - g.head.r * .4 + i * g.head.r * .2, g.head.y + g.head.r * (i % 2 ? .35 : .5)); ctx.stroke();
    ctx.fillStyle = '#3d3a4b'; ctx.fillRect(g.head.x + lean - g.head.r * .7, g.head.y - g.head.r * .95, g.head.r * .5, g.head.r * .25);
  }
  // 胖子血條
  if (zb.type === 'fat' && !zb.dead && zb.hp < zb.max) {
    ctx.fillStyle = '#0008'; ctx.fillRect(x - h * .2, y - h - 8, h * .4, 4); ctx.fillStyle = '#e63946'; ctx.fillRect(x - h * .2, y - h - 8, h * .4 * zb.hp / zb.max, 4);
  }
  ctx.restore();
}
function drawScene(c) {
  c.drawImage(bg, 0, 0, W, H);
  for (const h of holes) { c.fillStyle = `rgba(20,15,20,${Math.min(.8, h.t)})`; c.beginPath(); c.arc(h.x, h.y, 2, 0, 7); c.fill(); }
  const prev = ctx; // drawZombie 使用 ctx
  zombies.slice().sort((a, b) => b.z - a.z).forEach(drawZombie);
  for (const f of fx) if (f.smoke) { c.globalAlpha = Math.min(1, f.t * 1.5) * .7; c.fillStyle = f.col; c.beginPath(); c.arc(f.x, f.y, f.r, 0, 7); c.fill(); c.globalAlpha = 1; }
}
function draw() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * 10, (Math.random() - .5) * shake * 10);
  drawScene(ctx);
  ctx.drawImage(fg, 0, 0, W, H);
  // 狙擊鏡
  if (aim) {
    const cx = aim.x, cy = aim.y - recoil * 26;
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, SR, 0, 7); ctx.clip();
    ctx.translate(cx, cy); ctx.scale(ZOOM, ZOOM); ctx.translate(-(aim.x + aim.sx), -(aim.y + aim.sy));
    drawScene(ctx); ctx.drawImage(fg, 0, 0, W, H);
    ctx.restore();
    ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, SR, 0, 7); ctx.clip();
    const vg = ctx.createRadialGradient(cx, cy, SR * .6, cx, cy, SR); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.65)');
    ctx.fillStyle = vg; ctx.fillRect(cx - SR, cy - SR, SR * 2, SR * 2);
    ctx.strokeStyle = 'rgba(10,10,10,.9)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx - SR, cy); ctx.lineTo(cx - 8, cy); ctx.moveTo(cx + 8, cy); ctx.lineTo(cx + SR, cy); ctx.moveTo(cx, cy - SR); ctx.lineTo(cx, cy - 8); ctx.moveTo(cx, cy + 8); ctx.lineTo(cx, cy + SR); ctx.stroke();
    ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(cx - SR, cy); ctx.lineTo(cx - SR * .55, cy); ctx.moveTo(cx + SR * .55, cy); ctx.lineTo(cx + SR, cy); ctx.moveTo(cx, cy + SR * .55); ctx.lineTo(cx, cy + SR); ctx.stroke();
    for (let i = 1; i <= 3; i++) { ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(cx - 4, cy + i * 14); ctx.lineTo(cx + 4, cy + i * 14); ctx.stroke(); }
    ctx.fillStyle = reload > 0 ? '#999' : '#e63946'; ctx.beginPath(); ctx.arc(cx, cy, 1.8, 0, 7); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#111'; ctx.lineWidth = 9; ctx.beginPath(); ctx.arc(cx, cy, SR + 3, 0, 7); ctx.stroke();
    ctx.strokeStyle = '#444'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, SR + 7, 0, 7); ctx.stroke();
    if (reload > 0) { ctx.fillStyle = '#ffd166'; ctx.font = '700 13px system-ui'; ctx.textAlign = 'center'; ctx.fillText('換彈中…', cx, cy + SR + 22); }
    // 手指位置提示
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(aim.fx, aim.fy, 16, 0, 7); ctx.fill();
  }
  // 槍口火光
  if (recoil > .7) { ctx.fillStyle = `rgba(255,220,120,${(recoil - .7) * 2})`; ctx.fillRect(0, 0, W, H); }
  for (const f of fx) {
    if (f.shell) { ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot); ctx.fillStyle = '#d4a017'; ctx.fillRect(-3, -7, 6, 14); ctx.restore(); }
    else if (f.banner) { ctx.globalAlpha = Math.min(1, f.t); ctx.fillStyle = '#000a'; ctx.fillRect(0, 250, W, 70); ctx.fillStyle = '#a7c957'; ctx.font = '900 34px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(f.banner, 200, 285); ctx.textBaseline = 'alphabetic'; ctx.globalAlpha = 1; }
    else if (f.s) { ctx.globalAlpha = Math.min(1, f.t * 2); ctx.font = '900 17px system-ui'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#000'; ctx.strokeText(f.s, f.x, f.y - (1 - f.t) * 20); ctx.fillStyle = f.col; ctx.fillText(f.s, f.x, f.y - (1 - f.t) * 20); ctx.globalAlpha = 1; }
  }
  if (hurtT > 0) {
    ctx.fillStyle = `rgba(200,0,0,${hurtT * .45})`; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = `rgba(120,0,0,${hurtT})`; ctx.lineWidth = 5;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(120 + i * 40, 160); ctx.lineTo(160 + i * 40, 340); ctx.stroke(); }
  }
  if (state === 'play' && !aim && t < 6) { ctx.fillStyle = '#fffc'; ctx.font = '700 14px system-ui'; ctx.textAlign = 'center'; ctx.fillText('按住畫面開鏡・拖動瞄準・放開開槍', 200, 505); }
}

let last = performance.now();
function loop(now) { const dt = Math.min(.033, (now - last) / 1000); last = now; update(dt); draw(); requestAnimationFrame(loop); }
hud(); requestAnimationFrame(loop);
window.__zb = { get zombies() { return zombies; }, get state() { return state; }, get score() { return score; }, get hearts() { return hearts; }, get wave() { return wave; }, geom, startGame };
})();
</script>

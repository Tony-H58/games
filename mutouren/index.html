<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>123木頭人</title>
<style>
  html,body{margin:0;height:100%;background:#14301c;color:#fff;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
  #hud{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 2px;font-size:11px}
  #hud b{display:block;font-size:19px;color:#fde047;font-variant-numeric:tabular-nums}
  #tip{text-align:center;font-size:13px;height:18px;color:#fde047}
  #wrap{position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
  canvas{display:block;touch-action:none;border-radius:12px}
  #ctrl{display:flex;gap:10px;padding:8px 12px 14px}
  #ctrl button{flex:1;border:0;border-radius:16px;font-size:22px;font-weight:900;color:#fff;padding:16px 2px;touch-action:none}
  #walk{background:#16a34a;box-shadow:0 5px 0 #14532d}
  #run{background:#ea580c;box-shadow:0 5px 0 #7c2d12}
  #ctrl button small{display:block;font-size:11px;font-weight:500;opacity:.85}
  #ctrl button.on{transform:translateY(4px);box-shadow:0 1px 0 #0006}
  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5}
  .box{background:#173a22f2;border:2px solid #fde047;border-radius:16px;padding:20px;width:min(310px,86%);text-align:center}
  .box h2{margin:0 0 6px;font-size:28px;color:#fde047}
  .box p{font-size:13px;line-height:1.75;margin:6px 0 14px;text-align:left}
  .go{width:100%;background:#dc2626;color:#fff;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:800}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 14px}
  .stats div{background:#0005;border-radius:10px;padding:7px;font-size:11px}
  .stats b{display:block;font-size:19px;color:#fde047}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div>關卡<b id="hLv">1/5</b></div>
    <div>生命<b id="hLife">❤️❤️❤️</b></div>
    <div>距離<b id="hDist">0%</b></div>
    <div style="text-align:right">時間<b id="hTime">60</b></div>
  </div>
  <div id="tip"></div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div class="ov" id="menu"><div class="box">
      <h2>🌳 123木頭人</h2>
      <p>鬼在大樹下背對大家喊「<b>一、二、三、木、頭、人</b>」，喊完就會<b>轉頭</b>看！<br>
      🟢 按住<b>「走」</b>往前走，放開馬上停。<br>
      🟠 按住<b>「衝」</b>跑很快，但放開會<b>滑一下</b>才停住。<br>
      👀 鬼轉頭時你還在動就被抓到，<b>退回去一段</b>、扣一條命。<br>
      ⚠️ 鬼轉頭前頭會先動一下，小心他<b>假動作</b>！<br>
      在時間內摸到鬼就過關，一共 5 關。</p>
      <button class="go" id="start">開始玩</button>
    </div></div>
    <div class="ov" id="mid" hidden><div class="box">
      <h2 id="mTitle"></h2>
      <div class="stats" id="mStats"></div>
      <button class="go" id="next"></button>
    </div></div>
  </div>
  <div id="ctrl">
    <button id="walk">走<small>按住前進</small></button>
    <button id="run">衝<small>很快，但停得慢</small></button>
  </div>
</div>
<script>
(() => {
const $ = id => document.getElementById(id);
const W = 400, H = 640, GOAL = 100, TIME = 60;
const LEVELS = [
  { beat: .42, look: [1.4, 1.8], warn: .42, fake: 0, rush: 0, push: 20 },
  { beat: .36, look: [1.5, 2.1], warn: .36, fake: .15, rush: .2, push: 22 },
  { beat: .32, look: [1.7, 2.4], warn: .32, fake: .25, rush: .3, push: 24 },
  { beat: .28, look: [1.9, 2.7], warn: .28, fake: .35, rush: .4, push: 26 },
  { beat: .24, look: [2.1, 3.0], warn: .24, fake: .45, rush: .5, push: 28 },
];
const SYL = ['一', '二', '三', '木', '頭', '人'];
const cv = $('c'), ctx = cv.getContext('2d');
let scale = 1;
function resize() {
  const wr = $('wrap').getBoundingClientRect();
  const s = Math.min((wr.width - 4) / W, (wr.height - 4) / H), d = window.devicePixelRatio || 1;
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * d); cv.height = Math.round(H * s * d); scale = s * d;
}
addEventListener('resize', resize);

/* 音效 */
let ac = null;
function initAudio() { if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } else if (ac.state === 'suspended') ac.resume(); }
function tone(f, d, type = 'sine', v = .08, f2, delay = 0) { if (!ac) return; const t = ac.currentTime + delay, o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02); }
const NOTES = [523, 587, 659, 698, 784, 880];
const sSyl = i => { tone(NOTES[i], .18, 'triangle', .1); tone(NOTES[i] * 2, .1, 'sine', .03); };
const sTurn = () => tone(300, .25, 'square', .05, 900);
const sCaught = () => { tone(880, .12, 'square', .08); tone(660, .12, 'square', .08, null, .13); tone(440, .3, 'square', .08, null, .26); };
const sStep = () => tone(120 + Math.random() * 40, .05, 'sine', .05);
const sWin = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'sine', .08, null, i * .1));
const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* 狀態 */
let state = 'menu', level = 0, Lv = LEVELS[0], t = 0, lives = 3, caughtTotal = 0, totalTime = 0, fx = [], confetti = [];
let best = 0; try { best = +localStorage.getItem('mtrBest') || 0; } catch (e) {}
const me = { d: 0, v: 0, lane: 0, bob: 0, freeze: 0, col: '#dc2626', name: '你' };
let kids = [];
const ghost = { phase: 'chant', tm: 0, syl: -1, beats: [], look: 0, twitch: 0, turn: 0, fakeAt: -1 };
let hold = null;   // 'walk' | 'run' | null
function setTip(s) { $('tip').textContent = s; }
function hud() {
  $('hLv').textContent = `${level + 1}/5`; $('hLife').textContent = '❤️'.repeat(lives) + '🤍'.repeat(3 - lives);
  $('hDist').textContent = Math.min(100, Math.floor(me.d)) + '%'; $('hTime').textContent = Math.max(0, Math.ceil(TIME - t));
}
function newChant() {
  ghost.phase = 'chant'; ghost.tm = 0; ghost.syl = -1; ghost.turn = 0;
  const b = Lv.beat * (.85 + Math.random() * .4), beats = [];
  const rush = Math.random() < Lv.rush, slowStart = Math.random() < .3;
  for (let i = 0; i < 6; i++) {
    let d = b;
    if (slowStart && i < 3) d *= 1.6;
    if (rush && i >= 3) d *= .45;
    beats.push(d);
  }
  ghost.beats = beats;
  ghost.fakeAt = Math.random() < Lv.fake ? 1 + ((Math.random() * 3) | 0) : -1;
  for (const k of kids) { k.spd = 7 + Math.random() * 4 + k.greed * 6; k.scared = Math.random() < .6; k.stopAt = Math.random() < k.greed * .35 ? Lv.warn + .15 + Math.random() * .2 : Math.random() * Lv.warn * .7; }
}
function startLevel(n) {
  level = n; Lv = LEVELS[n]; t = 0; me.d = 0; me.v = 0; me.freeze = 0; fx = []; confetti = []; hold = null; syncBtns();
  kids = [
    { name: '小明', col: '#2563eb', lane: -2, d: 0, v: 0, react: .1 + Math.random() * .25 + n * .02, greed: .15 + n * .03, out: false, done: false, bob: 0 },
    { name: '阿美', col: '#db2777', lane: -1, d: 0, v: 0, react: .1 + Math.random() * .25, greed: .1 + n * .03, out: false, done: false, bob: 1 },
    { name: '胖虎', col: '#ca8a04', lane: 1, d: 0, v: 0, react: .2 + Math.random() * .25, greed: .25 + n * .04, out: false, done: false, bob: 2 },
  ];
  me.lane = 0.0;
  ghost.twitch = 0; newChant(); ghost.tm = -1;   // 開場等一秒
  state = 'play'; $('menu').hidden = true; $('mid').hidden = true;
  setTip(`第 ${n + 1} 關：鬼喊口令時往前走，喊完就停！`); hud();
}
function startGame() { lives = 3; caughtTotal = 0; totalTime = 0; startLevel(0); }

/* 操作 */
function syncBtns() { $('walk').classList.toggle('on', hold === 'walk'); $('run').classList.toggle('on', hold === 'run'); }
for (const id of ['walk', 'run']) {
  const b = $(id);
  b.addEventListener('pointerdown', e => { initAudio(); try { b.setPointerCapture(e.pointerId); } catch (er) {} hold = id; syncBtns(); });
  const up = () => { if (hold === id) hold = null; syncBtns(); };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('lostpointercapture', up);
}
cv.addEventListener('pointerdown', e => { initAudio(); try { cv.setPointerCapture(e.pointerId); } catch (er) {} if (state === 'play') { hold = 'walk'; syncBtns(); } });
const cup = () => { if (hold) { hold = null; syncBtns(); } };
cv.addEventListener('pointerup', cup); cv.addEventListener('pointercancel', cup);
addEventListener('keydown', e => { if (e.repeat) return; if (e.code === 'Space') { hold = 'walk'; syncBtns(); } if (e.code === 'ShiftLeft' || e.code === 'ArrowUp') { hold = 'run'; syncBtns(); } });
addEventListener('keyup', () => { hold = null; syncBtns(); });

/* 抓人 */
function catchMe() {
  lives--; caughtTotal++; me.freeze = 1.1; me.v = 0;
  const back = Lv.push; me.d = Math.max(0, me.d - back);
  sCaught(); vib([80, 50, 120]);
  fx.push({ s: '抓到了！你在動！', x: 200, y: 330, t: 1.4, col: '#fca5a5', big: 1 });
  setTip(`被抓到了，退回 ${back}%`);
  if (lives <= 0) { hud(); setTimeout(() => gameOver('生命用完了'), 900); state = 'wait'; }
  hud();
}
function gameOver(why) {
  state = 'over';
  $('mTitle').textContent = '😵 遊戲結束';
  $('mStats').innerHTML = `<div>原因<b style="font-size:14px">${why}</b></div><div>到達關卡<b>第 ${level + 1} 關</b></div><div>被抓次數<b>${caughtTotal}</b></div><div>最佳紀錄<b>${best ? best + ' 關' : '—'}</b></div>`;
  $('next').textContent = '重新開始'; $('next').onclick = () => { initAudio(); startGame(); };
  $('mid').hidden = false;
}
function clearLevel() {
  state = 'clear'; totalTime += t; sWin(); vib(60);
  for (let i = 0; i < 80; i++) confetti.push({ x: 200, y: 200, vx: (Math.random() - .5) * 380, vy: -Math.random() * 380 - 80, c: `hsl(${Math.random() * 360},90%,60%)`, t: 2.2 });
  const rank = 1 + kids.filter(k => k.done).length;
  if (level + 1 > best) { best = level + 1; try { localStorage.setItem('mtrBest', best); } catch (e) {} }
  setTimeout(() => {
    if (level === 4) {
      let bt = 0; try { bt = +localStorage.getItem('mtrTime') || 0; } catch (e) {}
      const newRec = !bt || totalTime < bt; if (newRec) { try { localStorage.setItem('mtrTime', totalTime.toFixed(1)); } catch (e) {} }
      $('mTitle').textContent = '🏆 全部過關！';
      $('mStats').innerHTML = `<div>總時間<b>${totalTime.toFixed(1)} 秒</b></div><div>被抓次數<b>${caughtTotal}</b></div><div>剩餘生命<b>${'❤️'.repeat(lives)}</b></div><div>最快紀錄<b>${newRec ? totalTime.toFixed(1) : (+bt).toFixed(1)} 秒${newRec ? ' 🆕' : ''}</b></div>`;
      $('next').textContent = '再玩一次'; $('next').onclick = () => { initAudio(); startGame(); };
    } else {
      $('mTitle').textContent = `🎉 第 ${level + 1} 關過關！`;
      $('mStats').innerHTML = `<div>用時<b>${t.toFixed(1)} 秒</b></div><div>名次<b>第 ${rank} 名</b></div><div>被抓次數<b>${caughtTotal}</b></div><div>剩餘生命<b>${'❤️'.repeat(lives) || '—'}</b></div>`;
      $('next').textContent = `下一關（第 ${level + 2} 關）`; $('next').onclick = () => { initAudio(); startLevel(level + 1); };
    }
    $('mid').hidden = false;
  }, 1300);
}
$('start').onclick = () => { initAudio(); startGame(); };

/* 更新 */
function moving(v) { return v > .7; }
function update(dt) {
  fx.forEach(f => f.t -= dt); fx = fx.filter(f => f.t > 0);
  confetti.forEach(c => { c.t -= dt; c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 420 * dt; }); confetti = confetti.filter(c => c.t > 0);
  if (state !== 'play') return;
  t += dt;
  if (t >= TIME) { gameOver('時間到，沒摸到鬼'); return; }
  // 鬼
  const g = ghost; g.tm += dt; g.twitch = Math.max(0, g.twitch - dt);
  if (g.phase === 'chant') {
    let acc = 0, idx = -1;
    for (let i = 0; i < 6; i++) { acc += g.beats[i]; if (g.tm >= acc - g.beats[i] && g.tm >= 0) idx = i; }
    if (g.tm >= 0 && idx !== g.syl && idx >= 0 && idx < 6) {
      g.syl = idx; sSyl(idx);
      if (idx === g.fakeAt) { g.twitch = .3; }
    }
    if (g.tm >= acc) { g.phase = 'warn'; g.tm = 0; }
  } else if (g.phase === 'warn') {
    g.turn = Math.min(1, g.tm / Lv.warn);
    if (g.tm >= Lv.warn) { g.phase = 'look'; g.tm = 0; g.turn = 1; g.look = Lv.look[0] + Math.random() * (Lv.look[1] - Lv.look[0]); sTurn(); }
  } else if (g.phase === 'look') {
    if (g.tm > .08) {
      if (moving(me.v) && me.freeze <= 0) catchMe();
      for (const k of kids) if (!k.out && !k.done && moving(k.v)) { k.out = true; fx.push({ s: `${k.name} 出局！`, x: laneX(k.lane, k.d), y: posY(k.d) - 70 * sc(k.d), t: 1.3, col: '#fdba74' }); }
    }
    if (g.tm >= g.look) { g.phase = 'back'; g.tm = 0; }
  } else if (g.phase === 'back') {
    g.turn = Math.max(0, 1 - g.tm / .3);
    if (g.tm >= .3) newChant();
  }
  // 玩家
  me.freeze = Math.max(0, me.freeze - dt);
  const target = me.freeze > 0 || state !== 'play' ? 0 : hold === 'run' ? 15 : hold === 'walk' ? 6.5 : 0;
  const accel = target > me.v ? 40 : (me.v > 8 ? 26 : 70);   // 衝刺放開會滑一下
  me.v = target > me.v ? Math.min(target, me.v + accel * dt) : Math.max(target, me.v - accel * dt);
  const pb = me.bob; me.d += me.v * dt; me.bob += me.v * dt * 1.4;
  if (Math.floor(pb) !== Math.floor(me.bob)) sStep();
  // 電腦小朋友
  for (const k of kids) {
    if (k.out || k.done) continue;
    let want = 0;
    if (g.phase === 'chant' && g.tm >= 0) want = (g.twitch > 0 && k.scared) ? 0 : k.spd;
    else if (g.phase === 'warn' && g.tm < k.stopAt) want = k.spd;
    else if (g.phase === 'look' && g.tm < k.stopAt - Lv.warn) want = k.spd * .5;   // 太貪心，停太慢
    k.v = want > k.v ? Math.min(want, k.v + 30 * dt) : Math.max(want, k.v - 60 * dt);
    k.d += k.v * dt; k.bob += k.v * dt * 1.4;
    if (k.d >= GOAL) { k.done = true; k.d = GOAL; fx.push({ s: `${k.name} 摸到鬼了！`, x: 200, y: 250, t: 1.5, col: '#93c5fd' }); }
  }
  if (me.d >= GOAL) { me.d = GOAL; me.v = 0; fx.push({ s: '摸到了！過關！', x: 200, y: 260, t: 2, col: '#fde047', big: 1 }); clearLevel(); }
  if (g.phase === 'look' && !moving(me.v)) setTip('👀 鬼在看…不要動！');
  else if (g.phase === 'chant' && g.tm >= 0) setTip('快走！');
  hud();
}

/* 透視 */
const posY = d => 600 - 372 * (1 - Math.pow(1 - Math.min(1, d / GOAL), 1.5));
const sc = d => 1 - .6 * Math.min(1, d / GOAL);
const laneX = (lane, d) => 200 + lane * 62 * sc(d) * (1 - Math.min(1, d / GOAL) * .55);

/* 繪圖 */
function drawKid(x, y, s, col, bob, opts = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
  const sw = Math.sin(bob * Math.PI) * (opts.still ? 0 : 1);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 2, 22, 7, 0, 0, 7); ctx.fill();
  // 腿
  ctx.strokeStyle = '#1e3a8a'; ctx.lineWidth = 9; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-7, -30); ctx.lineTo(-7 + sw * 4, -2 - Math.max(0, sw) * 5); ctx.moveTo(7, -30); ctx.lineTo(7 - sw * 4, -2 - Math.max(0, -sw) * 5); ctx.stroke();
  // 身體（背面）
  ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(-16, -66, 32, 40, 10); ctx.fill();
  // 手
  ctx.strokeStyle = col; ctx.lineWidth = 8;
  if (opts.caught) { ctx.beginPath(); ctx.moveTo(-14, -60); ctx.lineTo(-24, -84); ctx.moveTo(14, -60); ctx.lineTo(24, -84); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(-15, -60); ctx.lineTo(-20 - sw * 3, -36); ctx.moveTo(15, -60); ctx.lineTo(20 + sw * 3, -36); ctx.stroke(); }
  ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(-20 - (opts.caught ? 4 : sw * 3), opts.caught ? -86 : -34, 4.5, 0, 7); ctx.arc(20 + (opts.caught ? 4 : sw * 3), opts.caught ? -86 : -34, 4.5, 0, 7); ctx.fill();
  // 頭（後腦勺）
  ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(-15, -80, 4, 0, 7); ctx.arc(15, -80, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#1f1308'; ctx.beginPath(); ctx.arc(0, -82, 15, 0, 7); ctx.fill();
  ctx.restore();
}
function drawGhost() {
  const g = ghost, x = 200, y = 215, s = 1.05, turn = g.turn, tw = g.twitch > 0 ? Math.sin(g.twitch * 40) * .25 + .25 : 0;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 2, 24, 7, 0, 0, 7); ctx.fill();
  ctx.strokeStyle = '#374151'; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-7, -30); ctx.lineTo(-7, -2); ctx.moveTo(7, -30); ctx.lineTo(7, -2); ctx.stroke();
  ctx.fillStyle = '#7c3aed'; ctx.beginPath(); ctx.roundRect(-17, -68, 34, 42, 10); ctx.fill();
  const facing = turn > .55;
  // 手：背對時遮眼趴在樹上
  ctx.strokeStyle = '#7c3aed'; ctx.lineWidth = 8;
  if (!facing) { ctx.beginPath(); ctx.moveTo(-15, -62); ctx.lineTo(-12, -86); ctx.moveTo(15, -62); ctx.lineTo(12, -86); ctx.stroke(); }
  else { ctx.beginPath(); ctx.moveTo(-15, -62); ctx.lineTo(-22, -38); ctx.moveTo(15, -62); ctx.lineTo(22, -38); ctx.stroke(); }
  // 頭：用 turn 決定朝向（側臉 → 正臉）
  const hx = (tw + (turn > 0 && turn < 1 ? Math.sin(turn * Math.PI) * 6 : 0));
  ctx.fillStyle = '#f1c27d'; ctx.beginPath(); ctx.arc(hx, -86, 16, 0, 7); ctx.fill();
  if (!facing) {
    ctx.fillStyle = '#1f1308'; ctx.beginPath(); ctx.arc(hx - turn * 10 + tw * 8, -88, 16, 0, 7); ctx.fill();
    if (turn > .1 || tw > 0) { ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(hx + 10, -88, 2, 0, 7); ctx.fill(); }
  } else {
    ctx.fillStyle = '#1f1308'; ctx.beginPath(); ctx.arc(hx, -94, 16, Math.PI, 0); ctx.fill();
    // 眼睛：看人時變大
    const look = g.phase === 'look';
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(hx - 6, -86, 4.5, look ? 5.5 : 4, 0, 0, 7); ctx.ellipse(hx + 6, -86, 4.5, look ? 5.5 : 4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#111'; const px = Math.sin(t * 2.3) * 1.5; ctx.beginPath(); ctx.arc(hx - 6 + px, -85, 2.4, 0, 7); ctx.arc(hx + 6 + px, -85, 2.4, 0, 7); ctx.fill();
    ctx.strokeStyle = '#7c2d12'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(hx, -76, 4, .2, Math.PI - .2); ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = '#fff'; ctx.font = '700 11px system-ui'; ctx.textAlign = 'center'; ctx.fillText('鬼', x, y + 14);

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>殭屍怪獸迷宮</title>
<style>
  html,body{margin:0;height:100%;background:#0d0b10;color:#fff;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
  #app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
  #hud{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;padding:8px 10px 4px;font-size:11px;color:#cfc6d8;align-items:end}
  #hud b{display:block;font-size:16px;color:#ffd166;line-height:1.15}
  #hpbar{height:12px;background:#3a1d24;border-radius:6px;overflow:hidden;margin-top:3px;border:1px solid #5b2a33}
  #hpfill{height:100%;background:linear-gradient(#ff6b6b,#c0392b);width:100%;transition:width .15s}
  #wrap{position:relative;flex:1;min-height:0;display:flex;justify-content:center;align-items:center}
  canvas{display:block;touch-action:none;border-radius:10px}
  #ctrl{display:flex;justify-content:space-between;align-items:center;padding:6px 16px 14px;gap:10px}
  #joy{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#ffffff14,#ffffff08);border:2px solid #ffffff22;position:relative;touch-action:none;flex:none}
  #knob{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8a7aa8,#4a3d63);position:absolute;left:34px;top:34px;box-shadow:0 3px 8px #0008}
  .btns{display:flex;gap:12px;align-items:center}
  .btns button{border:0;border-radius:50%;color:#fff;font-weight:900;touch-action:none;position:relative}
  #bAtk{width:96px;height:96px;font-size:15px;background:radial-gradient(circle at 35% 30%,#e0574a,#8e1f17);box-shadow:0 5px 0 #4d0f0b}
  #bSk{width:68px;height:68px;font-size:12px;background:radial-gradient(circle at 35% 30%,#f2a33a,#9a5310);box-shadow:0 4px 0 #4f2a07}
  .btns button span{display:block;font-size:30px;line-height:1}
  #bSk span{font-size:22px}
  .btns button.on{transform:translateY(3px);box-shadow:none}
  #skCd{position:absolute;inset:0;border-radius:50%;background:#000a;display:flex;align-items:center;justify-content:center;font-size:20px}
  .ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;background:#0008}
  .box{background:#1d1626f5;border:2px solid #7d5ca8;border-radius:16px;padding:16px;width:min(340px,92%);text-align:center;max-height:94%;overflow:auto}
  .box h2{margin:0 0 6px;font-size:26px;color:#ffd166}
  .box p{font-size:13px;line-height:1.75;margin:6px 0 10px;text-align:left}
  .go{width:100%;background:#7b3fc4;color:#fff;border:0;border-radius:12px;padding:13px;font-size:17px;font-weight:800;margin-top:8px}
  .shop{display:grid;gap:8px;margin:8px 0}
  .shop button{display:flex;justify-content:space-between;align-items:center;background:#2c2238;border:1px solid #5d4680;color:#fff;border-radius:12px;padding:12px;font-size:14px;min-height:48px}
  .shop button:disabled{opacity:.4}
  .shop button b{color:#ffd166}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
  .stats div{background:#0006;border-radius:10px;padding:7px;font-size:11px}
  .stats b{display:block;font-size:18px;color:#ffd166}
  [hidden]{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div>❤️ <span id="hHpT">100/100</span><div id="hpbar"><div id="hpfill"></div></div></div>
    <div>關卡<b id="hLv">1</b></div>
    <div>💰 金幣<b id="hGold">0</b></div>
    <div>🗝️ 鑰匙<b id="hKey">✖</b></div>
  </div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div class="ov" id="menu"><div class="box">
      <h2>🧟 殭屍怪獸迷宮</h2>
      <p>🕹️ 左下<b>搖桿</b>移動（電腦用方向鍵 / WASD）<br>
      ⚔️ <b>攻擊</b>：揮劍砍附近的怪（J 或空白鍵）<br>
      🔥 <b>技能</b>：放出一圈火焰，冷卻 8 秒（K 鍵）<br>
      📦 碰到<b>寶箱</b>就會打開：金幣、藥水、武器…<br>
      🗝️ <b>金色寶箱</b>裡有鑰匙，拿到才能打開<b>出口大門</b>！<br>
      👹 第 5、10 關有<b>魔王</b>，共 10 關，加油！</p>
      <div style="font-size:12px;color:#cfc6d8">最高紀錄：第 <b id="bestLv" style="color:#ffd166">0</b> 關・<b id="bestSc" style="color:#ffd166">0</b> 分</div>
      <button class="go" id="start">進入迷宮</button>
    </div></div>
    <div class="ov" id="shopOv" hidden><div class="box">
      <h2 id="sTitle">🎉 第 1 關過關！</h2>
      <div style="font-size:13px">💰 金幣：<b id="sGold" style="color:#ffd166">0</b></div>
      <div class="shop">
        <button id="buyHp"><span>❤️ 血量上限 +25</span><b>30 金幣</b></button>
        <button id="buyAtk"><span>⚔️ 攻擊力 +5</span><b>40 金幣</b></button>
        <button id="buyHeal"><span>🧪 補滿血</span><b>20 金幣</b></button>
        <button id="buySk"><span>🔥 技能冷卻 -1 秒</span><b>50 金幣</b></button>
      </div>
      <button class="go" id="next">前往下一關</button>
    </div></div>
    <div class="ov" id="over" hidden><div class="box">
      <h2 id="oTitle"></h2>
      <div id="oMsg" style="font-size:13px"></div>
      <div class="stats" id="oStats"></div>
      <button class="go" id="again">再玩一次</button>
    </div></div>
  </div>
  <div id="ctrl">
    <div id="joy"><div id="knob"></div></div>
    <div class="btns">
      <button id="bSk"><span>🔥</span>技能<div id="skCd" hidden></div></button>
      <button id="bAtk"><span>⚔️</span>攻擊</button>
    </div>
  </div>
</div>
<script>
const W = 400, H = 560, T = 40;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let SC = 1;
function fit() {
  const wr = document.getElementById('wrap'), dpr = Math.min(3, window.devicePixelRatio || 1);
  const s = Math.min(wr.clientWidth / W, wr.clientHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
  cv.width = Math.round(W * s * dpr); cv.height = Math.round(H * s * dpr); SC = s * dpr;
  dark.width = cv.width; dark.height = cv.height;
}
const dark = document.createElement('canvas'), dg = dark.getContext('2d');
window.addEventListener('resize', fit); fit();
const rnd = (a, b) => a + Math.random() * (b - a), ri = (a, b) => Math.floor(rnd(a, b + 1)), clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, k) => a + (b - a) * k;
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ===== 音效 ===== */
let AC = null;
function initAudio() { try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch (e) {} }
function tone(f, d, v = .1, type = 'square', f2) { if (!AC) return; try { const o = AC.createOscillator(), g = AC.createGain(); o.type = type; o.frequency.setValueAtTime(f, AC.currentTime);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, AC.currentTime + d);
  g.gain.setValueAtTime(v, AC.currentTime); g.gain.exponentialRampToValueAtTime(.001, AC.currentTime + d); o.connect(g); g.connect(AC.destination); o.start(); o.stop(AC.currentTime + d); } catch (e) {} }
function noise(d, f0, f1, v) { if (!AC) return; try { const n = AC.createBuffer(1, AC.sampleRate * d, AC.sampleRate), a = n.getChannelData(0);
  for (let i = 0; i < a.length; i++) a[i] = (Math.random() * 2 - 1) * (1 - i / a.length);
  const s = AC.createBufferSource(); s.buffer = n; const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(f0, AC.currentTime); f.frequency.exponentialRampToValueAtTime(f1, AC.currentTime + d);
  const g = AC.createGain(); g.gain.value = v; s.connect(f); f.connect(g); g.connect(AC.destination); s.start(); } catch (e) {} }
const sfx = {
  swing: () => noise(.15, 2500, 600, .25), hit: () => { noise(.1, 900, 200, .4); tone(140, .08, .08, 'square', 70); },
  hurt: () => tone(220, .25, .12, 'sawtooth', 90), chest: () => { tone(660, .1); setTimeout(() => tone(880, .1), 90); setTimeout(() => tone(1320, .18), 180); },
  key: () => { tone(988, .1, .1, 'triangle'); setTimeout(() => tone(1319, .25, .1, 'triangle'), 100); }, fire: () => noise(.6, 300, 1500, .35),
  door: () => { tone(330, .15); setTimeout(() => tone(440, .15), 120); setTimeout(() => tone(660, .3), 240); }, die: () => tone(300, .5, .1, 'sawtooth', 60),
  arrow: () => noise(.12, 3000, 1200, .15), groan: () => tone(rnd(90, 130), .4, .05, 'sawtooth', 60), slam: () => { noise(.4, 200, 60, .6); tone(60, .4, .15, 'sine', 30); } };
const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ===== 地圖產生：迷宮＋房間＋環路 ===== */
let map, MW, MH, chests, door, torches, decor, seen;
function genLevel(lv) {
  const cw = Math.min(5 + lv, 13), ch = Math.min(6 + lv, 15);
  MW = cw * 2 + 1; MH = ch * 2 + 1;
  map = Array.from({ length: MH }, () => new Array(MW).fill(1));
  const vis = Array.from({ length: ch }, () => new Array(cw).fill(false)), st = [[0, 0]]; vis[0][0] = true; map[1][1] = 0;
  while (st.length) {
    const [cx, cy] = st[st.length - 1], nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [cx + dx, cy + dy, dx, dy]).filter(([x, y]) => x >= 0 && y >= 0 && x < cw && y < ch && !vis[y][x]);
    if (!nb.length) { st.pop(); continue; }
    const [nx, ny, dx, dy] = pick(nb); vis[ny][nx] = true; map[cy * 2 + 1 + dy][cx * 2 + 1 + dx] = 0; map[ny * 2 + 1][nx * 2 + 1] = 0; st.push([nx, ny]);
  }
  // 打通部分死路，形成環路（比較好閃怪）
  for (let y = 1; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++) if (map[y][x] === 1 && ((x % 2 === 0 && y % 2 === 1) || (x % 2 === 1 && y % 2 === 0)) && Math.random() < .1) map[y][x] = 0;
  // 房間
  const rooms = [];
  for (let i = 0; i < 2 + Math.floor(lv / 2); i++) {
    const rw = pick([3, 5]), rh = pick([3, 5]), rx = ri(0, (MW - rw - 2) / 2) * 2 + 1, ry = ri(0, (MH - rh - 2) / 2) * 2 + 1;
    for (let y = ry; y < ry + rh; y++) for (let x = rx; x < rx + rw; x++) map[y][x] = 0; rooms.push([rx, ry, rw, rh]);
  }
  map[1][1] = 0;
  const dS = bfs(1, 1), cells = [];
  for (let y = 1; y < MH; y += 2) for (let x = 1; x < MW; x += 2) if (map[y][x] === 0 && dS[y][x] >= 0) cells.push([x, y]);
  // 出口：離起點最遠
  let ex = cells.reduce((a, b) => dS[b[1]][b[0]] > dS[a[1]][a[0]] ? b : a);
  door = { x: ex[0], y: ex[1], open: false };
  const dE = bfs(ex[0], ex[1]);
  const deg = (x, y) => [[1, 0], [-1, 0], [0, 1], [0, -1]].filter(([dx, dy]) => map[y + dy][x + dx] === 0).length;
  const deads = cells.filter(([x, y]) => deg(x, y) === 1 && !(x === 1 && y === 1) && !(x === ex[0] && y === ex[1]));
  // 金鑰寶箱：離起點和出口都遠
  const pool = deads.length > 3 ? deads : cells.filter(([x, y]) => !(x === 1 && y === 1) && !(x === ex[0] && y === ex[1]));
  const kc = pool.reduce((a, b) => Math.min(dS[b[1]][b[0]], dE[b[1]][b[0]]) > Math.min(dS[a[1]][a[0]], dE[a[1]][a[0]]) ? b : a);
  chests = [{ x: kc[0], y: kc[1], key: true, open: false }];
  const used = new Set([kc + '', ex + '', '1,1']);
  const rest = pool.filter(c => !used.has(c + '')).sort(() => Math.random() - .5);
  for (const c of rest.slice(0, 3 + Math.floor(lv / 2))) { chests.push({ x: c[0], y: c[1], key: false, open: false }); used.add(c + ''); }
  // 牆上火把、地上裝飾
  torches = []; decor = [];
  for (let y = 1; y < MH - 1; y++) for (let x = 1; x < MW - 1; x++) {
    if (map[y][x] === 1 && map[y + 1] && map[y + 1][x] === 0 && Math.random() < .07) torches.push({ x, y, ph: rnd(0, 6) });
    if (map[y][x] === 0 && Math.random() < .06) decor.push({ x, y, k: pick(['bone', 'skull', 'crack', 'blood', 'web']), ox: rnd(8, 32), oy: rnd(8, 32), r: rnd(0, 6) });
  }
  seen = Array.from({ length: MH }, () => new Array(MW).fill(false));
  return { dS, cells, used, rooms };
}
function bfs(sx, sy, maxD = 999) {
  const d = Array.from({ length: MH }, () => new Array(MW).fill(-1)), q = [[sx, sy]]; d[sy][sx] = 0;
  for (let i = 0; i < q.length; i++) { const [x, y] = q[i]; if (d[y][x] >= maxD) continue;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy;
      if (nx >= 0 && ny >= 0 && nx < MW && ny < MH && map[ny][nx] !== 1 && d[ny][nx] < 0) { d[ny][nx] = d[y][x] + 1; q.push([nx, ny]); } } }
  return d;
}
const solid = (px, py) => { const x = Math.floor(px / T), y = Math.floor(py / T); return x < 0 || y < 0 || x >= MW || y >= MH || map[y][x] === 1 || (map[y][x] === 2 && !door.open); };
function hitWall(x, y, r) { return solid(x - r, y - r) || solid(x + r, y - r) || solid(x - r, y + r) || solid(x + r, y + r); }
function moveBody(o, dx, dy) { if (!hitWall(o.x + dx, o.y, o.r)) o.x += dx; if (!hitWall(o.x, o.y + dy, o.r)) o.y += dy; }
function los(x0, y0, x1, y1) { const d = Math.hypot(x1 - x0, y1 - y0), n = Math.ceil(d / 10); for (let i = 1; i < n; i++) { const k = i / n; if (solid(lerp(x0, x1, k), lerp(y0, y1, k))) return false; } return true; }

/* ===== 遊戲狀態 ===== */
let state = 'menu', lv = 0, t = 0, pl, mons = [], shots = [], fx = [], texts = [], flow = null, flowT = 0, shake = 0;
let gold = 0, kills = 0, score = 0, hasKey = false, chestsOpened = 0;
let best = { lv: 0, sc: 0 }; try { best = JSON.parse(localStorage.getItem('zmBest')) || best; } catch (e) {}
document.getElementById('bestLv').textContent = best.lv; document.getElementById('bestSc').textContent = best.sc;
const MT = { // 怪物種類
  zombie: { hp: 34, spd: 46, dmg: 9, r: 13, pts: 10, gold: [2, 5] },
  bat: { hp: 14, spd: 105, dmg: 5, r: 10, pts: 8, gold: [1, 3] },
  skel: { hp: 24, spd: 55, dmg: 8, r: 12, pts: 15, gold: [3, 6] },
  boss: { hp: 420, spd: 40, dmg: 18, r: 26, pts: 300, gold: [60, 60] } };
function newPlayer() { return { x: T * 1.5, y: T * 1.5, r: 12, hp: 100, maxHp: 100, atk: 14, wpn: 0, face: 0, swing: 0, atkCd: 0, inv: 0, skCd: 0, skMax: 8, walk: 0, moving: false }; }
function spawnMon(type, x, y) {
  const m = MT[type], k = 1 + lv * .12;
  mons.push({ type, x, y, r: m.r, hp: Math.round(m.hp * k), maxHp: Math.round(m.hp * k), spd: m.spd * (1 + lv * .025), dmg: Math.round(m.dmg * (1 + lv * .08)),
    cd: rnd(0, 1), hit: 0, kx: 0, ky: 0, ph: rnd(0, 6), aggro: false, slam: null, summon: 6, face: 1 });
}
function startLevel(l) {
  lv = l; t = 0; mons = []; shots = []; fx = []; texts = []; hasKey = false; flow = null;
  const g = genLevel(lv);
  pl.x = T * 1.5; pl.y = T * 1.5; pl.inv = 1; pl.skCd = 0;
  // 怪物：離起點至少 6 格
  const far = g.cells.filter(([x, y]) => g.dS[y][x] >= 6 && !g.used.has(x + ',' + y)).sort(() => Math.random() - .5);
  const n = 4 + lv * 2;
  for (let i = 0; i < n && i < far.length; i++) {
    const [x, y] = far[i], r = Math.random();
    const type = lv >= 2 && r < .28 ? 'skel' : lv >= 1 && r < .55 ? 'bat' : 'zombie';
    spawnMon(type, (x + .5) * T, (y + .5) * T);
  }
  // 金鑰寶箱旁邊的守衛
  const kc = chests[0]; spawnMon('zombie', (kc.x + .5) * T + rnd(-6, 6), (kc.y + .5) * T + rnd(-6, 6));
  if (lv === 4 || lv === 9) {   // 魔王守在出口前
    const nb = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [door.x + dx, door.y + dy]).find(([x, y]) => map[y] && map[y][x] === 0) || [door.x, door.y];
    spawnMon('boss', (nb[0] + .5) * T, (nb[1] + .5) * T); const b = mons[mons.length - 1]; b.hp = b.maxHp = lv === 9 ? 900 : 480; b.aggro = false; }
  map[door.y][door.x] = 2; door.open = false;
  state = 'play'; hud(); pop(lv === 4 || lv === 9 ? `第 ${lv + 1} 關・魔王在出口！` : `第 ${lv + 1} 關`, W / 2, H / 2 - 60, '#ffd166', 24, true);
}
function startGame() {
  initAudio(); pl = newPlayer(); gold = 0; kills = 0; score = 0; chestsOpened = 0;
  ['menu', 'over', 'shopOv'].forEach(i => document.getElementById(i).hidden = true); startLevel(0);
}
function hud() {
  document.getElementById('hHpT').textContent = `${Math.max(0, Math.ceil(pl.hp))}/${pl.maxHp}`;
  document.getElementById('hpfill').style.width = clamp(pl.hp / pl.maxHp * 100, 0, 100) + '%';
  document.getElementById('hLv').textContent = `${lv + 1} / 10`;
  document.getElementById('hGold').textContent = gold;
  document.getElementById('hKey').textContent = hasKey ? '✔️' : '✖';
}
function pop(s, x, y, col = '#fff', size = 16, screen = false) { texts.push({ s, x, y, t: screen ? 2 : 1, col, size, screen }); }

/* ===== 輸入 ===== */
const inp = { x: 0, y: 0, atk: false, sk: false };
const joy = document.getElementById('joy'), knob = document.getElementById('knob'); let joyId = null;
function joyMove(e) { const r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy), mx = r.width / 2 - 10; if (d > mx) { dx *= mx / d; dy *= mx / d; }
  knob.style.transform = `translate(${dx}px,${dy}px)`; const k = Math.hypot(dx, dy) / mx; inp.x = k > .15 ? dx / mx : 0; inp.y = k > .15 ? dy / mx : 0; }
joy.addEventListener('pointerdown', e => { initAudio(); joyId = e.pointerId; try { joy.setPointerCapture(e.pointerId); } catch (er) {} joyMove(e); });
joy.addEventListener('pointermove', e => { if (e.pointerId === joyId) joyMove(e); });
const joyEnd = e => { if (e.pointerId !== joyId) return; joyId = null; knob.style.transform = ''; inp.x = inp.y = 0; };
joy.addEventListener('pointerup', joyEnd); joy.addEventListener('pointercancel', joyEnd);
function bindBtn(id, key) { const b = document.getElementById(id);
  b.addEventListener('pointerdown', e => { e.preventDefault(); initAudio(); inp[key] = true; b.classList.add('on'); try { b.setPointerCapture(e.pointerId); } catch (er) {} });
  const up = () => { inp[key] = false; b.classList.remove('on'); }; b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); }
bindBtn('bAtk', 'atk'); bindBtn('bSk', 'sk');
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault(); initAudio(); });
addEventListener('keyup', e => keys[e.code] = false);

/* ===== 戰鬥 ===== */
function damageMon(m, dmg, fromX, fromY, kb = 140) {
  m.hp -= dmg; m.hit = .15; m.aggro = true;
  const a = Math.atan2(m.y - fromY, m.x - fromX); if (m.type !== 'boss') { m.kx = Math.cos(a) * kb; m.ky = Math.sin(a) * kb; }
  pop(dmg, m.x, m.y - 22, dmg > pl.atk * 1.5 ? '#ffd166' : '#fff', dmg > pl.atk * 1.5 ? 20 : 15);
  for (let i = 0; i < 6; i++) fx.push({ k: 'blood', x: m.x, y: m.y, vx: rnd(-80, 80), vy: rnd(-80, 80), t: .5, c: m.type === 'skel' ? '#e8e2d0' : m.type === 'bat' ? '#5a2a6a' : '#5f8a3a' });
  if (m.hp <= 0) {

  dg.fillStyle = 'rgba(5,3,10,.9)'; dg.fillRect(0, 0, W, H); dg.globalCompositeOperation = 'destination-out';

  let g = dg.createRadialGradient(px, py, 30, px, py, 195 + fl); g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(.6, 'rgba(0,0,0,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)');

    g = dg.createRadialGradient(x, y, 4, x, y, 85); g.addColorStop(0, 'rgba(0,0,0,.85)'); g.addColorStop(1, 'rgba(0,0,0,0)'); dg.fillStyle = g; dg.beginPath(); dg.arc(x, y, 85, 0, 7); dg.fill(); }
  if (door.open || hasKey) { const x = (door.x + .5) * T - camX, y = (door.y + .5) * T - camY; g = dg.createRadialGradient(x, y, 4, x, y, 70); g.addColorStop(0, 'rgba(0,0,0,.8)'); g.addColorStop(1, 'rgba(0,0,0,0)'); dg.fillStyle = g; dg.beginPath(); dg.arc(x, y, 70, 0, 7); dg.fill(); }
  for (const f of fx) if (f.k === 'ring') { const x = f.x - camX, y = f.y - camY; g = dg.createRadialGradient(x, y, 10, x, y, 130); g.addColorStop(0, 'rgba(0,0,0,.9)'); g.addColorStop(1, 'rgba(0,0,0,0)'); dg.fillStyle = g; dg.beginPath(); dg.arc(x, y, 130, 0, 7); dg.fill(); }

  g = ctx.createRadialGradient(px, py, 10, px, py, 170); g.addColorStop(0, 'rgba(255,170,80,.12)'); g.addColorStop(1, 'rgba(255,120,40,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (pl.inv > .45 && state === 'play') { ctx.fillStyle = `rgba(200,0,0,${(pl.inv - .45) * .8})`; ctx.fillRect(0, 0, W, H); }

  if (hasKey && state === 'play') { const dx = (door.x + .5) * T - pl.x, dy = (door.y + .5) * T - pl.y; if (Math.hypot(dx, dy) > 160) { const a = Math.atan2(dy, dx), ex = W / 2 + Math.cos(a) * 120, ey = H / 2 + Math.sin(a) * 160;
    ctx.save(); ctx.translate(ex, ey); ctx.rotate(a); ctx.fillStyle = `rgba(126,231,135,${.6 + Math.sin(t * 6) * .3})`; ctx.beginPath(); ctx.moveTo(14, 0); ctx.lineTo(-6, -9); ctx.lineTo(-2, 0); ctx.lineTo(-6, 9); ctx.fill(); ctx.restore(); } }
  for (const x of texts) if (x.screen) { ctx.globalAlpha = Math.min(1, x.t); ctx.font = `900 ${x.size}px system-ui`; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = '#000d'; ctx.strokeText(x.s, x.x, x.y); ctx.fillStyle = x.col; ctx.fillText(x.s, x.x, x.y); ctx.globalAlpha = 1; }

function drawMini() {

let last = performance.now();

}
